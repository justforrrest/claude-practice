<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      background: #0a0a0b;
      font-family: 'Inter', sans-serif;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 87, 255, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(56, 189, 248, 0.05), transparent);
    }

    .scheduler {
      width: 380px;
      background: #111113;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.5),
        0 24px 64px rgba(0, 0, 0, 0.6),
        0 4px 16px rgba(0, 0, 0, 0.4);
    }

    /* 헤더 */
    .header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
    }

    .header-title {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* 입력 폼 */
    .add-form {
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"] {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #e2e2e2;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      width: 100%;
    }

    input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.2); }

    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="time"]:focus {
      border-color: rgba(124, 58, 237, 0.5);
      background: rgba(124, 58, 237, 0.05);
    }

    input[type="date"],
    input[type="time"] {
      color-scheme: dark;
      flex: 1;
    }

    .add-btn {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 18px;
      cursor: pointer;
      transition: background 0.15s, transform 0.08s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .add-btn:hover { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .add-btn:active { transform: scale(0.97); }

    /* 필터 탭 */
    .filter-tabs {
      display: flex;
      padding: 10px 18px 0;
      gap: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: rgba(255, 255, 255, 0.3);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 10px 8px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      letter-spacing: 0.02em;
    }

    .tab:hover { color: rgba(255, 255, 255, 0.55); }

    .tab.active {
      color: #a78bfa;
      border-bottom-color: #7c3aed;
    }

    /* 일정 목록 */
    .list {
      padding: 8px 0;
      max-height: 380px;
      overflow-y: auto;
    }

    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-track { background: transparent; }
    .list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    .empty {
      text-align: center;
      padding: 40px 0;
      color: rgba(255, 255, 255, 0.2);
      font-size: 13px;
      font-weight: 400;
    }

    /* 일정 항목 */
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 18px;
      transition: background 0.1s;
      position: relative;
    }

    .item:hover { background: rgba(255, 255, 255, 0.025); }

    /* 체크박스 */
    .check {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
    }

    .check:hover { border-color: #7c3aed; }

    .check.done {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      border-color: transparent;
    }

    .check.done::after {
      content: '';
      display: block;
      width: 5px;
      height: 8px;
      border: 1.5px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    /* 일정 정보 */
    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 13px;
      font-weight: 400;
      color: #e2e2e2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s;
    }

    .item-meta {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 2px;
      font-weight: 400;
    }

    /* 완료 상태 */
    .item.done .item-title {
      text-decoration: line-through;
      color: rgba(255, 255, 255, 0.25);
    }

    .item.done .item-meta { color: rgba(255, 255, 255, 0.15); }

    /* 삭제 버튼 */
    .delete-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.2);
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.1s, background 0.1s;
      flex-shrink: 0;
      opacity: 0;
    }

    .item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #f87171; background: rgba(248, 113, 113, 0.1); }

    /* 하단 카운터 */
    .footer {
      padding: 10px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.2);
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="scheduler">
    <div class="header">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <span class="header-title">Schedule</span>
    </div>

    <div class="add-form">
      <input type="text" id="titleInput" placeholder="일정 제목 입력" maxlength="50" />
      <div class="form-row">
        <input type="date" id="dateInput" />
        <input type="time" id="timeInput" />
        <button class="add-btn" onclick="addItem()">추가</button>
      </div>
    </div>

    <div class="filter-tabs">
      <button class="tab active" onclick="setFilter('all', this)">전체</button>
      <button class="tab" onclick="setFilter('todo', this)">미완료</button>
      <button class="tab" onclick="setFilter('done', this)">완료</button>
    </div>

    <div class="list" id="list"></div>

    <div class="footer" id="footer"></div>
  </div>

  <script>
    let items = JSON.parse(localStorage.getItem('schedule') ?? '[]');
    let filter = 'all';

    // 오늘 날짜 기본값
    const today = new Date();
    document.getElementById('dateInput').value = today.toISOString().slice(0, 10);

    function save() {
      localStorage.setItem('schedule', JSON.stringify(items));
    }

    function addItem() {
      const title = document.getElementById('titleInput').value.trim();
      if (!title) {
        document.getElementById('titleInput').focus();
        return;
      }
      const date = document.getElementById('dateInput').value;
      const time = document.getElementById('timeInput').value;

      items.unshift({ id: Date.now(), title, date, time, done: false });
      save();
      render();
      document.getElementById('titleInput').value = '';
      document.getElementById('titleInput').focus();
    }

    function toggleDone(id) {
      const item = items.find(i => i.id === id);
      if (item) { item.done = !item.done; save(); render(); }
    }

    function deleteItem(id) {
      items = items.filter(i => i.id !== id);
      save();
      render();
    }

    function setFilter(f, el) {
      filter = f;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function formatMeta(date, time) {
      const parts = [];
      if (date) {
        const d = new Date(date + 'T00:00:00');
        parts.push(d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }));
      }
      if (time) parts.push(time);
      return parts.join(' · ');
    }

    function render() {
      const listEl = document.getElementById('list');
      const footerEl = document.getElementById('footer');

      const filtered = items.filter(i => {
        if (filter === 'todo') return !i.done;
        if (filter === 'done') return i.done;
        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty">일정이 없습니다</div>`;
      } else {
        listEl.innerHTML = filtered.map(i => `
          <div class="item${i.done ? ' done' : ''}">
            <div class="check${i.done ? ' done' : ''}" onclick="toggleDone(${i.id})"></div>
            <div class="item-info">
              <div class="item-title">${escHtml(i.title)}</div>
              ${formatMeta(i.date, i.time) ? `<div class="item-meta">${formatMeta(i.date, i.time)}</div>` : ''}
            </div>
            <button class="delete-btn" onclick="deleteItem(${i.id})">×</button>
          </div>
        `).join('');
      }

      const total = items.length;
      const done = items.filter(i => i.done).length;
      footerEl.textContent = `전체 ${total}개 · 완료 ${done}개`;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Enter 키로 추가
    document.getElementById('titleInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });

    render();
  </script>
</body>
</html>
