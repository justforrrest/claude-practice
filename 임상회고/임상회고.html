// ══════════════════════ Markdown export ══════════════════════
function safeName(s){ return (s||'무제').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim().slice(0,60)||'무제'; }
function entryToMd(e, imgCb){
  const b=[`## ${e.patientId?('환자: '+patientLabel(e.patientId)):'환자 미지정'}`,''];
  PROMPTS.forEach((p,i)=>{ b.push(`### ${i+1}. ${p.title}`, htmlToMd(e[p.key]||'', imgCb), ''); });
  return b.join('\n');
}
function dateToMd(date, imgCb){
  const es=entriesOn(date);
  const fm=['---','date: '+date,'type: daily-reflection','---',''];
  const b=[`# ${date} (${dow(date)}) 임상 회고`,''];
  es.forEach(e=>{ b.push(entryToMd(e, imgCb), ''); });
  return fm.join('\n')+'\n'+b.join('\n');
}
function patientToMd(p, imgCb){
  const a=patientAge(p);
  const fm=['---','id: '+p.id,'name: '+(p.name||''),'birth: '+(p.birth||''),'age: '+(a!=null?a:''),'sex: '+(p.sex||''),'---',''];
  const b=[`# 환자: ${p.name||'(이름 없음)'}${patientMetaLabel(p)?' ('+patientMetaLabel(p)+')':''}`,''];
  patientEntries(p.id).forEach(e=>{ b.push(`## ${e.date} (${dow(e.date)})`); PROMPTS.forEach((pr,i)=>{ const v=htmlToMd(e[pr.key]||'', imgCb); if(v) b.push(`- **${i+1}. ${pr.title}**`, v, ''); }); b.push(''); });
  const qs=patientQuestions(p.id);
  if(qs.length){ b.push('## 연결된 질문'); qs.forEach(q=>b.push(`- [${q.status}] ${q.title} (${q.id})`)); }
  return fm.join('\n')+'\n'+b.join('\n');
}
function datesWithEntries(){ return [...new Set(db.entries.map(e=>e.date))].sort((a,b)=>b.localeCompare(a)); }
function questionToMd(q, imgCb){
  const fm=['---','id: '+q.id,'title: >'];
  (q.title||'').split('\n').forEach(l=>fm.push('  '+l));
  fm.push('status: '+q.status,'region: '+(q.region||''),'tags: ['+(q.tags||[]).join(', ')+']','origin: '+q.originDate,'created: '+q.created,'updated: '+q.updated,'---','');
  const b=[`## 발단`, `${q.originDate} 회고에서 시작`, ''];
  b.push('## 진행');
  (q.progress||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{
    b.push(`### ${p.date} · ${p.kind}${p.kind==='가설'&&p.version?' v'+p.version:''}`);
    if(p.trigger) b.push('→ 바뀐 계기: '+p.trigger);
    b.push(htmlToMd(p.body||'', imgCb), '');
  });
  if(!(q.progress||[]).length) b.push('');
  const concl=htmlToMd(q.결론||'', imgCb);
  b.push('## 현재 결론', concl?('> '+concl.replace(/\n/g,'\n> ')):'', '');
  return fm.join('\n')+'\n'+b.join('\n');
}
function materialToMd(m, imgCb){
  const fm=['---','id: '+m.id,'title: '+(m.title||''),'type: study-material','created: '+m.created,'updated: '+m.updated,'---',''];
  const b=[`# ${m.title||'(제목 없음)'}`,'', htmlToMd(m.body||'', imgCb)];
  const links=(m.links||[]).map(l=>linkTargetLabel(l.type,l.id)).filter(Boolean);
  if(links.length) b.push('', '## 연결', ...links.map(x=>'- '+x));
  return fm.join('\n')+'\n'+b.join('\n');
}
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
function exportOneFile(){
  if(!db.entries.length && !db.questions.length && !db.materials.length){ toast('내보낼 내용이 없습니다'); return; }
  const days=datesWithEntries().map(d=>dateToMd(d));
  const pts=db.patients.map(p=>patientToMd(p));
  const qs=db.questions.map(q=>questionToMd(q));
  const mats=db.materials.slice().sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).map(m=>materialToMd(m));
  let txt=`# 임상회고 (${today()})\n\n# ── 일지 ──\n\n`+days.join('\n\n---\n\n')+`\n\n# ── 환자 ──\n\n`+pts.join('\n\n---\n\n')+`\n\n# ── 질문 ──\n\n`+qs.join('\n\n---\n\n');
  if(mats.length) txt+=`\n\n# ── 자료 ──\n\n`+mats.join('\n\n---\n\n');
  download(new Blob([txt],{type:'text/markdown;charset=utf-8'}), '임상회고_전체_'+today()+'.md');
  toast('한 파일로 내보냈습니다');
}
function exportZip(){
  const files=[], imgFiles=[], seen=new Map(); let imgSeq=0;
  // <img> → images/ 폴더로 추출하고 상대경로 링크로 대체
  const imgCb=(imgTag)=>{
    const m=/src\s*=\s*["']([^"']+)["']/i.exec(imgTag); if(!m) return '(이미지)';
    const uri=m[1];
    if(seen.has(uri)) return `![](../images/${seen.get(uri)})`;
    const parsed=dataUriToBytes(uri);
    if(!parsed) return `![](${uri})`;   // 외부 URL 이미지는 그대로 링크
    const fname=`img-${String(++imgSeq).padStart(3,'0')}.${parsed.ext}`;
    seen.set(uri,fname); imgFiles.push({name:'images/'+fname, bytes:parsed.bytes});
    return `![](../images/${fname})`;
  };
  datesWithEntries().forEach(date=>files.push({name:'일지/'+date+'.md', content:dateToMd(date, imgCb)}));
  db.patients.forEach(p=>files.push({name:'환자/'+safeName(p.name||p.id)+'.md', content:patientToMd(p, imgCb)}));
  db.questions.forEach(q=>files.push({name:'질문/'+q.id+'.md', content:questionToMd(q, imgCb)}));
  db.materials.forEach(m=>files.push({name:'자료/'+safeName(m.title||m.id)+'.md', content:materialToMd(m, imgCb)}));
  if(!files.length){ toast('내보낼 내용이 없습니다'); return; }
  files.push(...imgFiles);
  download(makeZip(files), '임상회고_'+today()+'.zip');
  toast(files.length+'개 파일을 zip으로 내보냈습니다');
}
function crc32(bytes){ let t=crc32.t; if(!t){ t=crc32.t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } } let crc=0xFFFFFFFF; for(let i=0;i<bytes.length;i++) crc=(crc>>>8)^t[(crc^bytes[i])&0xFF]; return (crc^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc=new TextEncoder(), u16=n=>[n&255,(n>>>8)&255], u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  const chunks=[], central=[]; let offset=0;
  for(const f of files){
    const name=enc.encode(f.name), data=f.bytes?f.bytes:enc.encode(f.content), crc=crc32(data);
    const local=new Uint8Array([].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0)));
    chunks.push(local,name,data);
    const cen=new Uint8Array([].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset)));
    central.push(cen,name); offset+=local.length+name.length+data.length;
  }
  let cenSize=0; central.forEach(c=>cenSize+=c.length);
  const end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cenSize),u32(offset),u16(0)));
  return new Blob([...chunks,...central,end],{type:'application/zip'});
}

// ══════════════════════ Normalize ══════════════════════
let _eidSeq=0;
function normalize(v){
  const out={entries:[],patients:[],questions:[],materials:[]};
  // 환자
  if(v && Array.isArray(v.patients)) v.patients.forEach(p=>out.patients.push({ id:p.id||('P-'+String(out.patients.length+1).padStart(4,'0')), name:p.name||'', birth:p.birth||'', sex:p.sex||'', age:(p.age??null), region:p.region||'', tags:Array.isArray(p.tags)?p.tags:[], created:p.created||today(), updated:p.updated||p.created||today() }));
  const mkEid=()=>'e-mig-'+(_eidSeq++).toString(36);
  // entries (신 스키마)
  if(v && Array.isArray(v.entries)) v.entries.forEach(e=>out.entries.push({ id:e.id||mkEid(), date:e.date, patientId:e.patientId||null, q1:e.q1||'', q2:e.q2||'', q3:e.q3||'', created:e.created||e.date, updated:e.updated||e.date }));
  // 구 스키마 days → entries (환자 미지정)
  if(v && Array.isArray(v.days)) v.days.forEach(d=>out.entries.push({ id:mkEid(), date:d.date, patientId:null, q1:d.q1||'', q2:d.q2||'', q3:d.q3||'', created:d.created||d.date, updated:d.updated||d.date }));
  const qarr = v && Array.isArray(v.questions) ? v.questions : [];
  qarr.forEach(q=>{
    let progress=Array.isArray(q.progress)?q.progress.slice():[];
    // 하위호환: 구 스키마(가설/고민로그) → progress 흡수
    if(!progress.length && (Array.isArray(q.가설)||Array.isArray(q.고민로그))){
      (q.가설||[]).forEach(h=>progress.push({date:h.date||q.created||today(), kind:'가설', version:h.version, trigger:h.trigger||'', body:h.body||''}));
      (q.고민로그||[]).forEach(l=>progress.push({date:l.date||q.created||today(), kind:'고민', body:l.body||''}));
      if((q.적용||'').trim()) progress.push({date:q.updated||today(), kind:'적용', body:q.적용});
      if((q.반응||'').trim()) progress.push({date:q.updated||today(), kind:'반응', body:q.반응});
    }
    progress.forEach(p=>{ if(!p.id) p.id=nextProgId(); });   // 진행 항목 안정 id 백필
    out.questions.push({ id:q.id||nextId(), title:q.title||q.question||'', status:STATUSES.includes(q.status)?q.status:'던짐',
      region:q.region||'', tags:Array.isArray(q.tags)?q.tags:[], originDate:q.originDate||q.created||today(), patientId:q.patientId||null,
      created:q.created||today(), updated:q.updated||q.created||today(), progress, 결론:q.결론||q.현재결론||'' });
  });
  // 자료(공부 아카이브)
  if(v && Array.isArray(v.materials)) v.materials.forEach(m=>out.materials.push({ id:m.id||nextMaterialId(), title:m.title||'', body:m.body||'', links:Array.isArray(m.links)?m.links.filter(l=>l&&(l.type==='question'||l.type==='entry')&&l.id):[], created:m.created||today(), updated:m.updated||m.created||today() }));
  return out;
}

// ══════════════════════ Wiring ══════════════════════
document.getElementById('tabJournal').addEventListener('click',()=>{ state.view='journal'; render(); });
document.getElementById('tabQuestions').addEventListener('click',()=>{ state.view='questions'; render(); });
document.getElementById('tabPatients').addEventListener('click',()=>{ state.view='patients'; render(); });
document.getElementById('tabMaterials').addEventListener('click',()=>{ state.view='materials'; render(); });
document.getElementById('brandBtn').addEventListener('click',()=>{ state.view='journal'; render(); });
document.getElementById('menuBtn').addEventListener('click',openMenu);
let searchT;
document.getElementById('searchInp').addEventListener('input',e=>{ clearTimeout(searchT); searchT=setTimeout(()=>{ state.search=e.target.value.trim(); if(state.view==='questions') renderQuestions(); else if(state.view==='patients') renderPatients(); else if(state.view==='materials') renderMaterials(); },120); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const root=document.getElementById('modalRoot'); if(root.innerHTML){ root.innerHTML=''; } else if(state.view==='detail'){ backFromDetail(); } else if(state.view==='pdetail'){ backFromPatient(); } else if(state.view==='mdetail'){ backFromMaterials(); } } });

// ── 저장 버튼 / 자동저장 flush ──
document.getElementById('saveBtn').addEventListener('click',()=>{ flushAutoSave(); saveData(); toast('저장됨'); });
window.addEventListener('beforeunload',()=>{ flushAutoSave(); });

// ── 이미지: 파일 선택 삽입 ──
document.getElementById('imgFileInput').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value='';
  if(!f||!_imgTargetBox) return;
  const r=new FileReader(); r.onload=ev=>insertImageInto(_imgTargetBox,ev.target.result); r.readAsDataURL(f);
});

// ── 이미지 드래그 리사이즈 (전역 1회 바인딩) ──
let selectedImg=null, imgDragging=false, imgDragX=0, imgDragW=0;
function selectImg(img){ deselectImg(); selectedImg=img; img.classList.add('img-selected'); positionOverlay(); }
function deselectImg(){ if(selectedImg) selectedImg.classList.remove('img-selected'); selectedImg=null; document.getElementById('imgOverlay').classList.remove('active'); }
function positionOverlay(){ if(!selectedImg) return; const r=selectedImg.getBoundingClientRect(); const ov=document.getElementById('imgOverlay'); ov.style.left=r.left+'px'; ov.style.top=r.top+'px'; ov.style.width=r.width+'px'; ov.style.height=r.height+'px'; ov.classList.add('active'); }
document.addEventListener('click',e=>{ if(e.target.tagName==='IMG' && e.target.closest('.pbox')) selectImg(e.target); else if(e.target.id!=='imgHandleSE') deselectImg(); });
document.getElementById('imgHandleSE').addEventListener('mousedown',e=>{ e.preventDefault(); e.stopPropagation(); if(!selectedImg) return; imgDragging=true; imgDragX=e.clientX; imgDragW=selectedImg.getBoundingClientRect().width; document.body.style.userSelect='none'; });
document.addEventListener('mousemove',e=>{ if(!imgDragging||!selectedImg) return; const box=selectedImg.closest('.pbox'); const boxW=box?box.getBoundingClientRect().width:selectedImg.parentElement.getBoundingClientRect().width; const newW=Math.max(40,imgDragW+(e.clientX-imgDragX)); const pct=Math.min(100,Math.round(newW/boxW*100)); selectedImg.style.width=pct+'%'; selectedImg.style.height='auto'; positionOverlay(); });
document.addEventListener('mouseup',()=>{ if(!imgDragging) return; imgDragging=false; document.body.style.userSelect=''; if(selectedImg){ const box=selectedImg.closest('.pbox'); if(box){ pendingBox=box; scheduleAutoSave(); } } });
window.addEventListener('resize',positionOverlay);
document.querySelector('.scroll').addEventListener('scroll',positionOverlay,true);

async function init(){
  const v=await loadFromCloud();
  db = v?normalize(v):{entries:[],patients:[],questions:[],materials:[]};
  render();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
init();
</script>
