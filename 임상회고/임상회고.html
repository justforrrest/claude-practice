<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#7C3AED">
<title>임상회고</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none!important;}
:root{
  --bg:#F7F7F8;--surface:#FFFFFF;--surface-2:#F3F3F5;
  --border:rgba(0,0,0,0.08);--border-2:rgba(0,0,0,0.12);
  --violet:#5b21b6;--violet-d:#7c3aed;--violet-light:#EDE9FE;--violet-faint:#F5F3FF;
  --text-1:#0f0f10;--text-2:#374151;--text-3:#6b7280;--text-4:#9ca3af;
  --font-sans:'Inter','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'SFMono-Regular',Consolas,monospace;--radius:10px;
  --s-throw:#64748b;--s-throw-bg:#f1f5f9;
  --s-think:#7c3aed;--s-think-bg:#f5f3ff;
  --s-apply:#0891b2;--s-apply-bg:#ecfeff;
  --s-done:#16a34a;--s-done-bg:#f0fdf4;
  --amber:#d97706;--amber-bg:#fffbeb;
}
html,body{height:100%;}
body{background:var(--bg);font-family:var(--font-sans);color:var(--text-1);display:flex;flex-direction:column;height:100vh;overflow:hidden;-webkit-text-size-adjust:100%;}

/* ── Header ── */
.app-header{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px;background:linear-gradient(135deg,var(--violet-d) 0%,#EC4899 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;cursor:pointer;}
.tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:9px;padding:3px;}
.tab{padding:6px 15px;border:none;background:none;font-size:13px;font-weight:600;color:var(--text-3);border-radius:7px;cursor:pointer;font-family:var(--font-sans);transition:all .12s;white-space:nowrap;}
.tab.active{background:var(--surface);color:var(--violet-d);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.search-wrap{flex:1;position:relative;max-width:360px;}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-4);pointer-events:none;}
.search-inp{width:100%;padding:8px 11px 8px 33px;border:1px solid var(--border-2);border-radius:8px;font-size:13px;font-family:var(--font-sans);color:var(--text-1);background:var(--surface-2);outline:none;transition:border-color .15s,background .15s;}
.search-inp:focus{border-color:var(--violet-d);background:var(--surface);box-shadow:0 0 0 2px var(--violet-light);}
.search-inp::placeholder{color:var(--text-4);}
.spacer{flex:1;}
.btn-primary{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;background:var(--violet-d);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:var(--font-sans);cursor:pointer;white-space:nowrap;transition:opacity .15s;}
.btn-primary:hover{opacity:.9;}
.btn-primary:active{transform:scale(.97);}
.btn-soft{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;font-size:13px;font-weight:600;color:var(--text-3);font-family:var(--font-sans);cursor:pointer;white-space:nowrap;transition:all .12s;}
.btn-soft:hover{background:var(--violet-light);color:var(--violet-d);border-color:var(--violet-light);}
.btn-soft:active{transform:scale(.97);}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;color:var(--text-2);cursor:pointer;transition:background .12s;flex-shrink:0;}
.icon-btn:hover{background:var(--violet-light);color:var(--violet-d);}

.scroll{flex:1;overflow-y:auto;}
.wrap{max-width:720px;margin:0 auto;padding:22px 20px 90px;}
.wrap.wide{max-width:1000px;}

/* ── Journal 2단 레이아웃 ── */
.journal-layout{display:flex;gap:20px;align-items:flex-start;}
.journal-main{flex:1;min-width:0;}
.journal-main .day{margin-bottom:0;}
.journal-side{width:250px;flex-shrink:0;position:sticky;top:0;}

/* ── Journal (일지) ── */
.journal-head{display:flex;align-items:baseline;gap:9px;margin:2px 0 14px;}
.journal-head h1{font-size:17px;font-weight:700;letter-spacing:-.3px;}
.journal-head .sub{font-size:12.5px;color:var(--text-4);}

/* ── Calendar ── */
.cal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px 16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.cal-title{font-size:15px;font-weight:700;letter-spacing:-.2px;}
.cal-arrow{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;color:var(--text-2);cursor:pointer;transition:background .12s;flex-shrink:0;}
.cal-arrow:hover{background:var(--violet-light);color:var(--violet-d);}
.cal-today-btn{margin-left:auto;font-size:12px;font-weight:600;color:var(--violet-d);background:var(--violet-faint);border:none;border-radius:7px;padding:6px 12px;cursor:pointer;font-family:var(--font-sans);transition:background .12s;}
.cal-today-btn:hover{background:var(--violet-light);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--text-4);padding:4px 0 6px;}
.cal-dow.sun{color:#dc2626;}.cal-dow.sat{color:#2563eb;}
.cal-day{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--text-2);border-radius:9px;cursor:pointer;transition:background .1s,color .1s;user-select:none;}
.cal-day:hover{background:var(--surface-2);}
.cal-day.empty{cursor:default;}
.cal-day.empty:hover{background:none;}
.cal-day.sun{color:#dc2626;}.cal-day.sat{color:#2563eb;}
.cal-day.today{font-weight:700;color:var(--violet-d);}
.cal-day.selected{background:var(--violet-d);color:#fff;font-weight:700;}
.cal-day.selected.sun,.cal-day.selected.sat{color:#fff;}
.cal-day .dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--violet-d);}
.cal-day.selected .dot{background:#fff;}
/* 사이드에 놓인 작은 달력 */
.journal-side .cal{padding:12px 12px 13px;margin-bottom:0;}
.journal-side .cal-nav{margin-bottom:9px;gap:6px;}
.journal-side .cal-title{font-size:13.5px;}
.journal-side .cal-arrow{width:26px;height:26px;}
.journal-side .cal-today-btn{font-size:11px;padding:5px 9px;}
.journal-side .cal-grid{gap:2px;}
.journal-side .cal-dow{font-size:10px;padding:2px 0 4px;}
.journal-side .cal-day{font-size:12px;border-radius:7px;}
.journal-side .cal-day .dot{bottom:3px;width:3.5px;height:3.5px;}

.day{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.day.today{box-shadow:0 6px 22px rgba(124,58,237,.10);border-color:var(--violet-light);}
.day-head{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
.day-date{font-size:15px;font-weight:700;letter-spacing:-.2px;}
.day-dow{font-size:12.5px;color:var(--text-4);}
.day-today-badge{font-size:11px;font-weight:700;color:var(--violet-d);background:var(--violet-faint);border-radius:20px;padding:2px 9px;}
.day-rel{font-size:11.5px;color:var(--text-4);margin-left:auto;}

.prompt{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px 12px;transition:border-color .14s,box-shadow .14s;}
.prompt:focus-within{border-color:var(--violet-light);box-shadow:0 0 0 3px var(--violet-faint);}
.prompt-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
.pnum{flex-shrink:0;width:21px;height:21px;border-radius:50%;background:var(--violet-faint);color:var(--violet-d);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1;}
.ptitle{font-size:13.5px;font-weight:600;color:var(--text-1);}
.phint{font-size:11.5px;color:var(--text-4);}
.pbox{width:100%;min-height:42px;font-size:13.5px;line-height:1.7;color:var(--text-1);font-family:var(--font-sans);outline:none;word-break:break-word;overflow-wrap:anywhere;caret-color:#111;cursor:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="20"><line x1="8" y1="1" x2="8" y2="19" stroke="%23111" stroke-width="1.2"/><line x1="4" y1="1" x2="12" y2="1" stroke="%23111" stroke-width="1.2"/><line x1="4" y1="19" x2="12" y2="19" stroke="%23111" stroke-width="1.2"/></svg>') 8 10, text;}
.pbox:empty::before{content:attr(data-ph);color:var(--text-4);pointer-events:none;}
.pbox img{max-width:100%;border-radius:6px;margin:4px 0;display:block;cursor:pointer;}
.pbox img.img-selected{outline:2px solid var(--violet-d);outline-offset:1px;}
.pbox h2{font-size:16px;font-weight:700;margin:7px 0 3px;letter-spacing:-.2px;}
.pbox h3{font-size:14.5px;font-weight:700;margin:6px 0 2px;}
.pbox ul{margin:4px 0 4px;padding-left:20px;}
.pbox li{margin:1px 0;}
.pbox hr{border:none;border-top:1px solid var(--border-2);margin:9px 0;}
.pbox b,.pbox strong{font-weight:700;}
/* 프레임 있는 리치 에디터 (결론·진행·자료 본문) */
.pbox.framed{background:var(--surface-2);border:1px solid var(--border-2);border-radius:9px;padding:10px 12px;transition:border-color .14s,box-shadow .14s;}
.pbox.framed:focus{border-color:var(--violet-d);box-shadow:0 0 0 2px var(--violet-light);background:var(--surface);}
.prog-text img{max-width:100%;border-radius:6px;margin:4px 0;display:block;}
/* 서식 툴바 (일지 전용, 헤더 아래 sticky) */
.efmt-bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:7px 10px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);opacity:.55;transition:opacity .15s;}
.efmt-bar.armed{opacity:1;}
.efmt-btn{background:none;border:none;cursor:pointer;padding:5px 9px;border-radius:6px;font-size:13px;color:var(--text-2);font-family:var(--font-sans);line-height:1;transition:background .1s,color .1s;}
.efmt-btn:hover{background:var(--surface-2);color:var(--text-1);}
.efmt-btn b{font-weight:800;}
.efmt-btn u{text-decoration:underline;}
.efmt-hl{width:20px;height:20px;padding:0;border-radius:4px;border:2px solid var(--border-2);cursor:pointer;flex-shrink:0;transition:border-color .1s;}
.efmt-hl:hover{border-color:var(--violet-d);}
.efmt-sep{width:1px;height:16px;background:var(--border-2);margin:0 3px;flex-shrink:0;}
#imgOverlay{display:none;position:fixed;z-index:200;border:2px solid var(--violet-d);border-radius:4px;pointer-events:none;box-sizing:border-box;}
#imgOverlay.active{display:block;}
#imgHandleSE{position:absolute;bottom:-5px;right:-5px;width:10px;height:10px;background:var(--violet-d);border-radius:2px;cursor:nwse-resize;pointer-events:auto;}
/* 지난 날짜(읽기 모드) 텍스트 */
.ptext{font-size:13.5px;line-height:1.68;color:var(--text-2);white-space:pre-wrap;padding:1px 2px;}
.ptext.empty{color:var(--text-4);font-style:normal;}

.link-cta{margin-top:9px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--violet-d);background:var(--violet-faint);border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-family:var(--font-sans);transition:background .12s;}
.link-cta:hover{background:var(--violet-light);}

/* 그날 연결된 질문 */
.day-qs{margin-top:16px;padding-top:14px;border-top:1px dashed var(--border-2);}
.day-qs-label{font-size:11px;font-weight:700;color:var(--text-4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.qref{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:background .1s;}
.qref:hover{background:var(--surface-2);}
.qref .qref-dot{margin-top:5px;width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.qref-main{flex:1;min-width:0;}
.qref-kind{font-size:10.5px;font-weight:700;color:var(--text-4);margin-right:5px;}
.qref-born{font-size:10.5px;font-weight:700;color:var(--violet-d);background:var(--violet-faint);border-radius:5px;padding:1px 6px;margin-right:5px;}
.qref-title{font-size:13px;color:var(--text-1);line-height:1.5;}
.qref-body{font-size:12px;color:var(--text-3);line-height:1.55;margin-top:2px;white-space:pre-wrap;}
.qref-id{font-family:var(--mono);font-size:10.5px;color:var(--text-4);}

/* ── Entry (환자 회고) ── */
.add-entry{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--violet-d);background:var(--violet-faint);border:none;border-radius:8px;padding:6px 11px;cursor:pointer;font-family:var(--font-sans);transition:background .12s;}
.add-entry:hover{background:var(--violet-light);}
.entry{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 15px;margin-top:14px;}
.entry-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--violet);background:var(--violet-faint);border:none;border-radius:20px;padding:4px 11px;cursor:pointer;font-family:var(--font-sans);transition:background .12s;}
.pchip:hover{background:var(--violet-light);}
.pchip svg{opacity:.8;}
.pchip.pchip-empty{color:var(--text-3);background:var(--surface);border:1px dashed var(--border-2);}
.pchip.pchip-static{cursor:default;}
/* 환자 상세 헤더 카드 (목록 카드와 통일) */
.pdetail-card{cursor:default;margin-bottom:20px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.pchip-inp{border:none;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--violet);outline:none;padding:0;}
.pchip-inp::placeholder{color:var(--violet);opacity:.5;}
.badge-inp{border:none;background:transparent;font-family:inherit;font-size:11px;font-weight:600;color:var(--violet);outline:none;padding:0;}
.badge-inp::placeholder{color:var(--violet);opacity:.55;}
.badge-region #pAgeHint{margin-left:3px;}
.sex-toggle.sex-sm{padding:1px;}
.sex-toggle.sex-sm .sex-opt{padding:3px 10px;font-size:11.5px;}
.fu-toggle{font-size:11.5px;font-weight:600;color:var(--text-3);background:var(--surface);border:1px solid var(--border-2);border-radius:20px;padding:4px 10px;cursor:pointer;font-family:var(--font-sans);transition:all .12s;}
.fu-toggle:hover{border-color:var(--violet-d);color:var(--violet-d);}
.entry-del{margin-left:auto;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text-4);cursor:pointer;border-radius:7px;transition:all .12s;flex-shrink:0;}
.entry-del:hover{background:#fef2f2;color:#dc2626;}
.fu-prev{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin:6px 0 10px;}
.fu-item{display:flex;gap:9px;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1.5;}
.fu-item:hover{background:var(--surface-2);}
.fu-date{flex-shrink:0;font-family:var(--mono);font-size:11px;color:var(--violet-d);font-weight:600;}
.fu-sum{color:var(--text-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 환자 선택 모달 */
.patient-pick-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
.patient-pick{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--surface);border:1px solid var(--border-2);border-radius:9px;cursor:pointer;font-family:var(--font-sans);text-align:left;transition:all .12s;}
.patient-pick:hover{border-color:var(--violet-d);background:var(--violet-faint);}
.pp-name{font-size:13px;font-weight:600;color:var(--text-1);}
.pp-region{font-size:11.5px;color:var(--violet);background:var(--violet-faint);border-radius:5px;padding:1px 7px;}
.pp-count{margin-left:auto;font-size:11px;color:var(--text-4);}
.pick-or{text-align:center;font-size:11.5px;color:var(--text-4);margin:6px 0 12px;}
.link-patient{font-size:12.5px;color:var(--text-2);background:var(--violet-faint);border-radius:8px;padding:8px 11px;margin-bottom:12px;}
/* 환자 타임라인 */
.pt-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:box-shadow .14s,transform .1s;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.pt-item:hover{box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-1px);}
.pt-date{font-size:12.5px;font-weight:700;color:var(--text-1);margin-bottom:6px;}
.pt-rel{font-size:11px;font-weight:500;color:var(--text-4);margin-left:4px;}
.pt-q{display:flex;gap:7px;font-size:12.5px;line-height:1.55;color:var(--text-2);margin-top:3px;}
.pt-qn{flex-shrink:0;width:16px;height:16px;border-radius:50%;background:var(--violet-faint);color:var(--violet-d);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px;}
.pt-qt{min-width:0;}
/* 읽기 전용 리치 HTML 표시 (타임라인 등) */
.rich-html{font-size:12.5px;line-height:1.6;color:var(--text-2);}
.rich-html img{max-width:100%;border-radius:6px;margin:4px 0;display:block;}
.rich-html h2{font-size:14px;font-weight:700;margin:5px 0 2px;}
.rich-html h3{font-size:13px;font-weight:700;margin:4px 0 2px;}
.rich-html ul{margin:3px 0;padding-left:18px;}
.rich-html hr{border:none;border-top:1px solid var(--border-2);margin:7px 0;}
.rich-html b,.rich-html strong{font-weight:700;}
/* 연결 칩 */
.link-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.link-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:var(--violet-faint);color:var(--violet);border-radius:20px;padding:3px 6px 3px 10px;max-width:100%;}
.link-chip.lc-e{background:var(--surface-2);color:var(--text-2);}
.link-chip .lc-icon{font-size:11px;line-height:1;}
.link-chip .lc-open{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px;}
.link-chip .lc-open:hover{text-decoration:underline;}
.link-chip .lc-x{border:none;background:none;color:inherit;opacity:.6;cursor:pointer;font-size:14px;line-height:1;padding:0 2px;border-radius:4px;}
.link-chip .lc-x:hover{opacity:1;background:rgba(0,0,0,.06);}
.entry-ctas{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;}
.entry-mats{margin-top:8px;}
/* 선택 모달 리스트 */
.pick-list{display:flex;flex-direction:column;gap:5px;max-height:230px;overflow-y:auto;}
.pick-row{display:flex;align-items:center;gap:8px;text-align:left;background:var(--surface-2);border:1px solid var(--border-2);border-radius:9px;padding:8px 11px;cursor:pointer;font-family:var(--font-sans);transition:all .12s;}
.pick-row:hover{border-color:var(--violet-d);background:var(--surface);}
.pick-row .pr-main{font-size:13px;font-weight:600;color:var(--text-1);flex-shrink:0;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

<script>
// ══════════════════════ Firebase / Sync ══════════════════════
let _fdb;
try {
  firebase.initializeApp({apiKey:"AIzaSyBlmjCfXn80Ybew7xkIPkrqyOBxulWL_aM",authDomain:"weekly-planner-a2f78.firebaseapp.com",projectId:"weekly-planner-a2f78",storageBucket:"weekly-planner-a2f78.firebasestorage.app",messagingSenderId:"497461587642",appId:"1:497461587642:web:9ddbdcf093497aa7495c83"});
  _fdb = firebase.firestore();
} catch(e) {
  _fdb = {collection:()=>({doc:()=>({get:async()=>({exists:false}),set:async()=>{}})})};
}
const SYNC_LS_KEY = 'study-notes-sync';   // 공부노트와 코드 공유
const DATA_LS_KEY = 'clinical-reflection-data';
const STALE_DAYS = 14;

function getSyncCode(){ let c=localStorage.getItem(SYNC_LS_KEY); if(!c){ c=rnd3()+rnd3(); localStorage.setItem(SYNC_LS_KEY,c); } return c; }
function rnd3(){ return Math.random().toString(36).substr(2,3).toUpperCase(); }
let syncState='동기화 대기';
function setSyncState(t){ syncState=t; document.querySelectorAll('.sync-status').forEach(el=>el.textContent=t); }
async function loadFromCloud(){
  try{ const doc=await _fdb.collection('users').doc(getSyncCode()).collection('data').doc(DATA_LS_KEY).get();
    if(doc.exists){ const v=doc.data().value; localStorage.setItem(DATA_LS_KEY,JSON.stringify(v)); setSyncState('☁ 동기화됨'); return v; } }
  catch(e){ setSyncState('오프라인'); }
  try{ const v=localStorage.getItem(DATA_LS_KEY); return v?JSON.parse(v):null; }catch(e){ return null; }
}
async function saveToCloud(data){
  try{ localStorage.setItem(DATA_LS_KEY, JSON.stringify(data)); }catch(e){}
  try{ setSyncState('동기화 중…'); await _fdb.collection('users').doc(getSyncCode()).collection('data').doc(DATA_LS_KEY).set({value:data,ts:Date.now()}); setSyncState('☁ 동기화됨'); }
  catch(e){ setSyncState('오프라인'); }
}

// ══════════════════════ Data ══════════════════════
let db = { entries:[], patients:[], questions:[], materials:[] };
function saveData(){ saveToCloud(db); }
const STATUSES = ['던짐','고민중','적용중','결론'];
const STATUS_STYLE = { '던짐':{c:'var(--s-throw)',bg:'var(--s-throw-bg)'},'고민중':{c:'var(--s-think)',bg:'var(--s-think-bg)'},'적용중':{c:'var(--s-apply)',bg:'var(--s-apply-bg)'},'결론':{c:'var(--s-done)',bg:'var(--s-done-bg)'} };
const KINDS = ['가설','고민','적용','반응'];
const PROMPTS = [
  {key:'q1', title:'오늘 되돌아 볼 환자는?', hint:'예상과 달랐거나, 진행이 더디거나, 판단이 어려웠던 case'},
  {key:'q2', title:'나는 어떻게 판단했고, 무엇이 불확실했나?', hint:'나의 판단 · 판단의 근거 · 남은 의문'},
  {key:'q3', title:'다음에는 무엇을 확인하고 적용해볼까?', hint:'다음 내원시 확인할 것, 적용할 것, 공부할 것'},
];
// 프롬프트별 자동 채우기 골격 템플릿 (빈 칸일 때만)
const TEMPLATES = {
  q1: '▸ 치료 횟수: <br>▸ 경과: <br>▸ 오늘 진료: <br>▸ 생각해 볼 점: ',
  q3: '▸ 다음에 확인할 것: <br>▸ 다음에 적용할 것: <br>▸ 추가로 공부할 것: ',
};

// ══════════════════════ Utils ══════════════════════
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dow(dateStr){ return ['일','월','화','수','목','금','토'][new Date(dateStr+'T00:00:00').getDay()]; }
function daysBetween(dateStr){ const a=new Date(dateStr+'T00:00:00'), b=new Date(today()+'T00:00:00'); return Math.round((b-a)/86400000); }
function relLabel(dateStr){ const d=daysBetween(dateStr); if(d===0) return '오늘'; if(d===1) return '어제'; if(d===2) return '그제'; if(d>0) return d+'일 전'; return ''; }
function nextId(){ const y=new Date().getFullYear(); let max=0; db.questions.forEach(q=>{ const m=/^(\d{4})-(\d{4})$/.exec(q.id||''); if(m&&+m[1]===y) max=Math.max(max,+m[2]); }); return y+'-'+String(max+1).padStart(4,'0'); }
function nextEntryId(){ return 'e-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function nextProgId(){ return 'pr-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function nextMaterialId(){ return 'm-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function getProg(q,pid){ return (q.progress||[]).find(p=>p.id===pid); }
function getMaterial(id){ return db.materials.find(m=>m.id===id); }
// ── 자료 ↔ 질문/일지 연결 ──
function materialsForQuestion(qid){ return db.materials.filter(m=>(m.links||[]).some(l=>l.type==='question'&&l.id===qid)); }
function materialsForEntry(eid){ return db.materials.filter(m=>(m.links||[]).some(l=>l.type==='entry'&&l.id===eid)); }
function matLinkedTo(m,type,id){ return (m.links||[]).some(l=>l.type===type&&l.id===id); }
function toggleMatLink(m,type,id){ if(!m) return; m.links=m.links||[]; const i=m.links.findIndex(l=>l.type===type&&l.id===id); if(i>=0) m.links.splice(i,1); else m.links.push({type,id}); m.updated=today(); }
function pruneMatLinks(type,id){ db.materials.forEach(m=>{ if(m.links&&m.links.length){ const before=m.links.length; m.links=m.links.filter(l=>!(l.type===type&&l.id===id)); if(m.links.length!==before) m.updated=today(); } }); }
function linkTargetLabel(type,id){
  if(type==='question'){ const q=getQ(id); if(!q) return null; return '#'+q.id+' '+(htmlToText(q.title).slice(0,28)||'(제목 없음)'); }
  const e=getEntry(id); if(!e) return null; const p=getPatient(e.patientId); return e.date+' ('+dow(e.date)+') · '+(p?(p.name||'(이름 없음)'):'미지정');
}
function nextPatientId(){ let max=0; db.patients.forEach(p=>{ const m=/^P-(\d{4})$/.exec(p.id||''); if(m) max=Math.max(max,+m[1]); }); return 'P-'+String(max+1).padStart(4,'0'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// ── 리치 콘텐츠(HTML) 헬퍼 ──
function looksLikeHtml(s){ return /<[a-z!/][\s\S]*>/i.test(s||''); }
// 구버전 plain text → HTML (하위호환): 태그가 없으면 escape 후 \n→<br>
function toHtml(s){ if(!s) return ''; if(looksLikeHtml(s)) return s; return esc(s).replace(/\n/g,'<br>'); }
// HTML → 순수 텍스트 (요약·검색·빈값 판정용)
function htmlToText(html){ if(!html) return ''; const d=document.createElement('div'); d.innerHTML=String(html).replace(/<(br|div|p|hr|h[1-3]|li)[^>]*>/gi,'\n$&'); return (d.textContent||'').replace(/\n{2,}/g,'\n').trim(); }
function isBlankHtml(html){ if(!html) return true; if(/<img\b/i.test(html)) return false; return htmlToText(html)===''; }
// HTML → Markdown (내보내기용). imgMode: 'skip'=(이미지) 표시, function=콜백으로 대체 문자열 반환
function htmlToMd(html, imgMode){
  if(!html) return '';
  let s=String(html);
  s=s.replace(/<img\b[^>]*>/gi, m=>{ if(typeof imgMode==='function') return imgMode(m); return '(이미지)'; });
  s=s.replace(/<h2[^>]*>([\s\S]*?)<\/h2>/gi,(m,t)=>'\n## '+htmlToText(t)+'\n');
  s=s.replace(/<h3[^>]*>([\s\S]*?)<\/h3>/gi,(m,t)=>'\n### '+htmlToText(t)+'\n');
  s=s.replace(/<hr[^>]*>/gi,'\n---\n');
  s=s.replace(/<li[^>]*>([\s\S]*?)<\/li>/gi,(m,t)=>'\n- '+htmlToText(t));
  s=s.replace(/<\/(ul|ol)>/gi,'\n');
  s=s.replace(/<(strong|b)>([\s\S]*?)<\/(strong|b)>/gi,(m,x,t)=>'**'+htmlToText(t)+'**');
  s=s.replace(/<br\s*\/?>/gi,'\n');
  s=s.replace(/<\/(div|p)>/gi,'\n');
  const d=document.createElement('div'); d.innerHTML=s;
  return (d.textContent||'').replace(/\n{3,}/g,'\n\n').replace(/[ \t]+\n/g,'\n').trim();
}
// data URI → {ext, bytes(Uint8Array)}
function dataUriToBytes(uri){ const m=/^data:image\/([a-z0-9.+-]+);base64,(.*)$/i.exec(uri||''); if(!m) return null;
  let ext=m[1].toLowerCase(); if(ext==='jpeg') ext='jpg'; if(ext==='svg+xml') ext='svg';
  const bin=atob(m[2]); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return {ext,bytes}; }
function isStale(q){ return q.status==='고민중' && daysBetween(q.updated) >= STALE_DAYS; }
function getQ(id){ return db.questions.find(q=>q.id===id); }
function getEntry(id){ return db.entries.find(e=>e.id===id); }
function entriesOn(date){ return db.entries.filter(e=>e.date===date).sort((a,b)=>(a.created||'').localeCompare(b.created||'')); }
function entryHasContent(e){ return !isBlankHtml(e.q1)||!isBlankHtml(e.q2)||!isBlankHtml(e.q3); }
function getPatient(id){ return db.patients.find(p=>p.id===id); }
function patientLabel(id){ const p=getPatient(id); return p?(p.name||'(이름 없음)'):''; }
function patientEntries(pid){ return db.entries.filter(e=>e.patientId===pid).sort((a,b)=>a.date.localeCompare(b.date)); }
function patientQuestions(pid){ return db.questions.filter(q=>q.patientId===pid); }
function createPatient(name,opts){ opts=opts||{}; const p={id:nextPatientId(), name:name||'', birth:opts.birth||'', sex:opts.sex||'', age:(opts.age??null), region:opts.region||'', tags:[], created:today(), updated:today()}; db.patients.push(p); return p; }
function touchPatient(p){ if(p) p.updated=today(); }
// 생년월일 → 정규화 / 만나이
function normalizeBirth(str){ const s=(str||'').replace(/[^0-9]/g,''); let y,m,d;
  if(s.length===8){ y=+s.slice(0,4); m=+s.slice(4,6); d=+s.slice(6,8); }
  else if(s.length===6){ let yy=+s.slice(0,2); const cur=new Date().getFullYear()%100; y=yy<=cur?2000+yy:1900+yy; m=+s.slice(2,4); d=+s.slice(4,6); }
  else return '';
  if(m<1||m>12||d<1||d>31) return '';
  const dt=new Date(y,m-1,d); if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return '';
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function ageFromBirth(birth){ if(!/^\d{4}-\d{2}-\d{2}$/.test(birth||'')) return null; const b=new Date(birth+'T00:00:00'), n=new Date(); let a=n.getFullYear()-b.getFullYear(); const md=n.getMonth()-b.getMonth(); if(md<0||(md===0&&n.getDate()<b.getDate())) a--; return (a>=0&&a<150)?a:null; }
function patientAge(p){ if(!p) return null; const a=ageFromBirth(p.birth); return a!=null?a:(p.age!=null?p.age:null); }
function patientMetaLabel(p){ const a=patientAge(p); const parts=[]; if(p&&p.region) parts.push(p.region); if(a!=null) parts.push(a+'세'); if(p&&p.sex) parts.push(p.sex); return parts.join(' · '); }
// 입력값(생년월일 또는 나이 숫자) 파싱 → {birth,age}
function parseAgeInput(str){ const raw=(str||'').trim(); if(!raw) return {birth:'',age:null};
  const b=normalizeBirth(raw); if(b) return {birth:b, age:null};
  const n=raw.replace(/[^0-9]/g,''); if(n && +n<=120 && n.length<=3) return {birth:'', age:+n};
  return {birth:'', age:null};
}
function ageInputValue(p){ if(p&&p.birth) return p.birth; if(p&&p.age!=null) return String(p.age); return ''; }
function parseTags(str){ return (str||'').split(',').map(t=>t.trim()).filter(Boolean); }
function touchQ(q){ q.updated=today(); }
function autoGrow(ta){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
function lastHypVersion(q){ let v=0; (q.progress||[]).forEach(p=>{ if(p.kind==='가설'&&p.version) v=Math.max(v,p.version); }); return v; }
let toastT; function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1900); }
function bindBlur(el,fn){ el.addEventListener('blur',()=>fn(el)); }

const _tD=new Date();
const state = { view:'journal', currentId:null, currentPatientId:null, currentMaterialId:null, filter:{status:null,region:null,tag:null,staleOnly:false}, search:'', selectedDate:today(), calY:_tD.getFullYear(), calM:_tD.getMonth(), fuOpen:new Set() };
const wrapEl = ()=>document.getElementById('wrap');

function render(){
  const searchWrap=document.getElementById('searchWrap');
  document.getElementById('tabJournal').classList.toggle('active', state.view==='journal');

  document.getElementById('tabPatients').classList.toggle('active', state.view==='patients'||state.view==='pdetail');
  document.getElementById('tabMaterials').classList.toggle('active', state.view==='materials'||state.view==='mdetail');

  searchWrap.hidden = !searchable;
  const si=document.getElementById('searchInp'); if(si) si.placeholder = state.view==='patients' ? '환자·별칭·부위 검색' : state.view==='materials' ? '자료 제목·내용 검색' : '질문·태그·부위 검색';

  if(state.view==='journal') renderJournal();
  else if(state.view==='questions') renderQuestions();
  else if(state.view==='patients') renderPatients();

  else if(state.view==='materials') renderMaterials();
  else if(state.view==='mdetail') renderMaterialDetail();
  else renderDetail();
}

// ══════════════════════ Journal view ══════════════════════
function activeDateSet(){
  // 내용 있는 회고가 있는 날 + 질문이 태어난 날 + 진행이 더해진 날 = 활동이 있는 모든 날짜
  const set=new Set();
  db.entries.forEach(e=>{ if(entryHasContent(e)) set.add(e.date); });
  db.questions.forEach(q=>{ if(q.originDate) set.add(q.originDate); (q.progress||[]).forEach(p=>{ if(p.date) set.add(p.date); }); });
  return set;
}
function renderJournal(){
  const set=activeDateSet();
  let h=`<div class="journal-head"><h1>일일 임상 회고</h1><span class="sub">하루를 돌아보고, 질문을 이어가세요</span></div>`;
  h+=fmtBarHtml();
  h+=`<div class="journal-layout"><div class="journal-main">${dayHtml(state.selectedDate)}</div><div class="journal-side">${renderCalendar(set)}</div></div>`;
  wrapEl().innerHTML=h;
  bindCalendar();
  bindJournal();
  bindFmtBar();
}

function renderCalendar(set){
  const y=state.calY, m=state.calM;   // m: 0-based
  const first=new Date(y,m,1), lead=first.getDay(), dim=new Date(y,m+1,0).getDate();
  const DOW=['일','월','화','수','목','금','토'];
  let g='';
  DOW.forEach((d,i)=>g+=`<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`);
  for(let i=0;i<lead;i++) g+=`<div class="cal-day empty"></div>`;
  for(let day=1;day<=dim;day++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const wd=new Date(y,m,day).getDay();
    const cls=['cal-day', wd===0?'sun':wd===6?'sat':'', ds===today()?'today':'', ds===state.selectedDate?'selected':''].filter(Boolean).join(' ');
    g+=`<div class="${cls}" data-date="${ds}">${day}${set.has(ds)?'<span class="dot"></span>':''}</div>`;
  }
  return `<div class="cal">
    <div class="cal-nav">
      <button class="cal-arrow" data-mon="-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="cal-title">${y}년 ${m+1}월</span>
      <button class="cal-arrow" data-mon="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="cal-today-btn" id="calToday">오늘</button>
    </div>
    <div class="cal-grid">${g}</div>
  </div>`;
}
function bindCalendar(){
  const w=wrapEl();
  w.querySelectorAll('[data-mon]').forEach(b=>b.addEventListener('click',()=>{
    let m=state.calM+(+b.dataset.mon);
    if(m<0){ m=11; state.calY--; } else if(m>11){ m=0; state.calY++; }
    state.calM=m; renderJournal();
  }));
  w.querySelector('#calToday').addEventListener('click',()=>{ const d=new Date(); state.calY=d.getFullYear(); state.calM=d.getMonth(); state.selectedDate=today(); renderJournal(); });
  w.querySelectorAll('.cal-day[data-date]').forEach(c=>c.addEventListener('click',()=>{ state.selectedDate=c.dataset.date; renderJournal(); }));
}

function questionsBornOn(date){ return db.questions.filter(q=>q.originDate===date); }
function progressOn(date){ const out=[]; db.questions.forEach(q=>(q.progress||[]).forEach((p,idx)=>{ if(p.date===date && !(q.originDate===date && idx===0 && p.kind==='가설' && p.version===1)) out.push({q,p}); })); return out; }

function dayHtml(date){
  const isToday=date===today();
  const entries=entriesOn(date);
  let h=`<div class="day ${isToday?'today':''}" data-date="${date}">
    <div class="day-head">
      <span class="day-date">${date}</span><span class="day-dow">(${dow(date)})</span>
      ${isToday?'<span class="day-today-badge">오늘</span>':''}
      <span class="day-rel">${isToday?'':relLabel(date)}</span>
      <button class="add-entry" data-add-entry="${date}">＋ 환자 회고</button>
    </div>`;
  if(entries.length){
    h+=entries.map(e=>entryHtml(e,isToday)).join('');
  } else {
    h+=`<div class="ptext empty" style="margin-top:10px;">이 날 기록이 없습니다. <b>＋ 환자 회고</b>로 회고를 시작하세요.</div>`;
  }
  // 그날 연결된 질문 / 진행 (날짜 단위)
  const born=questionsBornOn(date), progs=progressOn(date);
  if(born.length || progs.length){
    h+=`<div class="day-qs"><div class="day-qs-label">이 날의 질문</div>`;
    born.forEach(q=>{ const stl=STATUS_STYLE[q.status];
      h+=`<div class="qref" data-open="${q.id}"><span class="qref-dot" style="background:${stl.c}"></span>
        <div class="qref-main"><div><span class="qref-born">질문 탄생</span>${q.patientId?`<span class="qref-kind">${esc(patientLabel(q.patientId))}</span>`:''}<span class="qref-id">${q.id}</span></div>
        <div class="qref-title">${esc(q.title)}</div></div></div>`;
    });
    progs.forEach(({q,p})=>{
      h+=`<div class="qref" data-open="${q.id}"><span class="qref-dot" style="background:var(--border-2)"></span>
        <div class="qref-main"><div><span class="qref-kind">${p.kind}${p.kind==='가설'&&p.version?' v'+p.version:''}</span><span class="qref-id">${q.id}</span></div>
        <div class="qref-body">${esc((p.body||'').slice(0,120))}${(p.body||'').length>120?'…':''}</div></div></div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

function entryHtml(e,isToday){
  const p=getPatient(e.patientId);
  const past=e.patientId ? patientEntries(e.patientId).filter(x=>x.id!==e.id) : [];
  const fuOpen=state.fuOpen.has(e.id);
  let h=`<div class="entry" data-eid="${e.id}">
    <div class="entry-head">`;
  if(p){
    const meta=patientMetaLabel(p);
    h+=`<button class="pchip" data-patient="${p.id}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/></svg>${esc(p.name||'(이름 없음)')}${meta?` · ${esc(meta)}`:''}</button>`;
  } else {
    h+=`<button class="pchip pchip-empty" data-assign="${e.id}">＋ 환자 지정</button>`;
  }
  if(past.length){ h+=`<button class="fu-toggle" data-fu="${e.id}">이 환자 지난 기록 ${past.length} ${fuOpen?'▾':'▸'}</button>`; }
  h+=`<button class="entry-del" data-del-entry="${e.id}" title="회고 삭제"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6"/></svg></button>`;
  h+=`</div>`;
  if(fuOpen && past.length){
    h+=`<div class="fu-prev">`;
    past.slice().reverse().forEach(x=>{
      const sum=htmlToText(x.q1||x.q2||x.q3||'').replace(/\s+/g,' ').trim().slice(0,110);
      h+=`<div class="fu-item" data-goto="${x.date}"><span class="fu-date">${x.date} (${dow(x.date)})</span><span class="fu-sum">${esc(sum)||'—'}</span></div>`;
    });
    h+=`</div>`;
  }
  PROMPTS.forEach((pr,i)=>{
    const val=toHtml(e[pr.key]||'');
    const display=(isToday && TEMPLATES[pr.key] && isBlankHtml(val)) ? TEMPLATES[pr.key] : val;
    h+=`<div class="prompt">
      <div class="prompt-head"><span class="pnum">${i+1}</span><span class="ptitle">${pr.title}</span></div>
      <div class="pbox" contenteditable="true" spellcheck="false" data-eid="${e.id}" data-key="${pr.key}" data-ph="${esc(pr.hint)}">${display}</div>
    </div>`;
  });
  h+=`<div class="entry-ctas"><button class="link-cta" data-link-entry="${e.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>이 회고에서 질문 잇기</button>`;
  h+=`<button class="link-cta cta-mat" data-mat-entry="${e.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19.5V6a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v13"/><path d="M6 17h13"/></svg>자료 연결</button></div>`;
  const emats=materialsForEntry(e.id);
  if(emats.length){ h+=`<div class="entry-mats" data-emats="${e.id}">${matChipsHtml(emats)}</div>`; }
  h+=`</div>`;
  return h;
}

function bindJournal(){

// ══════════════════════ 리치 에디터 (일지 회고 박스) ══════════════════════
let _activeBox=null, pendingBox=null, _imgTargetBox=null, _autoSaveTimer=null;
const SUBS=[['<->','↔'],['->','→'],['=>','⇒']];   // 긴 규칙 먼저

// 서식 툴바 arm/disarm
function armFmtBar(box){ _activeBox=box; const bar=document.getElementById('efmtBar'); if(bar) bar.classList.add('armed'); }
function disarmFmtBarSoon(){ setTimeout(()=>{ const ae=document.activeElement; if(!ae||!ae.classList||!ae.classList.contains('pbox')){ const bar=document.getElementById('efmtBar'); if(bar) bar.classList.remove('armed'); } },160); }
// 리치 에디터(.pbox) 공통 바인딩. opts.commit(html)->changed:bool, opts.template(선택, 빈값 판정용)
function bindRichBox(box, opts){
  opts=opts||{};
  box._commit=()=>{
    if(!opts.commit) return false;
    let v=box.innerHTML;
    if(isBlankHtml(v)) v='';
    else if(opts.template && htmlToText(v).trim()===htmlToText(opts.template).trim()) v='';
    return !!opts.commit(v);
  };
  box.addEventListener('focus',()=>armFmtBar(box));
  box.addEventListener('input',()=>{ applySubstitution(box); pendingBox=box; scheduleAutoSave(); });
  box.addEventListener('paste',onPboxPaste);
  box.addEventListener('keydown',e=>{
    if(e.key==='Tab'){ e.preventDefault(); applyIndent(e.shiftKey?'out':'in'); return; }
    if(e.ctrlKey||e.metaKey){ if(e.key==='b'){ e.preventDefault(); applyFmt('bold'); } else if(e.key==='u'){ e.preventDefault(); applyFmt('underline'); } }
  });
  box.addEventListener('blur',()=>{ if(box._commit()) saveData(); disarmFmtBarSoon(); });
}
function scheduleAutoSave(){ clearTimeout(_autoSaveTimer); _autoSaveTimer=setTimeout(flushAutoSave,700); }
function flushAutoSave(){
  clearTimeout(_autoSaveTimer); _autoSaveTimer=null;
  let changed=false;
  document.querySelectorAll('.pbox').forEach(b=>{ if(b._commit && b._commit()) changed=true; });
  if(changed) saveData();
  return changed;
}
// 텍스트 자동 치환 (커서 앞 감지)
function applySubstitution(box){
  const sel=window.getSelection(); if(!sel.rangeCount) return;
  const range=sel.getRangeAt(0); const node=range.startContainer;
  if(node.nodeType!==Node.TEXT_NODE) return;
  const offset=range.startOffset, text=node.textContent;
  for(const [from,to] of SUBS){
    if(offset>=from.length && text.slice(offset-from.length,offset)===from){
      node.textContent=text.slice(0,offset-from.length)+to+text.slice(offset);
      const r=document.createRange(); r.setStart(node, offset-from.length+to.length); r.collapse(true);
      sel.removeAllRanges(); sel.addRange(r); return;
    }
  }
}
// 서식 적용 (현재 활성 박스에)
function applyFmt(cmd,val){ const t=_activeBox; if(!t) return; t.focus(); document.execCommand(cmd,false,val||null); pendingBox=t; scheduleAutoSave(); }
// 문단 들여쓰기/내어쓰기 (blockquote 대신 CSS 여백으로)
function applyIndent(dir){ const t=_activeBox; if(!t) return; t.focus(); try{ document.execCommand('styleWithCSS',false,true); }catch(e){} document.execCommand(dir==='out'?'outdent':'indent'); try{ document.execCommand('styleWithCSS',false,false); }catch(e){} pendingBox=t; scheduleAutoSave(); }
function toggleHeading(tag){ const t=_activeBox; if(!t) return; t.focus();
  const sel=window.getSelection(); const cur=sel.rangeCount?sel.getRangeAt(0).startContainer:null;
  const el=cur?(cur.nodeType===Node.TEXT_NODE?cur.parentElement:cur):null; const active=el?el.closest('h1,h2,h3'):null;
  document.execCommand('formatBlock',false,(active&&active.tagName.toLowerCase()===tag)?'div':tag); pendingBox=t; scheduleAutoSave(); }
function bindFmtBar(){
  const bar=document.getElementById('efmtBar'); if(!bar) return;
  bar.querySelectorAll('[data-heading]').forEach(btn=>btn.addEventListener('mousedown',e=>{ e.preventDefault(); toggleHeading(btn.dataset.heading); }));
  const md=(id,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener('mousedown',e=>{ e.preventDefault(); fn(); }); };
  md('efmtBold',()=>applyFmt('bold'));
  md('efmtUnderline',()=>applyFmt('underline'));
  md('efmtUL',()=>applyFmt('insertUnorderedList'));
  md('efmtIndent',()=>applyIndent('in'));
  md('efmtOutdent',()=>applyIndent('out'));
  md('efmtHR',()=>applyFmt('insertHorizontalRule'));
  md('efmtClear',()=>applyFmt('removeFormat'));
  bar.querySelectorAll('.efmt-hl').forEach(btn=>btn.addEventListener('mousedown',e=>{ e.preventDefault(); applyFmt('hiliteColor',btn.dataset.hl); }));
  const img=document.getElementById('efmtImg');
  if(img) img.addEventListener('mousedown',e=>{ e.preventDefault(); if(!_activeBox){ toast('먼저 입력할 칸을 클릭하세요'); return; } _imgTargetBox=_activeBox; document.getElementById('imgFileInput').click(); });
}
// 이미지 삽입 (붙여넣기·파일 공용)
function insertImageInto(box,dataUrl){
  box.focus();
  const img=document.createElement('img'); img.src=dataUrl;
  const sel=window.getSelection();
  if(sel.rangeCount && box.contains(sel.getRangeAt(0).startContainer)){
    const range=sel.getRangeAt(0); range.deleteContents(); range.insertNode(img);
    range.setStartAfter(img); range.collapse(true); sel.removeAllRanges(); sel.addRange(range);
  } else box.appendChild(img);
  pendingBox=box; scheduleAutoSave();
}
function onPboxPaste(e){
  const box=e.currentTarget; const items=e.clipboardData&&e.clipboardData.items; if(!items) return;
  for(const it of items){ if(it.type&&it.type.startsWith('image/')){ e.preventDefault(); const r=new FileReader(); r.onload=ev=>insertImageInto(box,ev.target.result); r.readAsDataURL(it.getAsFile()); return; } }
}

// ══════════════════════ Questions view ══════════════════════
function allRegions(){ return [...new Set(db.questions.map(q=>q.region).filter(Boolean))]; }
function allTags(){ const s=new Set(); db.questions.forEach(q=>(q.tags||[]).forEach(t=>s.add(t))); return [...s]; }
function matchesQ(q){
  const f=state.filter;
  if(f.region && q.region!==f.region) return false;
  if(f.tag && !(q.tags||[]).includes(f.tag)) return false;
  if(f.staleOnly && !isStale(q)) return false;
  if(state.search){ const s=state.search.toLowerCase();
    const hay=[q.title,q.region,(q.tags||[]).join(' '),(q.progress||[]).map(p=>htmlToText(p.body)).join(' '),htmlToText(q.결론)].join(' ').toLowerCase();
    if(!hay.includes(s)) return false; }
  return true;
}
function renderQuestions(){
  if(db.questions.length===0){
    wrapEl().innerHTML=`<div class="empty-wrap">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--violet-d)" stroke-width="1.4"><path d="M12 3a9 9 0 0 0-9 9c0 4.97 4.03 9 9 9 .7 0 1.38-.08 2.03-.23"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.24c-.9.5-1.1 1-1.1 1.76v.5"/><circle cx="12" cy="17" r=".9" fill="var(--violet-d)" stroke="none"/></svg>
      <div><h2>아직 이어진 질문이 없습니다</h2><p>일지에서 하루를 회고하고 "질문 잇기"로 질문을 만들면, 여기 쌓이고 날짜를 따라 자랍니다.</p></div>
      <button class="btn-ghost" id="goJournal">일지로 가기</button></div>`;
    document.getElementById('goJournal').onclick=()=>{ state.view='journal'; render(); };
    return;
  }
  const f=state.filter, regions=allRegions(), tags=allTags();
  const staleCount=db.questions.filter(isStale).length;
  let fh='';
  if(staleCount>0) fh+=`<button class="fchip ${f.staleOnly?'active':''}" data-stale>⏳ 방치 ${staleCount}</button>`;
  if(regions.length){ fh+='<span class="fchip-label">부위</span>'; regions.forEach(r=>fh+=`<button class="fchip ${f.region===r?'active':''}" data-region="${esc(r)}">${esc(r)}${f.region===r?' <span class="x">×</span>':''}</button>`); }
  if(tags.length){ fh+='<span class="fchip-label">태그</span>'; tags.forEach(t=>fh+=`<button class="fchip ${f.tag===t?'active':''}" data-tag="${esc(t)}">#${esc(t)}${f.tag===t?' <span class="x">×</span>':''}</button>`); }

  const filtered=db.questions.filter(matchesQ);
  let gh='';
  STATUSES.forEach(st=>{
    const items=filtered.filter(q=>q.status===st).sort((a,b)=>b.updated.localeCompare(a.updated));
    if(!items.length) return;
    const stl=STATUS_STYLE[st];
    gh+=`<div class="qgroup"><div class="qgroup-head"><span class="qgroup-dot" style="background:${stl.c}"></span><span class="qgroup-title">${st}</span><span class="qgroup-count">${items.length}</span></div>`;
    gh+=items.map(qcardHtml).join('')+`</div>`;
  });
  if(!gh) gh=`<div class="emptyline" style="text-align:center;padding:30px;">조건에 맞는 질문이 없습니다.</div>`;
  wrapEl().innerHTML=(fh?`<div class="qfilter">${fh}</div>`:'')+gh;

  const w=wrapEl();
  w.querySelector('[data-stale]')?.addEventListener('click',()=>{ f.staleOnly=!f.staleOnly; renderQuestions(); });
  w.querySelectorAll('[data-region]').forEach(b=>b.addEventListener('click',()=>{ f.region=f.region===b.dataset.region?null:b.dataset.region; renderQuestions(); }));
  w.querySelectorAll('[data-tag]').forEach(b=>b.addEventListener('click',()=>{ f.tag=f.tag===b.dataset.tag?null:b.dataset.tag; renderQuestions(); }));
  w.querySelectorAll('.qcard').forEach(c=>c.addEventListener('click',()=>openDetail(c.dataset.id)));
}
function qcardHtml(q){
  const hypV=lastHypVersion(q), progN=(q.progress||[]).length;
  const tags=(q.tags||[]).slice(0,4).map(t=>`<span class="tag">#${esc(t)}</span>`).join('');
  return `<div class="qcard" data-id="${esc(q.id)}">
    <div class="qcard-top"><span class="qcard-id">${esc(q.id)}</span>
      ${q.region?`<span class="badge badge-region">${esc(q.region)}</span>`:''}
      ${isStale(q)?`<span class="badge badge-stale">방치 ${daysBetween(q.updated)}일</span>`:''}</div>
    <div class="qcard-title">${esc(q.title)||'<span style="color:var(--text-4)">(제목 없음)</span>'}</div>
    ${tags?`<div class="qcard-tags">${tags}</div>`:''}
    <div class="qcard-foot"><span>${hypV?'가설 <b>v'+hypV+'</b>':'가설 없음'}</span><span>진행 <b>${progN}</b></span><span class="cf-date">${esc(q.updated)} 갱신</span></div>
  </div>`;
}

// ══════════════════════ Question detail ══════════════════════
function openDetail(id){ if(state.view!=='detail') state._backTo=state.view; state.view='detail'; state.currentId=id; document.querySelector('.scroll').scrollTop=0; render(); }
function backFromDetail(){ state.view = state._backTo||'questions'; state._backTo=null; state.currentId=null; render(); }

function renderDetail(){
  const q=getQ(state.currentId); if(!q){ state.view='questions'; render(); return; }
  const stl=STATUS_STYLE[q.status];
  const statusOpts=STATUSES.map(s=>`<option value="${s}" ${s===q.status?'selected':''}>${s}</option>`).join('');
  let h=`<button class="detail-back" id="backBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>뒤로</button>
    ${fmtBarHtml()}
    <div class="qcard pdetail-card">
      <div class="qcard-top"><span class="detail-id">#${esc(q.id)}</span>
        <select class="status-sel" id="statusSel" style="color:${stl.c};background-color:${stl.bg};">${statusOpts}</select>
        ${isStale(q)?`<span class="badge badge-stale">방치 ${daysBetween(q.updated)}일</span>`:''}</div>
      <textarea class="q-title" id="qTitle" rows="1" placeholder="임상 질문">${esc(q.title)}</textarea>

    </div>

    <div class="section"><div class="sec-head"><span class="sec-title">진행</span><span class="sec-hint">날짜를 따라 이어지는 생각의 이동</span>
      <button class="sec-add" id="addProgBtn">＋ 진행 추가</button></div>
      <div id="progWrap">${renderProgress(q)}</div><div id="progAdd"></div></div>

    <div class="section"><div class="sec-head"><span class="sec-title">현재 결론</span><span class="sec-hint">한 문장. 아직 없으면 비워둠</span></div>
      <div class="pbox framed concl" id="qConcl" contenteditable="true" spellcheck="false" data-ph="지금 시점의 잠정 결론">${toHtml(q.결론||'')}</div></div>

    <div class="section"><div class="sec-head"><span class="sec-title">관련 자료</span><span class="sec-hint">이 질문과 연결된 공부 자료</span><button class="sec-add" id="qMatBtn">＋ 자료 연결</button></div>
      ${matChipsHtml(materialsForQuestion(q.id))}</div>

    <div style="margin-top:24px;text-align:center;"><button class="btn-ghost" id="delBtn" style="color:#dc2626;border-color:#fca5a5;">이 질문 삭제</button></div>`;
  wrapEl().innerHTML=h;

  const w=wrapEl();
  w.querySelector('#backBtn').addEventListener('click',backFromDetail);
  w.querySelector('#originLink').addEventListener('click',()=>{ gotoDate(q.originDate); });
  w.querySelector('#patientLink')?.addEventListener('click',()=>openPatient(q.patientId));
  w.querySelector('#statusSel').addEventListener('change',e=>{ q.status=e.target.value; touchQ(q); saveData(); const s=STATUS_STYLE[q.status]; e.target.style.color=s.c; e.target.style.backgroundColor=s.bg; });
  const qt=w.querySelector('#qTitle'); autoGrow(qt); qt.addEventListener('input',()=>autoGrow(qt));
  bindBlur(qt,el=>{ if(q.title!==el.value){ q.title=el.value; touchQ(q); saveData(); } });
  w.querySelector('#qMeta').querySelectorAll('[data-meta-edit]').forEach(b=>b.addEventListener('click',()=>openQMetaEdit(q)));
  bindRichBox(w.querySelector('#qConcl'), { commit:(v)=>{ if(q.결론===v) return false; q.결론=v; touchQ(q); return true; } });
  w.querySelector('#addProgBtn').addEventListener('click',showAddProg);
  w.querySelector('#delBtn').addEventListener('click',()=>openConfirm('이 질문을 삭제할까요?','되돌릴 수 없습니다.',()=>{ db.questions=db.questions.filter(x=>x.id!==q.id); pruneMatLinks('question',q.id); saveData(); state.view='questions'; render(); toast('삭제됨'); }));
  bindProgress(q);
  w.querySelector('#qMatBtn').addEventListener('click',()=>openMaterialPicker('이 질문에 연결할 자료', mid=>{ toggleMatLink(getMaterial(mid),'question',q.id); saveData(); renderDetail(); }));
  bindMatChips(w, { open:(mid)=>openMaterial(mid), unlink:(mid)=>{ toggleMatLink(getMaterial(mid),'question',q.id); saveData(); renderDetail(); } });
  bindFmtBar();
}
// 질문 부위·태그: 채우면 배지, 비면 ＋ 추가
function qMetaHtml(q){
  const tags=(q.tags||[]).filter(Boolean);
  const has=(q.region&&q.region.trim())||tags.length;
  if(!has) return `<button class="meta-edit" data-meta-edit>＋ 부위·태그</button>`;
  let s='';
  if(q.region&&q.region.trim()) s+=`<span class="badge badge-region">${esc(q.region)}</span>`;
  s+=tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('');
  s+=`<button class="meta-edit meta-edit-pencil" data-meta-edit title="부위·태그 편집">✎</button>`;
  return s;
}
function openQMetaEdit(q){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="overlay" id="ov"><div class="modal" style="max-width:420px;">
    <div class="modal-head"><span class="modal-title">부위 · 태그</span><button class="modal-close" id="mc">×</button></div>
    <div class="modal-body">
      <div class="mfield"><label>부위</label><input id="qmRegion" value="${esc(q.region||'')}" placeholder="예: 요추 / 슬관절" autocomplete="off"></div>
      <div class="mfield"><label>태그</label><input id="qmTags" value="${esc((q.tags||[]).join(', '))}" placeholder="쉼표로 구분" autocomplete="off"></div>
    </div>
    <div class="modal-foot"><button class="btn-ghost" id="qmCancel">취소</button><button class="btn-primary" id="qmSave">저장</button></div>
  </div></div>`;
  const close=()=>root.innerHTML='';
  root.querySelector('#mc').onclick=close; root.querySelector('#qmCancel').onclick=close;
  root.querySelector('#ov').addEventListener('mousedown',e=>{ if(e.target.id==='ov') close(); });
  root.querySelector('#qmRegion').focus();
  root.querySelector('#qmSave').onclick=()=>{
    const r=root.querySelector('#qmRegion').value.trim(), t=parseTags(root.querySelector('#qmTags').value);
    let ch=false;
    if((q.region||'')!==r){ q.region=r; ch=true; }
    if((q.tags||[]).join(',')!==t.join(',')){ q.tags=t; ch=true; }
    if(ch){ touchQ(q); saveData(); }
    close(); renderDetail();
  };
}

function renderProgress(q){
  const ps=(q.progress||[]).slice().sort((a,b)=> a.date===b.date?0:a.date.localeCompare(b.date));
  if(!ps.length) return `<div class="emptyline">아직 진행이 없습니다. 첫 가설이나 고민을 더해보세요.</div>`;
  return ps.map((p,i)=>{
    if(!p.id) p.id=nextProgId();
    const dotC = p.kind==='가설'?'var(--violet-d)':p.kind==='적용'?'var(--s-apply)':p.kind==='반응'?'var(--s-done)':'var(--text-4)';
    const showTrig = (p.kind==='가설'&&(p.version||0)>1) || !!p.trigger;
    return `<div class="prog" data-pid="${p.id}"><div class="prog-rail"><span class="prog-dot" style="background:${dotC}"></span>${i<ps.length-1?'<span class="prog-line"></span>':''}</div>
      <div class="prog-body"><div class="prog-meta"><span class="prog-kind k-${p.kind}">${p.kind}${p.kind==='가설'&&p.version?' v'+p.version:''}</span><span class="prog-date">${esc(p.date)}</span><button class="prog-del" data-delprog="${p.id}" title="진행 삭제">✕</button></div>
      ${showTrig?`<div class="prog-trigger"><b>→ 계기:</b> <input class="inline-inp prog-trig-inp" data-pid="${p.id}" value="${esc(p.trigger||'')}" placeholder="바뀐 계기"></div>`:''}
      <div class="pbox framed prog-text" contenteditable="true" spellcheck="false" data-pid="${p.id}" data-ph="내용">${toHtml(p.body)}</div></div></div>`;
  }).join('');
}
function bindProgress(q){
  const w=wrapEl();
  w.querySelectorAll('.prog-text[data-pid]').forEach(box=>{
    bindRichBox(box, { commit:(v)=>{ const it=getProg(q,box.dataset.pid); if(!it||it.body===v) return false; it.body=v; touchQ(q); return true; } });
  });
  w.querySelectorAll('.prog-trig-inp').forEach(inp=>{
    bindBlur(inp, el=>{ const it=getProg(q,el.dataset.pid); if(it && (it.trigger||'')!==el.value.trim()){ it.trigger=el.value.trim(); touchQ(q); saveData(); } });
  });
  w.querySelectorAll('[data-delprog]').forEach(b=>b.addEventListener('click',()=>{
    openConfirm('이 진행을 삭제할까요?','되돌릴 수 없습니다.',()=>{ q.progress=(q.progress||[]).filter(x=>x.id!==b.dataset.delprog); touchQ(q); saveData(); renderDetail(); toast('삭제됨'); });
  }));
}

let addKind='가설';
function showAddProg(){
  const q=getQ(state.currentId);
  addKind='가설';
  const wrap=document.getElementById('progAdd');
  const nextV=lastHypVersion(q)+1;
  wrap.innerHTML=`<div class="addpanel">
    <div class="kind-row">${KINDS.map(k=>`<button class="kind-btn ${k===addKind?'active':''}" data-kind="${k}">${k}</button>`).join('')}</div>
    <div id="trigRow" ${nextV>1?'':'style="display:none"'}><textarea class="field trig" id="pTrig" placeholder="→ 무엇을 알게 되어 이전 가설에서 바뀌었나? (트리거)"></textarea></div>
    <div class="pbox framed" id="pBody" contenteditable="true" spellcheck="false" data-ph="내용"></div>
    <div class="addpanel-actions"><span class="adate">날짜: ${today()}</span>
      <button class="btn-sm cancel" id="pCancel">취소</button><button class="btn-sm save" id="pSave">추가</button></div>
  </div>`;
  const body=wrap.querySelector('#pBody'); body.focus();
  bindRichBox(body, {});
  wrap.querySelectorAll('.field').forEach(t=>t.addEventListener('input',()=>autoGrow(t)));
  wrap.querySelectorAll('.kind-btn').forEach(b=>b.addEventListener('click',()=>{
    addKind=b.dataset.kind; wrap.querySelectorAll('.kind-btn').forEach(x=>x.classList.toggle('active',x.dataset.kind===addKind));
    wrap.querySelector('#trigRow').style.display=(addKind==='가설'&&nextV>1)?'':'none';
  }));
  wrap.querySelector('#pCancel').onclick=()=>wrap.innerHTML='';
  wrap.querySelector('#pSave').onclick=()=>{
    const bodyV=body.innerHTML; if(isBlankHtml(bodyV)){ toast('내용을 적어주세요'); return; }
    const item={id:nextProgId(), date:today(), kind:addKind, body:bodyV};
    if(addKind==='가설'){ item.version=nextV; const t=wrap.querySelector('#pTrig').value.trim(); if(nextV>1&&!t){ toast('가설이 바뀐 계기(트리거)를 적어주세요'); wrap.querySelector('#pTrig').focus(); return; } item.trigger=t; }
    q.progress=q.progress||[]; q.progress.push(item);
    // 상태 자연 전이 제안: 가설 추가 시 던짐→고민중
    if(addKind==='가설' && q.status==='던짐') q.status='고민중';
    if(addKind==='적용' && (q.status==='던짐'||q.status==='고민중')) q.status='적용중';
    touchQ(q); saveData(); renderDetail();
  };
}

// ══════════════════════ Patients view ══════════════════════
function openPatient(pid){ state._pback = (state.view==='pdetail') ? state._pback : state.view; state.view='pdetail'; state.currentPatientId=pid; document.querySelector('.scroll').scrollTop=0; render(); }
function backFromPatient(){ state.view = (state._pback && state._pback!=='pdetail') ? state._pback : 'patients'; state._pback=null; state.currentPatientId=null; render(); }
function patientLastDate(pid){ const es=patientEntries(pid); return es.length? es[es.length-1].date : ''; }
function matchesP(p){
  if(!state.search) return true;
  const s=state.search.toLowerCase();
  const hay=[p.name,p.sex,patientMetaLabel(p)].join(' ').toLowerCase();
  return hay.includes(s);
}
function renderPatients(){
  if(db.patients.length===0){
    wrapEl().innerHTML=`<div class="empty-wrap">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--violet-d)" stroke-width="1.4"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 16 0v1"/></svg>
      <div><h2>아직 등록된 환자가 없습니다</h2><p>일지에서 "＋ 환자 회고"로 환자를 만들면, 같은 환자의 경과가 날짜를 따라 이어져 여기 모입니다.</p></div>
      <button class="btn-ghost" id="goJournal2">일지로 가기</button></div>`;
    document.getElementById('goJournal2').onclick=()=>{ state.view='journal'; render(); };
    return;
  }
  const list=db.patients.filter(matchesP).sort((a,b)=>(patientLastDate(b.id)||'').localeCompare(patientLastDate(a.id)||''));
  let h='';
  if(!list.length){ h=`<div class="emptyline" style="text-align:center;padding:30px;">조건에 맞는 환자가 없습니다.</div>`; }
  else h=list.map(p=>{
    const n=patientEntries(p.id).length, qn=patientQuestions(p.id).length, last=patientLastDate(p.id);
    const meta=patientMetaLabel(p);
    return `<div class="qcard" data-pid="${p.id}">
      <div class="qcard-top"><span class="pchip pchip-static"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/></svg>${esc(p.name||'(이름 없음)')}</span>
        ${meta?`<span class="badge badge-region">${esc(meta)}</span>`:''}</div>
      <div class="qcard-foot"><span>회고 <b>${n}</b></span><span>질문 <b>${qn}</b></span><span class="cf-date">${last?esc(last)+' 마지막':'기록 없음'}</span></div>
    </div>`;
  }).join('');
  wrapEl().innerHTML=h;
  wrapEl().querySelectorAll('.qcard[data-pid]').forEach(c=>c.addEventListener('click',()=>openPatient(c.dataset.pid)));

function renderPatientDetail(){
  const p=getPatient(state.currentPatientId); if(!p){ state.view='patients'; render(); return; }
  const es=patientEntries(p.id).slice().reverse();   // 최신 위로
  const qs=patientQuestions(p.id);
  const last=patientLastDate(p.id);
  const ageHint=p.birth ? (patientAge(p)!=null?'· 만 '+patientAge(p)+'세':'') : (p.age!=null?'세':'');
  let h=`<button class="detail-back" id="pBack"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>뒤로</button>
    <div class="qcard pdetail-card">
      <div class="qcard-top">
        <span class="pchip pchip-static"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/></svg><input class="pchip-inp" id="pName" value="${esc(p.name)}" placeholder="이름" size="${Math.max((p.name||'').length,4)}"></span>
        <span class="badge badge-region"><input class="badge-inp" id="pBirth" value="${esc(ageInputValue(p))}" placeholder="나이" size="${Math.max(ageInputValue(p).length,2)}"><span id="pAgeHint">${ageHint}</span></span>
        <div class="sex-toggle sex-sm" id="pSex"><button type="button" class="sex-opt ${p.sex==='남'?'active':''}" data-sex="남">남</button><button type="button" class="sex-opt ${p.sex==='여'?'active':''}" data-sex="여">여</button></div>
      </div>
      <div class="qcard-foot"><span>회고 <b>${es.length}</b></span><span>질문 <b>${qs.length}</b></span><span class="cf-date">${last?esc(last)+' 마지막':'기록 없음'}</span></div>
    </div>

    <div class="section"><div class="sec-head"><span class="sec-title">회고 타임라인</span><span class="sec-hint">날짜순 경과 · 클릭하면 그 날 일지로</span></div>`;
  if(!es.length) h+=`<div class="emptyline">아직 이 환자의 회고가 없습니다.</div>`;
  else es.forEach(e=>{
    h+=`<div class="pt-item" data-goto="${e.date}"><div class="pt-date">${e.date} (${dow(e.date)}) <span class="pt-rel">${relLabel(e.date)}</span></div>`;
    PROMPTS.forEach((pr,i)=>{ const raw=e[pr.key]||''; if(!isBlankHtml(raw)) h+=`<div class="pt-q"><span class="pt-qn">${i+1}</span><div class="pt-qt rich-html">${toHtml(raw)}</div></div>`; });
    if(!entryHasContent(e)) h+=`<div class="pt-q" style="color:var(--text-4)">(내용 없음)</div>`;
    h+=`</div>`;
  });
  h+=`</div>`;

  if(qs.length){
    h+=`<div class="section"><div class="sec-head"><span class="sec-title">연결된 질문</span></div>`;
    qs.slice().sort((a,b)=>b.updated.localeCompare(a.updated)).forEach(q=>{ const stl=STATUS_STYLE[q.status];
      h+=`<div class="qcard" data-openq="${q.id}"><div class="qcard-top"><span class="qcard-id">${esc(q.id)}</span><span class="badge" style="color:${stl.c};background:${stl.bg}">${q.status}</span></div>
        <div class="qcard-title">${esc(q.title)||'(제목 없음)'}</div></div>`;
    });
    h+=`</div>`;
  }
  h+=`<div style="margin-top:24px;text-align:center;"><button class="btn-ghost" id="pDel" style="color:#dc2626;border-color:#fca5a5;">이 환자 삭제</button></div>`;
  wrapEl().innerHTML=h;

  const w=wrapEl();
  w.querySelector('#pBack').addEventListener('click',backFromPatient);
  const nm=w.querySelector('#pName');
  nm.addEventListener('input',()=>{ nm.size=Math.max(nm.value.length,4); });
  bindBlur(nm,el=>{ if(p.name!==el.value){ p.name=el.value; touchPatient(p); saveData(); } });
  const pb=w.querySelector('#pBirth'), pbh=w.querySelector('#pAgeHint');
  pb.addEventListener('input',()=>{ pb.size=Math.max(pb.value.length,2); });
  bindBlur(pb,el=>{ const r=parseAgeInput(el.value); if(p.birth!==r.birth || p.age!==r.age){ p.birth=r.birth; p.age=r.age; touchPatient(p); saveData(); } el.value=ageInputValue(p); el.size=Math.max(el.value.length,2); pbh.textContent=p.birth?(patientAge(p)!=null?'· 만 '+patientAge(p)+'세':''):(p.age!=null?'세':''); });
  w.querySelectorAll('#pSex .sex-opt').forEach(b=>b.addEventListener('click',()=>{ const v=(p.sex===b.dataset.sex)?'':b.dataset.sex; p.sex=v; touchPatient(p); saveData(); w.querySelectorAll('#pSex .sex-opt').forEach(x=>x.classList.toggle('active',x.dataset.sex===v)); }));
  w.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>gotoDate(b.dataset.goto)));
  w.querySelectorAll('[data-openq]').forEach(b=>b.addEventListener('click',()=>openDetail(b.dataset.openq)));
  w.querySelector('#pDel').addEventListener('click',()=>openConfirm('이 환자를 삭제할까요?','환자만 삭제되고, 회고 기록은 "환자 미지정"으로 남습니다. 연결된 질문의 환자 연결도 해제됩니다.',()=>{
    db.entries.forEach(e=>{ if(e.patientId===p.id) e.patientId=null; });
    db.questions.forEach(q=>{ if(q.patientId===p.id) q.patientId=null; });
    db.patients=db.patients.filter(x=>x.id!==p.id); saveData(); state.view='patients'; render(); toast('환자 삭제됨');
  }));
}

// ══════════════════════ 자료 (공부 아카이브) ══════════════════════
function openMaterial(id){
  if(state.view!=='mdetail') state._matReturn={view:state.view,currentId:state.currentId,currentPatientId:state.currentPatientId,selectedDate:state.selectedDate};
  state.view='mdetail'; state.currentMaterialId=id; document.querySelector('.scroll').scrollTop=0; render();
}
function backFromMaterials(){
  const r=state._matReturn; state._matReturn=null; state.currentMaterialId=null;
  if(r && r.view && r.view!=='mdetail'){ state.view=r.view; state.currentId=r.currentId; state.currentPatientId=r.currentPatientId; if(r.selectedDate) state.selectedDate=r.selectedDate; }
  else state.view='materials';
  render();
}
function matchesM(m){ if(!state.search) return true; const s=state.search.toLowerCase(); return [m.title, htmlToText(m.body)].join(' ').toLowerCase().includes(s); }
function createMaterial(open){ const m={id:nextMaterialId(), title:'', body:'', links:[], created:today(), updated:today()}; db.materials.push(m); saveData(); if(open!==false) openMaterial(m.id); return m; }
function renderMaterials(){
  const all=db.materials.slice().sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
  if(all.length===0){
    wrapEl().innerHTML=`<div class="empty-wrap">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--violet-d)" stroke-width="1.4"><path d="M4 19.5V6a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v13"/><path d="M6 17h12v3H6a2 2 0 0 1 0-4h12"/></svg>
      <div><h2>아직 저장한 자료가 없습니다</h2><p>새로 찾은 자료나 공부한 내용을 제목과 함께 정리해 두면 여기 쌓입니다.</p></div>
      <button class="btn-primary" id="newMat"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg><span>새 자료</span></button></div>`;
    document.getElementById('newMat').onclick=createMaterial;
    return;
  }
  const list=all.filter(matchesM);
  let h=`<div class="mat-head"><h1>자료</h1><button class="btn-soft" id="newMat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg><span>새 자료</span></button></div>`;
  if(!list.length) h+=`<div class="emptyline" style="text-align:center;padding:30px;">조건에 맞는 자료가 없습니다.</div>`;
  else h+=list.map(m=>{
    const prev=htmlToText(m.body).replace(/\s+/g,' ').trim().slice(0,140);
    return `<div class="qcard" data-mid="${m.id}">
      <div class="mat-title">${esc(m.title)||'<span style="color:var(--text-4)">(제목 없음)</span>'}</div>
      ${prev?`<div class="mat-prev">${esc(prev)}</div>`:''}
      <div class="qcard-foot"><span class="cf-date">${esc(m.updated)} 갱신</span></div>
    </div>`;
  }).join('');
  wrapEl().innerHTML=h;

// 연결 칩 렌더 (withUnlink: ✕ 표시). links=[{type,id}] 또는 자료배열용은 별도.
