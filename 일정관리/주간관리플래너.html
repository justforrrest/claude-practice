<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간관리 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/tabler-icons.min.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="주간관리플래너">
<meta name="theme-color" content="#7C3AED">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#F4F2FF;
  --surface:#FFFFFF;
  --surface-2:#F0EEFF;
  --border:#E2DCFA;
  --border-2:#CCC4EC;
  --text-1:#1A1535;
  --text-2:#5A527E;
  --text-3:#A094C0;
  --violet:#7C3AED;
  --violet-2:#9B67FF;
  --violet-light:#EDE9FE;
  --pink:#EC4899;
  --emerald:#10B981;
  --sky:#0EA5E9;
  --amber:#F59E0B;
  --coral:#F97316;

  /* compat aliases used by inline styles */
  --color-background-primary:var(--surface);
  --color-background-secondary:var(--surface-2);
  --color-text-primary:var(--text-1);
  --color-text-secondary:var(--text-2);
  --color-text-tertiary:var(--text-3);
  --color-border-tertiary:var(--border);
  --color-border-secondary:var(--border-2);
  --border-radius-lg:12px;
  --border-radius-md:8px;
  --font-sans:'Inter',-apple-system,sans-serif;
}

body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text-1);
  min-height:100vh;
  padding:28px 16px 60px;
}

/* ── Page shell ── */
.page-wrap{max-width:800px;margin:0 auto;}

.app-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
}
.app-header h1{
  font-size:21px;font-weight:700;letter-spacing:-.5px;
  background:linear-gradient(135deg,var(--violet) 0%,var(--pink) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.app-header-date{font-size:12px;color:var(--text-3);text-align:right;line-height:1.6;}

.app-card{
  background:var(--surface);
  border-radius:20px;
  padding:22px 22px 16px;
  box-shadow:0 4px 28px rgba(100,60,220,.11),0 1px 4px rgba(100,60,220,.07);
  border:1px solid var(--border);
}

/* ── Tabs ── */
#app{font-family:var(--font-sans);position:relative;}
.tabs{
  display:flex;gap:2px;
  border-bottom:2px solid var(--border);
  margin-bottom:1.25rem;
}
.tab{
  background:none;border:none;
  padding:8px 13px;font-size:13px;font-family:var(--font-sans);
  color:var(--text-3);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-2px;
  white-space:nowrap;border-radius:6px 6px 0 0;
  transition:color .15s,background .15s;
}
.tab.active{color:var(--violet);border-bottom-color:var(--violet);font-weight:600;}
.tab:not(.active):hover{color:var(--text-1);background:var(--violet-light);}
.tab[draggable]{cursor:grab;-webkit-user-drag:element;user-select:none;}
.tab.drag-over{background:var(--violet-light);color:var(--text-1);}

.view{display:none;}.view.active{display:block;}

.section-title{
  font-size:14px;font-weight:600;color:var(--text-1);margin-bottom:.75rem;
}

/* ── Inner cards ── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--border-radius-lg);
  padding:1rem 1.25rem;
  margin-bottom:.75rem;
  box-shadow:0 1px 4px rgba(100,60,220,.05);
}

label.field-label{
  font-size:10px;color:var(--text-3);display:block;
  margin-bottom:3px;margin-top:10px;
  text-transform:uppercase;letter-spacing:.5px;font-weight:600;
}

input[type=text],input[type=date],textarea,select{
  width:100%;font-size:13px;font-family:var(--font-sans);
  color:var(--text-1);background:transparent;border:none;outline:none;
}
input[type=text]::placeholder,textarea::placeholder{color:var(--text-3);}
textarea{resize:vertical;min-height:60px;line-height:1.5;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── Buttons ── */
.btn-primary{
  background:linear-gradient(135deg,var(--violet),var(--violet-2));
  color:#fff;border:none;border-radius:var(--border-radius-md);
  padding:7px 16px;font-size:13px;font-family:var(--font-sans);
  cursor:pointer;font-weight:500;transition:all .15s;
}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 14px rgba(124,58,237,.3);}

.btn-ghost{
  background:none;border:1px solid var(--border-2);
  border-radius:var(--border-radius-md);padding:7px 14px;
  font-size:13px;font-family:var(--font-sans);cursor:pointer;
  color:var(--text-2);transition:all .15s;
}
.btn-ghost:hover{background:var(--surface-2);color:var(--text-1);}

.btn-sm{
  padding:4px 10px;font-size:12px;border-radius:var(--border-radius-md);
  cursor:pointer;border:1px solid var(--border-2);
  background:none;color:var(--text-2);font-family:var(--font-sans);transition:all .15s;
}
.btn-sm:hover{background:var(--violet-light);color:var(--violet);border-color:#DDD6FE;}

.status{font-size:11px;color:var(--text-3);text-align:right;margin-top:.5rem;}

.nav-btn{
  background:none;border:1px solid var(--border-2);
  border-radius:var(--border-radius-md);padding:4px 9px;
  cursor:pointer;font-size:12px;font-family:var(--font-sans);
  color:var(--text-2);transition:all .15s;
}
.nav-btn:hover{background:var(--violet-light);color:var(--violet);border-color:#DDD6FE;}

/* ── Daily Dot ── */
.dot-tabs{display:flex;gap:2px;align-items:center;border-bottom:2px solid var(--border);margin-bottom:1rem;}
.dot-tab{display:flex;align-items:center;gap:5px;background:none;border:none;padding:6px 10px;font-size:12px;font-family:var(--font-sans);color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;border-radius:6px 6px 0 0;transition:color .15s,background .15s;}
.dot-tab:not(.active):hover{color:var(--text-1);background:var(--violet-light);}
.dot-tab.active{font-weight:600;}
.dot-tab-del{font-size:11px;line-height:1;opacity:0;transition:opacity .15s,color .15s;background:none;border:none;cursor:pointer;padding:0;color:inherit;}
.dot-tab:hover .dot-tab-del,.dot-tab.active .dot-tab-del{opacity:.7;}
.dot-tab-del:hover{opacity:1 !important;color:#EF4444;}
.dot-tab-add{background:none;border:none;cursor:pointer;padding:4px 8px;font-size:16px;color:var(--text-3);border-radius:6px;transition:color .15s,background .15s;line-height:1;}
.dot-tab-add:hover{color:var(--violet);background:var(--violet-light);}
.dot-tab[draggable]{cursor:grab;}
.dot-month-nav{display:flex;flex-direction:column;gap:6px;margin-bottom:.75rem;}
.dot-year-row{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-1);}
.dot-month-row{display:flex;gap:3px;flex-wrap:wrap;}
.dot-month-btn{flex:1;min-width:28px;padding:4px 2px;border:1px solid var(--border-2);border-radius:4px;font-size:11px;font-weight:500;cursor:pointer;background:none;color:var(--text-2);font-family:var(--font-sans);transition:all .15s;text-align:center;}
.dot-month-btn:hover{background:var(--violet-light);color:var(--violet);border-color:#DDD6FE;}
.dot-month-btn.dm-selected{background:var(--violet);color:#fff;border-color:var(--violet);}
.dot-month-btn.dm-today{border-color:var(--violet);color:var(--violet);font-weight:700;}
.dot-tab.drag-over{background:var(--violet-light);border-bottom-color:var(--violet);}
.dot-goal-name{width:100%;font-size:13px;font-weight:600;border:none;background:transparent;outline:none;color:var(--text-1);font-family:var(--font-sans);margin-bottom:.5rem;}
.dot-goal-name::placeholder{color:var(--text-3);}
.dot-color-picker{display:flex;gap:4px;align-items:center;margin-bottom:.75rem;}
.dot-color-swatch{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0;}
.dot-color-swatch.active{border-color:var(--text-1);transform:scale(1.15);}
.dot-list{display:flex;flex-direction:column;gap:4px;}
.dot-row{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;border:1px solid var(--border);
  border-radius:var(--border-radius-md);background:var(--surface);
  transition:border-color .15s;
}
.dot-row:hover{border-color:#DDD6FE;}
.dot-row.drag-over{border-color:var(--violet);background:var(--violet-light);}
.dot-day{font-size:12px;color:var(--text-3);min-width:36px;text-align:center;font-weight:600;cursor:pointer;transition:color .15s;}
.dot-day:hover{color:var(--violet);}
.dot-day-edit{font-size:12px;font-weight:600;color:var(--text-3);border:none;outline:1px solid var(--border-2);border-radius:4px;background:transparent;padding:0 2px;width:90px;font-family:var(--font-sans);cursor:pointer;}
.dot-del-btn,.check-del-btn,.checkout-del-btn{background:none;border:none;cursor:pointer;font-size:14px;color:var(--text-3);padding:0 2px;line-height:1;transition:color .15s;}
.dot-del-btn:hover,.check-del-btn:hover,.checkout-del-btn:hover{color:#EF4444;}
.dot-line{width:9px;height:9px;border-radius:50%;background:var(--violet);flex-shrink:0;}
.dot-line.empty{background:var(--border-2);}
.dot-input{
  flex:1;border:none;background:transparent;
  font-size:13px;color:var(--text-1);outline:none;padding:0;
  font-family:var(--font-sans);
}
.dot-trail{display:flex;gap:4px;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;padding:6px 0;}
.dot-trail-dot{width:11px;height:11px;border-radius:50%;}
.dot-trail-dot.filled{background:var(--violet);}
.dot-trail-dot.empty{background:var(--border);}
.dot-trail-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--border-radius-md);background:var(--surface-2);border-left:3px solid transparent;}
.dot-trail-lbl{font-size:12px;font-weight:700;min-width:72px;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.dot-trail-count{margin-left:auto;font-size:10px;font-weight:600;color:var(--text-3);flex-shrink:0;}

/* ── Daily ── */
.daily-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.daily-nav{display:flex;align-items:center;gap:3px;}

.block-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
.block-table th{
  font-size:12px;color:var(--text-1);font-weight:700;
  padding:8px 10px;border-bottom:2px solid var(--border-2);
  text-align:left;background:var(--surface-2);letter-spacing:.2px;
  position:relative;
}
.col-resizer{position:absolute;right:-3px;top:0;height:100%;width:6px;cursor:col-resize;z-index:2;background:transparent;}
.col-resizer:hover,.col-resizer.active{background:var(--violet);opacity:.5;}
.block-table td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.block-table tr:last-child td{border-bottom:none;}
.block-table th:first-child{border-right:2px solid var(--border-2);}
.block-table th:nth-child(2),.block-table td:nth-child(2){border-right:1px solid var(--border);}
.kw-cell{font-size:13px;font-weight:700;color:var(--violet);min-width:90px;padding:8px !important;background:var(--violet-light);border-right:2px solid var(--border);vertical-align:middle;text-align:center;}
.kw-input{
  font-size:13px;font-weight:700;color:var(--violet);
  border:none;background:transparent;outline:none;width:100%;padding:0;
  font-family:var(--font-sans);text-align:center;
}
.check-cell{display:flex;flex-direction:column;gap:4px;padding:2px 0;}
.check-row{display:flex;align-items:center;gap:5px;}
.check-row input[type=checkbox]{width:14px;height:14px;accent-color:var(--violet);flex-shrink:0;}
.check-row input[type=text]{
  border:none;background:transparent;font-size:13px;
  outline:none;padding:0;width:100%;font-family:var(--font-sans);
}
.check-row-dot{color:var(--border-2);font-size:8px;flex-shrink:0;line-height:1;}
.checkout-cell{vertical-align:top;}
.add-item-btn,.add-checkout-btn{display:none;}
.kw-input.from-weekly{color:#7C3AED;}
.add-item-btn:hover,.add-checkout-btn:hover{color:var(--violet);}

.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.3px;}
.badge-bad{background:#FAECE7;color:#993C1D;}
.badge-good{background:#EAF3DE;color:#3B6D11;}
.badge-next{background:#E6F1FB;color:#185FA5;}

.emotion-section{margin-top:.75rem;display:grid;grid-template-columns:1fr;gap:4px;}
.emotion-card{
  padding:6px 10px;border-radius:var(--border-radius-md);
  border:1px solid var(--border);
}
.emotion-card-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.emotion-card-header .field-label{margin:0;font-size:11px;}
.emotion-card textarea{
  font-size:13px;border:none;background:transparent;
  outline:none;width:100%;resize:none;min-height:26px;
  color:var(--text-1);font-family:var(--font-sans);
  overflow:hidden;
}

/* ── Weekly Plan Table ── */
#week-grid{overflow-x:auto;}
.wk-table{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:1rem;}
.wk-corner{border:1px solid var(--border);background:var(--surface-2);width:32px;}
.wk-th{text-align:center;padding:5px 2px;border:1px solid var(--border);background:var(--surface-2);vertical-align:middle;}
.wk-th-date{font-size:13px;font-weight:700;color:var(--text-1);display:block;}
.wk-th-day{font-size:9px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.3px;display:block;}
.wk-th.sat .wk-th-date,.wk-th.sat .wk-th-day{color:var(--sky);}
.wk-th.sun .wk-th-date,.wk-th.sun .wk-th-day{color:var(--coral);}
.wk-row-lbl{font-size:10px;font-weight:700;color:var(--text-3);text-align:center;border:1px solid var(--border);background:var(--surface-2);width:32px;vertical-align:middle;padding:2px;}
.wk-cell-td{border:1px solid var(--border);padding:0;vertical-align:top;position:relative;}
.wk-cell-td textarea{width:100%;min-height:56px;border:none;background:transparent;outline:none;resize:none;font-size:12px;font-weight:500;color:var(--text-1);line-height:1.5;font-family:var(--font-sans);text-align:center;padding:4px 2px;box-sizing:border-box;}
.wk-issue-row .wk-cell-td textarea{min-height:28px;font-size:11px;}
.wk-cell-color-btn{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;border:1px solid var(--border-2);cursor:pointer;background:transparent;padding:0;line-height:1;}
/* ── CORE BLOCK + 가용블럭 ── */
.core-row{display:flex;gap:20px;margin-top:.75rem;align-items:flex-start;}
.core-block-wrap{flex:1;min-width:0;}
.core-block-title{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--text-2);text-transform:uppercase;line-height:1;padding-bottom:4px;margin-bottom:8px;border-bottom:1.5px solid var(--border-2);}
.core-block-item{display:flex;flex-direction:column;margin-bottom:2px;border-bottom:1px dashed var(--border);}
.core-block-name-row{display:flex;align-items:flex-start;gap:4px;}
.core-block-num{font-size:12px;font-weight:700;color:var(--text-3);min-width:14px;flex-shrink:0;line-height:1.4;}
.core-block-name{font-size:13px;font-weight:400;color:var(--text-2);flex:1;min-width:0;border:none;background:transparent;outline:none;font-family:var(--font-sans);line-height:1.4;padding:0;resize:none;overflow:hidden;min-height:unset;}
.avail-wrap{flex:1;min-width:0;}
.avail-title-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:4px;margin-bottom:8px;border-bottom:1.5px solid var(--border-2);}
.avail-title{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--text-2);text-transform:uppercase;line-height:1;}
.avail-total{font-size:9px;color:var(--text-3);line-height:1;}
.avail-table{width:100%;border-collapse:collapse;font-size:11px;}
.avail-table th{font-size:9px;font-weight:700;color:var(--text-3);padding:1px 4px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle;line-height:1;}
.avail-table td{padding:3px 4px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle;}
.avail-name{font-weight:600;color:var(--text-1);text-align:center !important;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.avail-count{font-weight:700;color:var(--violet);}
.avail-practice input{width:32px;border:none;background:transparent;outline:none;font-size:11px;text-align:center;font-family:var(--font-sans);color:var(--text-2);}


/* ── Weekly Review ── */
#wr-week-grid{display:grid;grid-template-columns:32px repeat(7,1fr);gap:4px;margin-bottom:.75rem;}
.wr-corner,.wr-row-lbl{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;}
.wr-corner{min-height:44px;}
.wr-row-lbl{font-size:10px;font-weight:700;color:var(--text-3);min-height:72px;}
.wr-th{text-align:center;padding:5px 2px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;}
.wr-th.sat .wk-th-date,.wr-th.sat .wk-th-day{color:var(--sky);}
.wr-th.sun .wk-th-date,.wr-th.sun .wk-th-day{color:var(--coral);}
.routine-grid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:3px;align-items:center;margin-bottom:.5rem;}
.routine-label{font-size:12px;color:var(--text-2);padding-right:6px;}
.routine-dot{
  width:24px;height:24px;border-radius:50%;
  border:1.5px solid var(--border-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  margin:auto;font-size:10px;font-weight:600;color:var(--text-3);
  transition:all .15s;
}
.routine-dot.done{background:var(--violet);border-color:var(--violet);color:#fff;}
.routine-dot:not(.done):hover{background:var(--violet-light);border-color:#DDD6FE;color:var(--violet);}

.routine-add{display:flex;gap:6px;margin-bottom:.75rem;}
.routine-add input{flex:1;font-size:13px;border-bottom:1px solid var(--border);}



/* ── Weekly Review Block Grid ── */
.wr-block-cell{
  min-height:72px;border:1px solid var(--border);border-radius:6px;
  padding:5px 4px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:border-color .15s,background .15s;
}
.wr-block-cell.s-done{border-color:var(--emerald);background:#ECFDF5;}
.wr-block-cell.s-partial{border-color:var(--amber);background:#FFFBEB;}
.wr-block-cell.s-memo{border-color:var(--sky);background:#F0F9FF;}
.wr-block-cell.s-empty{background:var(--bg);opacity:.4;}
.wr-tag{
  display:inline-flex;align-items:center;gap:2px;
  padding:2px 5px;border-radius:4px;
  font-size:10px;font-weight:600;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.4;
}
.wr-tag-label{font-size:9px;font-weight:700;opacity:.75;}
.wr-tag-plan{background:var(--violet-light);color:var(--violet);}
.wr-tag-match{background:#F0F0F0;color:#888;}
.wr-tag-diff{background:#FFF7ED;color:var(--coral);}
.wr-tag-daily{background:#ECFDF5;color:var(--emerald);}
.wr-stat{font-size:10px;font-weight:600;text-align:center;color:var(--text-3);}
.s-done .wr-stat{color:var(--emerald);}
.s-partial .wr-stat{color:var(--amber);}
.s-memo .wr-stat{color:var(--sky);}

/* ── Monthly Review ── */
.quadrant-labels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem;}
.q-label-input{display:flex;align-items:center;gap:8px;}
.q-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.radar-container{position:relative;width:100%;max-width:320px;margin:0 auto 1rem;}
.score-sliders{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.slider-row{display:flex;flex-direction:column;gap:4px;}
.slider-row label{font-size:12px;color:var(--text-2);font-weight:500;}
.slider-row input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;outline:none;cursor:pointer;background:var(--track-bg,var(--border-2));}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--track-col,var(--violet));cursor:pointer;margin-top:-4.5px;box-shadow:0 1px 4px rgba(0,0,0,.15);}
.slider-row input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:transparent;}
.slider-val{font-size:12px;font-weight:700;color:var(--violet);text-align:right;}

/* ── Calendar ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.cal-title{font-size:11px;font-weight:600;color:var(--text-1);}
.cal-nav-btn{background:none;border:none;cursor:pointer;color:var(--text-2);padding:1px 5px;border-radius:6px;font-size:12px;line-height:1;}
.cal-nav-btn:hover{background:var(--violet-light);color:var(--violet);}
.cal-week-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:1px;}
.cal-weekday{text-align:center;font-size:8px;font-weight:600;color:var(--text-3);padding:1px 0;}
.cal-weekday:nth-child(6){color:#3B82F6;}
.cal-weekday:last-child{color:#EF4444;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.cal-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:26px;border-radius:4px;cursor:pointer;font-size:9px;color:var(--text-2);transition:background .12s;}
.cal-day:hover{background:var(--violet-light);}
.cal-day-filler{pointer-events:none;opacity:0;}
.cal-day-sun{color:#EF4444;}
.cal-day-sat{color:#3B82F6;}
.cal-day-today{font-weight:700;color:var(--violet);}
.cal-day-selected{background:var(--violet-light);color:var(--violet) !important;font-weight:700;}
.cal-day-selected:hover{background:#DDD6FE;}
.cal-dot{width:3px;height:3px;border-radius:50%;background:var(--violet);margin-top:1px;}
.cal-day-selected .cal-dot{background:var(--violet);}
.mplan-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;}
.mplan-header-cell{text-align:center;font-size:12px;font-weight:700;color:var(--text-3);padding:5px 2px;background:var(--surface-2);border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
.mplan-header-cell.sun{color:var(--coral);}
.mplan-header-cell.sat{color:var(--sky);}
.mplan-day{min-height:72px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 6px;background:var(--surface);display:flex;flex-direction:column;gap:2px;cursor:pointer;}
.mplan-day.today{background:var(--violet-light);box-shadow:inset 0 0 0 1px var(--violet);position:relative;z-index:1;}
.mplan-day.other-month{opacity:0.3;pointer-events:none;}
.mplan-date-num{font-size:10px;font-weight:600;color:var(--text-3);text-align:right;line-height:1.4;}
.mplan-date-num.sun{color:var(--coral);}
.mplan-date-num.sat{color:var(--sky);}
.mplan-event-row{display:flex;align-items:center;gap:2px;}
.mplan-event-inp{flex:1;border:none;background:transparent;font-size:7px;color:var(--text-1);font-family:var(--font-sans);outline:none;min-width:0;padding:0;}
.mplan-event-del{background:none;border:none;cursor:pointer;font-size:11px;color:var(--text-3);padding:0 1px;line-height:1;flex-shrink:0;}

<script>
/* ── Header date ── */
(function(){
  const d=new Date();
  const days=['일','월','화','수','목','금','토'];
  const el=document.getElementById('hdr-date');
  if(el) el.textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
})();

/* ── Core utils ── */
const KEYS={dot:'b6ix_dot_v1',daily:'b6ix_daily_v1',weekly:'b6ix_weekly_v1',wreview:'b6ix_wreview_v1',monthly:'b6ix_monthly_v1',mplan:'b6ix_mplan_v1',template:'b6ix_template_v1',tabOrder:'b6ix_tab_order_v1',colWidths:'b6ix_col_widths_v1'};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function todayStr(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function fmtDate(ds){const[y,m,d]=ds.split('-');return y+'년 '+Number(m)+'월 '+Number(d)+'일';}
function getWeekStart(date){const d=new Date(date);const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);d.setDate(diff);return d;}
function weekKey(date){const ws=getWeekStart(date);return ws.getFullYear()+'-'+String(ws.getMonth()+1).padStart(2,'0')+'-'+String(ws.getDate()).padStart(2,'0');}
function monthKey(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0');}
function getDayIndex(dateStr){const d=new Date(dateStr);const day=d.getDay();return day===0?6:day-1;} // MON=0...SUN=6
function setStatus(t){document.getElementById('status-bar').textContent=t;}

/* Firebase 초기화 */
let db;
try{firebase.initializeApp({apiKey:"AIzaSyBlmjCfXn80Ybew7xkIPkrqyOBxulWL_aM",authDomain:"weekly-planner-a2f78.firebaseapp.com",projectId:"weekly-planner-a2f78",storageBucket:"weekly-planner-a2f78.firebasestorage.app",messagingSenderId:"497461587642",appId:"1:497461587642:web:9ddbdcf093497aa7495c83"});db=firebase.firestore();}catch(e){db={collection:()=>({doc:()=>({get:async()=>({exists:false}),set:async()=>{}})})};}

/* 동기화 코드 */
function getSyncCode(){let c=localStorage.getItem('b6ix_sync');if(!c){c=Math.random().toString(36).substr(2,3).toUpperCase()+Math.random().toString(36).substr(2,3).toUpperCase();localStorage.setItem('b6ix_sync',c);}return c;}
function setSyncStatus(t){const el=document.getElementById('sync-status');if(el)el.textContent=t;}

/* localStorage + Firestore */
function toFsVal(key,val){return key===KEYS.weekly?{__json:JSON.stringify(val)}:val;}
function fromFsVal(val){return(val&&val.__json)?JSON.parse(val.__json):val;}
async function load(key){
  try{const doc=await db.collection('users').doc(getSyncCode()).collection('data').doc(key).get();if(doc.exists){const val=fromFsVal(doc.data().value);localStorage.setItem(key,JSON.stringify(val));return val;}}catch(e){}
  try{
    const v=localStorage.getItem(key);const parsed=v?JSON.parse(v):null;
    if(parsed){try{await db.collection('users').doc(getSyncCode()).collection('data').doc(key).set({value:toFsVal(key,parsed),ts:Date.now()});}catch(e){}}
    return parsed;
  }catch(e){return null;}
}
async function save(key,val){
  try{localStorage.setItem(key,JSON.stringify(val));setStatus('저장됨 ✓');}catch(e){setStatus('저장 실패');return;}
  try{setSyncStatus('동기화 중...');await db.collection('users').doc(getSyncCode()).collection('data').doc(key).set({value:toFsVal(key,val),ts:Date.now()});setSyncStatus('☁ 동기화됨');}catch(e){setSyncStatus('오프라인');}
}

/* 내보내기 / 가져오기 */
async function exportData(){
  const all={};
  Object.values(KEYS).forEach(k=>{const v=localStorage.getItem(k);if(v)all[k]=JSON.parse(v);});
  const json=JSON.stringify(all,null,2);
  const d=new Date().toISOString().slice(0,10);
  if(window.showSaveFilePicker){
    try{
      const fh=await window.showSaveFilePicker({
        suggestedName:`플래너백업_${d}.json`,
        types:[{description:'JSON 백업 파일',accept:{'application/json':['.json']}}]
      });
      const w=await fh.createWritable();
      await w.write(json);
      await w.close();
      setStatus('내보내기 완료 ✓');
    }catch(e){if(e.name!=='AbortError')setStatus('저장 실패');}
  }else{
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`플래너백업_${d}.json`;a.click();
    URL.revokeObjectURL(url);
    setStatus('내보내기 완료 ✓');
  }
}
function importData(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));
      setStatus('가져오기 완료 — 새로고침합니다...');
      setTimeout(()=>location.reload(),800);
    }catch(err){setStatus('파일 오류: 올바른 백업 파일이 아닙니다');}
  };
  reader.readAsText(file);
}

/* ── Tabs ── */
function renderTab(tab){
  if(tab==='dot') renderDot();
  else if(tab==='daily') renderDaily();
  else if(tab==='weekly') renderWeekly();
  else if(tab==='wreview') renderWR();
  else if(tab==='mplan') renderMPlan();
  else if(tab==='monthly'){renderMonthly();setTimeout(()=>drawRadar(getMEntry(monthKey(currentMDate))),50);}
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));

let dailyData={};
let currentDailyDate=todayStr();
let calendarViewDate=new Date();
const FIXED_6_BLOCKS=[
  {kw:'',checks:[{text:'',done:false}],checkouts:[{text:'',done:false}]},
  {kw:'',checks:[{text:'',done:false}],checkouts:[{text:'',done:false}]},
  {kw:'',checks:[{text:'',done:false}],checkouts:[{text:'',done:false}]},
  {kw:'',checks:[{text:'',done:false}],checkouts:[{text:'',done:false}]},
  {kw:'',checks:[{text:'',done:false}],checkouts:[{text:'',done:false}]},
  {kw:'',checks:[{text:'',done:false}],checkouts:[{text:'',done:false}]},
];
function getDailyEntry(dateStr){
  if(!dailyData[dateStr]){
    dailyData[dateStr]={blocks:JSON.parse(JSON.stringify(FIXED_6_BLOCKS)),bad:'',good:'',next:''};
  } else {
    while(dailyData[dateStr].blocks.length<6){
      const idx=dailyData[dateStr].blocks.length;
      dailyData[dateStr].blocks.push(JSON.parse(JSON.stringify(FIXED_6_BLOCKS[idx]||{kw:'블록 '+(idx+1),checks:[{text:'',done:false}],checkouts:[{text:'',done:false}]})));
    }
    dailyData[dateStr].blocks=dailyData[dateStr].blocks.slice(0,6);
  }
  return dailyData[dateStr];
}
function hasDataForDate(ds){
  const e=dailyData[ds];
  if(!e) return false;
  if(e.bad||e.good||e.next) return true;
  if(e.blocks) return e.blocks.some(b=>(b.kw&&b.kw.trim())||b.checks.some(c=>c.text)||b.checkouts.some(c=>c.text));
  return false;
}
function renderCalendar(){

  const today=todayStr();
  let html=`<div class="cal-header">
    <button class="cal-nav-btn" id="cal-prev">&#8249;</button>

  <div class="cal-grid">`;
  for(let i=0;i<firstDow;i++) html+=`<div class="cal-day cal-day-filler"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

function focusLastInput(bi,cls){const tr=document.getElementById('block-tbody').querySelectorAll('tr')[Number(bi)];if(tr){const ins=tr.querySelectorAll(cls);if(ins.length)ins[ins.length-1].focus();}}
function syncWeeklyToDaily(dateStr,force=false){
  const wk=weekKey(new Date(dateStr));
  const wEntry=getWeeklyEntry(wk);
  const di=getDayIndex(dateStr);
  if(!wEntry.grid[di]) wEntry.grid[di]=Array(6).fill('');
  const entry=getDailyEntry(dateStr);
  for(let bi=0;bi<6;bi++){
    const wKw=(wEntry.grid[di][bi]||'').trim();
    const block=entry.blocks[bi];
    // 이전 구현의 fromWeekly checks 항목 정리
    block.checks=block.checks.filter(c=>!c.fromWeekly);
    if(block.checks.length===0) block.checks=[{text:'',done:false}];
    if(!wKw) continue;
    if(force||!block.kw.trim()||block.kwFromWeekly){
      block.kw=wKw;
      block.kwFromWeekly=true;
    }
  }
}
let colWidthData=null;
function applyColWidths(){
  const tbl=document.querySelector('.block-table');if(!tbl)return;
  const totalW=tbl.offsetWidth||600;
  const w0=colWidthData?.[0]??90;
  const w1=colWidthData?.[1]??Math.round((totalW-w0)/2);
  const cols=tbl.querySelectorAll('col');
  if(cols[0])cols[0].style.width=w0+'px';
  if(cols[1])cols[1].style.width=w1+'px';

function initColResize(){
  applyColWidths();
  document.querySelectorAll('.col-resizer').forEach(handle=>{
    handle.addEventListener('mousedown',e=>{
      e.preventDefault();
      const colIdx=Number(handle.dataset.col);
      const tbl=document.querySelector('.block-table');
      const col=tbl.querySelectorAll('col')[colIdx];
      const startX=e.clientX;
      const startW=tbl.querySelectorAll('th')[colIdx].offsetWidth;
      handle.classList.add('active');
      const onMove=ev=>{
        const newW=Math.max(60,startW+(ev.clientX-startX));
        col.style.width=newW+'px';
        if(!colWidthData)colWidthData=[90,null];
        colWidthData[colIdx]=newW;
      };
      const onUp=()=>{

        save(KEYS.colWidths,colWidthData);
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
      };
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
  });
}

const DAY_LABELS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
function deepCopy(o){return JSON.parse(JSON.stringify(o));}
const DEFAULT_GRID=[
  ['해피모닝','업무','업무','업무','업무',''],
  ['해피모닝','업무','업무','업무','운동',''],
  ['해피모닝','업무','업무','업무','업무',''],
  ['해피모닝','업무','업무','업무','',''],
  ['해피모닝','업무','업무','업무','업무','운동'],
  ['해피모닝','업무','','','',''],
  ['','','','','','주간 회고'],
];
function getWeeklyEntry(wk){
  if(!weeklyData[wk]){
    const tplGrid=weekTemplate?deepCopy(weekTemplate.grid):deepCopy(DEFAULT_GRID);
    const tplColor=weekTemplate?deepCopy(weekTemplate.gridColor):Array(7).fill(0).map(()=>Array(7).fill(''));
    weeklyData[wk]={goals:[''],whys:[''],grid:tplGrid,
    issue:['','','','','','',''],
    gridColor:tplColor,
    coreBlocks:[{name:'',memo:''},{name:'',memo:''},{name:'',memo:''}],
    blockNames:['','','','','','','']};
    applyKeywordColors(weeklyData[wk].grid,weeklyData[wk].gridColor);
  }
  const e=weeklyData[wk];
  if(!e.issue) e.issue=['','','','','','',''];
  if(!e.gridColor) e.gridColor=Array(7).fill(0).map(()=>Array(7).fill(''));
  if(!e.coreBlocks) e.coreBlocks=[{name:'',memo:''},{name:'',memo:''},{name:'',memo:''}];
  if(!e.blockNames) e.blockNames=['','','','','','',''];
  if(e.blockNames.length<7) e.blockNames.push('');
  return e;
}
const CELL_COLORS=['','#E5E7EB','#FEF9C3','#BFDBFE','#F9FAFB','#FECACA','#BBF7D0','#FED7AA'];
const KEYWORD_COLORS={'업무':'#E5E7EB','해피모닝':'#FEF9C3','운동':'#BFDBFE','휴식':'#F9FAFB','데이트':'#FECACA','공부':'#BBF7D0','계획':'#FED7AA'};
function matchKeywordColor(text){
  const t=text||'';
  const k=Object.keys(KEYWORD_COLORS).find(k=>t.includes(k));
  return k?KEYWORD_COLORS[k]:null;
}
function applyKeywordColors(grid,gridColor){
  for(let di=0;di<7;di++){
    for(let row=0;row<6;row++){
      const v=(grid[di]&&grid[di][row]||'');
      const c=matchKeywordColor(v);
      if(c&&!gridColor[di][row+1]) gridColor[di][row+1]=c;
    }
  }
}
function makeColorBtn(di,rowIdx,td,entry){
  const btn=document.createElement('button');btn.type='button';btn.className='wk-cell-color-btn';
  const cur=entry.gridColor[di][rowIdx]||'';
  btn.style.background=cur||'var(--border)';
  btn.title='배경색';
  btn.onclick=(e)=>{
    e.stopPropagation();
    const idx=CELL_COLORS.indexOf(entry.gridColor[di][rowIdx]||'');
    const next=CELL_COLORS[(idx+1)%CELL_COLORS.length];
    entry.gridColor[di][rowIdx]=next;
    td.style.background=next||'';
    btn.style.background=next||'var(--border)';
  };
  return btn;
}
function buildAvailTable(entry,onCounts){
  const stripParens=s=>s.replace(/\s*\(.*?\)\s*/g,'').trim();
  const counts={};let emptyCount=0;
  entry.grid.forEach(day=>day.forEach(v=>{
    if(v&&v.trim()){const k=stripParens(v.trim());if(k)counts[k]=(counts[k]||0)+1;else emptyCount++;}
    else emptyCount++;
  }));
  if(onCounts)onCounts(counts);
  const autoKeywords=Object.keys(counts);
  const queue=autoKeywords.filter(k=>!entry.blockNames.includes(k));
  entry.blockNames=entry.blockNames.map(name=>{
    if(!name.trim())return queue.shift()||'';
    if(counts[name.trim()]!==undefined)return name;
    return queue.shift()||'';
  });
  entry.blockNames.sort((a,b)=>{
    if(!a.trim()&&!b.trim())return 0;
    if(!a.trim())return 1;
    if(!b.trim())return -1;
    return (counts[b.trim()]||0)-(counts[a.trim()]||0);
  });
  const table=document.createElement('table');table.className='avail-table';
  const thead=table.createTHead();const hr=thead.insertRow();
  ['블럭명','계획','블럭명','계획'].forEach(t=>{const th=document.createElement('th');th.textContent=t;hr.appendChild(th);});
  const tbody=table.createTBody();
  const inpStyle='border:none;background:transparent;outline:none;font-size:11px;font-weight:600;color:var(--text-1);width:100%;font-family:var(--font-sans);text-align:center;';
  const makeCell=(row,idx)=>{
    const nameTd=row.insertCell();nameTd.className='avail-name';
    const inp=document.createElement('input');inp.type='text';inp.value=entry.blockNames[idx]||'';inp.placeholder='블럭명';inp.style.cssText=inpStyle;
    const applyBg=v=>{nameTd.style.background=matchKeywordColor(v)||'';};
    applyBg(inp.value);
    nameTd.appendChild(inp);
    const countTd=row.insertCell();countTd.className='avail-count';
    countTd.textContent=inp.value.trim()?(counts[inp.value.trim()]||0):'';
    inp.addEventListener('input',()=>{entry.blockNames[idx]=inp.value;countTd.textContent=inp.value.trim()?(counts[inp.value.trim()]||0):'';applyBg(inp.value);});
  };
  for(let i=0;i<3;i++){const row=tbody.insertRow();makeCell(row,i);makeCell(row,i+4);}
  const freeRow=tbody.insertRow();
  makeCell(freeRow,3);
  const freeLbl=freeRow.insertCell();freeLbl.className='avail-name';freeLbl.style.cssText='font-style:italic;color:var(--text-3);';freeLbl.textContent='free';
  const freeCnt=freeRow.insertCell();freeCnt.className='avail-count';freeCnt.textContent=emptyCount;
  return table;
}
function buildWRAvailTable(wEntry,wrEntry,onCounts){
  const stripParens=s=>s.replace(/\s*\(.*?\)\s*/g,'').trim();
  const counts={};let emptyCount=0;
  wEntry.grid.forEach(day=>day.forEach(v=>{
    if(v&&v.trim()){const k=stripParens(v.trim());if(k)counts[k]=(counts[k]||0)+1;else emptyCount++;}
    else emptyCount++;
  }));

  for(let i=0;i<7;i++){

    nameTd.textContent=name||'';

    const execTd=row.insertCell();execTd.className='avail-practice';

  const freeRow=tbody.insertRow();
  const freeLbl=freeRow.insertCell();freeLbl.className='avail-name';freeLbl.style.cssText='font-style:italic;color:var(--text-3);';freeLbl.textContent='free';
  const freeCnt=freeRow.insertCell();freeCnt.className='avail-count';freeCnt.textContent=emptyCount;
  const freeExecTd=freeRow.insertCell();freeExecTd.className='avail-practice';
  const freeInp=document.createElement('input');freeInp.type='text';freeInp.value=wrEntry.blockExec[7]||'';freeInp.placeholder='-';freeInp.style.cssText=execInpStyle;
  freeInp.addEventListener('input',()=>{wrEntry.blockExec[7]=freeInp.value;});

function renderLineList(container,arr,placeholder){

function renderWeekly(){
  const ws=getWeekStart(currentWeekDate);const we=new Date(ws);we.setDate(we.getDate()+6);

  availWrap.appendChild(availTitleRow);

  availWrap.appendChild(buildAvailTable(entry,updateTotal));

  renderWeekCal();

/* ══ WEEKLY REVIEW ══ */
let wrData={};let currentWRDate=new Date();
function getWREntry(wk){
  if(!wrData[wk]) wrData[wk]={goal:'',bad:'',good:'',how:'',routines:[]};
  if(!wrData[wk].blockExec) wrData[wk].blockExec=Array(8).fill('');
  return wrData[wk];
}
function renderWRGrid(){
  const wk=weekKey(currentWRDate);
  const wEntry=getWeeklyEntry(wk);
  const ws=getWeekStart(currentWRDate);
  const weekDays=Array.from({length:7},(_,i)=>{
    const d=new Date(ws);d.setDate(d.getDate()+i);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  });
  const grid=document.getElementById('wr-week-grid');
  grid.innerHTML='';
  // 코너
  const corner=document.createElement('div');corner.className='wr-corner';grid.appendChild(corner);
  // 헤더 (날짜+요일)
  weekDays.forEach((ds,i)=>{
    const d=new Date(ds+'T00:00:00');
    const th=document.createElement('div');th.className='wr-th'+(i===5?' sat':i===6?' sun':'');
    th.innerHTML=`<span class="wk-th-date">${d.getMonth()+1}/${d.getDate()}</span><span class="wk-th-day">${DAY_LABELS[i]}</span>`;
    grid.appendChild(th);
  });
  for(let row=0;row<6;row++){
    // 행 레이블
    const lbl=document.createElement('div');lbl.className='wr-row-lbl';lbl.textContent=row+1;grid.appendChild(lbl);
    weekDays.forEach((ds,di)=>{
      const block=dailyData[ds]&&dailyData[ds].blocks?dailyData[ds].blocks[row]:null;
      const dailyKw=(block&&block.kw)?block.kw:'';
      const weeklyKw=(wEntry.grid[di]&&wEntry.grid[di][row])||'';
      const hasAny=weeklyKw||dailyKw;

      // 완료 상태
      let sc='',st='';
      if(hasAny){
        if(block&&block.checks.length>0){
          const total=block.checks.length;
          const done=block.checks.filter(c=>c.done).length;
          if(done===total){sc='s-done';st='✓ '+done+'/'+total;}
          else if(done>0){sc='s-partial';st='△ '+done+'/'+total;}
          else if(block.checkout){sc='s-memo';st='메모';}
        } else if(block&&block.checkout){sc='s-memo';st='메모';}
      } else { sc='s-empty'; }

      // 태그 HTML 생성
      let tagsHtml='';
      if(weeklyKw){
        tagsHtml+=`<span class="wr-tag wr-tag-plan">${weeklyKw}</span>`;
      }
      if(dailyKw){
        const matchCls=!weeklyKw?'wr-tag-daily':dailyKw===weeklyKw?'wr-tag-match':'wr-tag-diff';
        tagsHtml+=`<span class="wr-tag ${matchCls}">${dailyKw}</span>`;
      }

      const cell=document.createElement('div');
      cell.className='wr-block-cell '+sc;
      cell.innerHTML=hasAny?tagsHtml+(st?`<div class="wr-stat">${st}</div>`:''):'';
      grid.appendChild(cell);
    });
  }
}

function renderWR(){
  const ws=getWeekStart(currentWRDate);const we=new Date(ws);we.setDate(we.getDate()+6);

  document.getElementById('wr-week-label').textContent=(ws.getMonth()+1)+'/'+ws.getDate()+'~'+(we.getMonth()+1)+'/'+we.getDate();

function getMPlanMemo(mk){const v=mPlanData['memo:'+mk];if(!v)return[''];if(typeof v==='string')return v?v.split('\n'):[''];return v;}

      });

function sliderGrad(c,val){const p=Number(val)*10;return `linear-gradient(to right,${c} 0%,${c} ${p}%,${c}28 ${p}%,${c}28 100%)`;}

let mData={};let currentMDate=new Date();
const Q_COLORS=['#818CF8','#34D399','#F472B6','#FB923C'];
const Q_DEFAULTS=['업무','사회','관계','나'];
function getMEntry(mk){
  if(!mData[mk]) mData[mk]={qnames:Q_DEFAULTS.slice(),scores:[5,5,5,5],memo:''};
  return mData[mk];
}
function renderMonthly(){
  const mk=monthKey(currentMDate);
  const navContainer=document.getElementById('m-nav-container');navContainer.innerHTML='';
  const mNav=document.createElement('div');mNav.className='dot-month-nav';
  const mYearRow=document.createElement('div');mYearRow.className='dot-year-row';

  const mNextY=document.createElement('button');mNextY.type='button';mNextY.className='nav-btn';mNextY.innerHTML='&#8250;';
  mNextY.onclick=()=>{currentMDate.setFullYear(currentMDate.getFullYear()+1);renderMonthly();setTimeout(()=>drawRadar(getMEntry(monthKey(currentMDate))),50);};
  const mYearLabel=document.createElement('span');mYearLabel.textContent=currentMDate.getFullYear()+'년';

    btn.textContent=m+'월';
    btn.onclick=(()=>{const mo=m;return()=>{currentMDate.setMonth(mo-1);renderMonthly();setTimeout(()=>drawRadar(getMEntry(monthKey(currentMDate))),50);};})();
    mMonthRow.appendChild(btn);
  }
  mNav.appendChild(mMonthRow);navContainer.appendChild(mNav);
  const entry=getMEntry(mk);
  const sliders=document.getElementById('score-sliders');sliders.innerHTML='';
  entry.qnames.forEach((name,i)=>{
    const c=Q_COLORS[i];
    const div=document.createElement('div');div.className='slider-row';
    div.style.cssText=`background:${c}0d;border:1.5px solid ${c}35;border-radius:12px;padding:12px 14px;box-shadow:none;`;
    const nameInp=document.createElement('input');nameInp.type='text';nameInp.value=name;
    nameInp.style.cssText=`border:none;background:transparent;outline:none;font-size:12px;font-weight:600;color:${c};width:100%;padding:0;font-family:inherit;margin-bottom:2px;`;
    nameInp.addEventListener('input',()=>{entry.qnames[i]=nameInp.value;drawRadar(entry);});
    const inp=document.createElement('input');inp.type='range';inp.min=0;inp.max=10;inp.step=1;inp.value=entry.scores[i];
    inp.style.setProperty('--track-col',c);inp.style.background=sliderGrad(c,entry.scores[i]);
    const valEl=document.createElement('div');valEl.className='slider-val';valEl.id='sv-'+i;valEl.textContent=entry.scores[i];valEl.style.color=c;
    inp.addEventListener('input',()=>{entry.scores[i]=Number(inp.value);inp.style.background=sliderGrad(c,inp.value);document.getElementById('sv-'+i).textContent=inp.value;drawRadar(entry);});
    div.appendChild(nameInp);div.appendChild(inp);div.appendChild(valEl);sliders.appendChild(div);
  });
  document.getElementById('m-memo').value=entry.memo||'';
  document.getElementById('m-memo').oninput=()=>{entry.memo=document.getElementById('m-memo').value;};
  drawRadar(entry);
}
function drawRadar(entry){
  const canvas=document.getElementById('radar-canvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,r=Math.min(W,H)*0.38;
  ctx.clearRect(0,0,W,H);
  const n=4;const angles=Array.from({length:n},(_,i)=>i*(2*Math.PI/n)-Math.PI/2);
  const gridColor='rgba(124,58,237,0.1)';
  const textColor='#A094C0';
  for(let level=2;level<=10;level+=2){
    ctx.beginPath();
    angles.forEach((a,i)=>{const lr=r*(level/10);const x=cx+Math.cos(a)*lr,y=cy+Math.sin(a)*lr;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.closePath();ctx.strokeStyle=gridColor;ctx.lineWidth=0.75;ctx.stroke();
  }
  angles.forEach(a=>{ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.strokeStyle=gridColor;ctx.lineWidth=0.75;ctx.stroke();});
  ctx.beginPath();
  angles.forEach((a,i)=>{const sv=entry.scores[i]/10;const x=cx+Math.cos(a)*r*sv,y=cy+Math.sin(a)*r*sv;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.closePath();
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0,'rgba(124,58,237,0.18)');grad.addColorStop(1,'rgba(236,72,153,0.08)');
  ctx.fillStyle=grad;ctx.fill();ctx.strokeStyle='#7C3AED';ctx.lineWidth=2;ctx.stroke();
  angles.forEach((a,i)=>{
    const sv=entry.scores[i]/10;const x=cx+Math.cos(a)*r*sv,y=cy+Math.sin(a)*r*sv;
    ctx.beginPath();ctx.arc(x,y,5,0,2*Math.PI);
    ctx.fillStyle='#7C3AED';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  });
  ctx.font='600 12px Inter,sans-serif';ctx.fillStyle=textColor;ctx.textAlign='center';ctx.textBaseline='middle';
  angles.forEach((a,i)=>{const lx=cx+Math.cos(a)*(r+26),ly=cy+Math.sin(a)*(r+26);ctx.fillText(entry.qnames[i]||'',lx,ly);});
}
