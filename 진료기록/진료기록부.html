<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진료기록부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F4F2FF;--surface:#FFFFFF;--surface-2:#F0EEFF;
  --border:rgba(0,0,0,0.08);--border-2:rgba(0,0,0,0.12);
  --violet:#5b21b6;--violet-d:#7c3aed;--violet-light:#EDE9FE;--pink:#EC4899;
  --coral:#EF4444;--coral-light:#FEF2F2;
  --green:#10B981;--green-light:#D1FAE5;
  --amber:#F59E0B;--sky:#0EA5E9;
  --text-1:#0f0f10;--text-2:#374151;--text-3:#6b7280;
  --font-sans:'Inter',sans-serif;--radius:10px;
}
body{background:var(--bg);font-family:var(--font-sans);color:var(--text-1);min-height:100vh;padding:1.25rem 1rem 2rem;}
.container{max-width:1100px;margin:0 auto;}

/* Header */
.app-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:1.25rem;padding:.875rem 1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.04);}
.app-title{font-size:21px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,var(--violet-d) 0%,var(--pink) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.app-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3);}
.sync-code-box{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-weight:600;letter-spacing:1px;color:var(--violet-d);font-size:12px;}
.btn-sm{background:none;border:1px solid var(--border-2);border-radius:6px;padding:3px 10px;font-size:12px;font-family:var(--font-sans);color:var(--text-2);cursor:pointer;transition:all .15s;}
.btn-sm:hover{background:var(--violet-light);color:var(--violet-d);}

/* Layout */
.main-layout{display:flex;gap:1rem;align-items:flex-start;}

/* Left: side panel (tabbed) */
.side-panel{width:250px;flex-shrink:0;position:sticky;top:1rem;}
.tab-bar{display:flex;gap:2px;margin-bottom:.75rem;background:var(--surface-2);border-radius:8px;padding:3px;}
.tab-btn{flex:1;padding:5px 8px;border:none;border-radius:6px;font-size:12px;font-weight:600;font-family:var(--font-sans);cursor:pointer;background:none;color:var(--text-3);transition:all .15s;}
.tab-btn.active{background:var(--surface);color:var(--violet-d);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.tab-pane{display:none;flex-direction:column;gap:8px;}
.tab-pane.active{display:flex;}
.search-box{width:100%;padding:8px 12px;border:1px solid var(--border-2);border-radius:8px;font-size:13px;font-family:var(--font-sans);background:var(--surface);color:var(--text-1);outline:none;transition:border-color .15s;}
.search-box:focus{border-color:var(--violet-d);box-shadow:0 0 0 2px var(--violet-light);}
.search-box::placeholder{color:var(--text-3);}
.patient-list{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 230px);overflow-y:auto;}
.patient-item{padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;}
.patient-item:hover{border-color:var(--violet-d);background:var(--violet-light);}
.patient-item.active{border-color:var(--violet-d);background:var(--violet-light);box-shadow:inset 0 0 0 1px var(--violet-d);}
.pt-item-name{font-size:13px;font-weight:600;color:var(--text-1);}
.pt-item-sub{font-size:11px;color:var(--text-3);margin-top:2px;}
.list-empty{padding:1.25rem;text-align:center;font-size:12px;color:var(--text-3);background:var(--surface);border:1px solid var(--border);border-radius:8px;line-height:1.6;}

/* Right: detail */
.detail-panel{flex:1;min-width:0;}
.detail-empty{padding:4rem;text-align:center;font-size:14px;color:var(--text-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.03);}

/* Patient info */
.pt-info-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap;}
.pt-name{font-size:20px;font-weight:700;color:var(--text-1);}
.pt-chip{font-size:12px;color:var(--text-2);background:var(--surface-2);padding:2px 9px;border-radius:20px;border:1px solid var(--border);}
.pt-age{font-size:12px;color:var(--violet-d);background:var(--violet-light);padding:2px 9px;border-radius:20px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.875rem;}
.field-label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.field-ta{width:100%;border:1px solid var(--border-2);border-radius:7px;padding:8px 10px;font-size:13px;font-family:var(--font-sans);color:var(--text-1);resize:none;outline:none;min-height:40px;line-height:1.55;background:var(--surface);transition:border-color .15s;}
.field-ta:focus{border-color:var(--violet-d);box-shadow:0 0 0 2px var(--violet-light);}
.field-inp{width:100%;border:1px solid var(--border-2);border-radius:7px;padding:7px 10px;font-size:13px;font-family:var(--font-sans);color:var(--text-1);outline:none;background:var(--surface);transition:border-color .15s;}
.field-inp:focus{border-color:var(--violet-d);box-shadow:0 0 0 2px var(--violet-light);}

/* Records section */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
.sec-title{font-size:14px;font-weight:700;color:var(--text-1);}
.btn-add{display:flex;align-items:center;gap:5px;padding:6px 14px;background:var(--violet-d);color:#fff;border:none;border-radius:7px;font-size:13px;font-family:var(--font-sans);cursor:pointer;font-weight:500;transition:opacity .15s;}
.btn-add:hover{opacity:.88;}

/* Record accordion */
.rec-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.03);}
.rec-card.open{border-color:var(--violet-d);box-shadow:0 0 0 1.5px var(--violet-d);}
.rec-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;transition:background .15s;}
.rec-hdr:hover{background:var(--surface-2);}
.rec-date-lbl{font-size:14px;font-weight:600;color:var(--text-1);flex:1;}
.rec-preview{font-size:11px;color:var(--text-3);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rec-chevron{font-size:13px;color:var(--text-3);transition:transform .2s;flex-shrink:0;}
.rec-card.open .rec-chevron{transform:rotate(180deg);}
.rec-del{background:none;border:none;cursor:pointer;font-size:17px;color:var(--text-3);padding:0 3px;line-height:1;flex-shrink:0;transition:color .15s;}
.rec-del:hover{color:var(--coral);}
.rec-body{padding:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px;}

/* SOAP fields */
.soap-grid{display:grid;grid-template-columns:1fr 1fr;gap:.875rem;}
.soap-field{display:flex;flex-direction:column;}
.soap-badge{display:inline-flex;align-items:center;gap:5px;margin-bottom:5px;}
.soap-letter{width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.soap-s .soap-letter{background:#DBEAFE;color:#1D4ED8;}
.soap-o .soap-letter{background:#D1FAE5;color:#065F46;}
.soap-a .soap-letter{background:#FEF3C7;color:#92400E;}
.soap-p .soap-letter{background:#EDE9FE;color:#5B21B6;}
.soap-name{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;}
.soap-ta{width:100%;border:1px solid var(--border-2);border-radius:7px;padding:8px 10px;font-size:13px;font-family:var(--font-sans);color:var(--text-1);resize:none;outline:none;min-height:60px;line-height:1.55;background:var(--surface);transition:border-color .15s;overflow:hidden;}
.soap-ta:focus{border-color:var(--violet-d);box-shadow:0 0 0 2px var(--violet-light);}
.soap-ta::placeholder{color:var(--text-3);font-size:12px;}

/* Memo area */
.memo-divider{border:none;border-top:1px solid var(--border);margin:0;}
.memo-label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.memo-ta{width:100%;border:1px solid var(--border-2);border-radius:7px;padding:8px 10px;font-size:13px;font-family:var(--font-sans);color:var(--text-1);resize:none;outline:none;min-height:60px;line-height:1.55;background:var(--surface);transition:border-color .15s;overflow:hidden;}
.memo-ta:focus{border-color:var(--violet-d);box-shadow:0 0 0 2px var(--violet-light);}
.memo-ta::placeholder{color:var(--text-3);font-size:12px;}
.btn-ai{width:100%;padding:9px;background:var(--violet-d);color:#fff;border:none;border-radius:7px;font-size:13px;font-family:var(--font-sans);font-weight:600;cursor:pointer;transition:opacity .15s;}
.btn-ai:hover{opacity:.88;}
.btn-ai:disabled{opacity:.5;cursor:not-allowed;}

/* Settings modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal-box{background:var(--surface);border-radius:var(--radius);padding:1.5rem;width:340px;box-shadow:0 8px 32px rgba(0,0,0,0.15);}
.modal-title{font-size:15px;font-weight:700;color:var(--text-1);margin-bottom:1rem;}
.modal-desc{font-size:12px;color:var(--text-3);margin-bottom:.875rem;line-height:1.6;}
.modal-label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
.modal-inp{width:100%;border:1px solid var(--border-2);border-radius:7px;padding:8px 10px;font-size:13px;font-family:var(--font-sans);color:var(--text-1);outline:none;background:var(--surface);transition:border-color .15s;margin-bottom:1rem;}
.modal-inp:focus{border-color:var(--violet-d);box-shadow:0 0 0 2px var(--violet-light);}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.btn-modal-cancel{background:none;border:1px solid var(--border-2);border-radius:7px;padding:7px 16px;font-size:13px;font-family:var(--font-sans);color:var(--text-2);cursor:pointer;}
.btn-modal-save{background:var(--violet-d);border:none;border-radius:7px;padding:7px 16px;font-size:13px;font-family:var(--font-sans);color:#fff;cursor:pointer;font-weight:600;}
.btn-add-pt{width:100%;padding:7px;background:var(--violet-d);color:#fff;border:none;border-radius:7px;font-size:13px;font-family:var(--font-sans);font-weight:500;cursor:pointer;margin-bottom:.5rem;transition:opacity .15s;}
.btn-add-pt:hover{opacity:.88;}
.gender-btns{display:flex;gap:6px;margin-bottom:1rem;}
.gender-btn{flex:1;padding:6px;border:1px solid var(--border-2);border-radius:7px;font-size:13px;font-family:var(--font-sans);cursor:pointer;background:var(--surface);color:var(--text-2);transition:all .15s;}
.gender-btn.active{background:var(--violet-light);border-color:var(--violet-d);color:var(--violet-d);font-weight:600;}

/* Date input row */
.date-row{display:flex;align-items:center;gap:8px;}
.date-inp{border:1px solid var(--border-2);border-radius:7px;padding:6px 10px;font-size:13px;font-family:var(--font-sans);color:var(--text-1);outline:none;background:var(--surface);transition:border-color .15s;}
.date-inp:focus{border-color:var(--violet-d);}

/* Abbr list (in tab) */
.abbr-hdr{display:flex;align-items:center;justify-content:space-between;}
.abbr-search{width:100%;padding:6px 10px;border:1px solid var(--border-2);border-radius:7px;font-size:12px;font-family:var(--font-sans);outline:none;background:var(--surface);color:var(--text-1);}
.abbr-search:focus{border-color:var(--violet-d);}
.abbr-list{overflow-y:auto;max-height:calc(100vh - 280px);display:flex;flex-direction:column;gap:1px;}
.abbr-item{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 8px;border-radius:6px;transition:background .15s;gap:4px;}
.abbr-item:hover{background:var(--surface-2);}
.abbr-item-info{flex:1;min-width:0;}
.abbr-term{font-size:12px;font-weight:700;color:var(--violet-d);}
.abbr-full{font-size:10px;color:var(--text-3);margin-top:1px;word-break:break-word;}
.abbr-ko{font-size:11px;color:var(--text-2);}
.abbr-del{background:none;border:none;cursor:pointer;font-size:14px;color:var(--text-3);padding:0 2px;line-height:1;flex-shrink:0;transition:color .15s;opacity:0;}
.abbr-item:hover .abbr-del{opacity:1;}
.abbr-del:hover{color:var(--coral);}
.abbr-empty{font-size:12px;color:var(--text-3);text-align:center;padding:1rem 0;}

/* Rx link */
.rx-link-wrap{padding-top:4px;}
.rx-link-title{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.rx-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface-2);border-radius:6px;font-size:12px;color:var(--text-2);margin-bottom:4px;}
.rx-item-name{font-weight:600;color:var(--violet-d);}
.rx-item-info{color:var(--text-3);}
.rx-none{font-size:12px;color:var(--text-3);}
</style>
</head>
<body>
<div class="container">
  <header class="app-header">
    <span class="app-title">진료기록부</span>
    <div class="app-meta">
      <span class="sync-code-box" id="sync-code-display">------</span>
      <button class="btn-sm" id="sync-change-btn">기기 연결</button>
      <button class="btn-sm" id="settings-btn" title="Claude API 설정">⚙️ AI 설정</button>
      <span id="sync-status" style="font-size:12px;color:var(--text-3);"></span>
      <span id="status-text" style="font-size:12px;color:var(--text-3);"></span>
    </div>
  </header>
  <div class="main-layout">
    <div class="side-panel">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="patients">환자 목록</button>
        <button class="tab-btn" data-tab="abbrs">약어 사전</button>
      </div>
      <div class="tab-pane active" id="tab-patients">
        <input class="search-box" type="text" id="search-inp" placeholder="환자 검색...">
        <button class="btn-add-pt" id="add-patient-btn">+ 환자 추가</button>
        <div class="patient-list" id="patient-list"></div>
      </div>
      <div class="tab-pane" id="tab-abbrs">
        <div class="abbr-hdr">
          <input class="abbr-search" id="abbr-search" placeholder="약어 검색..." style="flex:1;">
          <button class="btn-sm" id="abbr-add-btn" style="flex-shrink:0;">+ 추가</button>
        </div>
        <div class="abbr-list" id="abbr-list"><div class="abbr-empty">오늘 추가된 약어 없음</div></div>
      </div>
    </div>
    <div class="detail-panel" id="detail-panel">
      <div class="detail-empty">좌측에서 환자를 선택하세요</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="add-abbr-modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">약어 추가</div>
    <div class="modal-label">약어</div>
    <input class="modal-inp" type="text" id="new-abbr-abbr" placeholder="예) TTP" style="text-transform:uppercase;">
    <div class="modal-label">전체명 (영어)</div>
    <input class="modal-inp" type="text" id="new-abbr-full" placeholder="예) Tenderness To Palpation">
    <div class="modal-label">한국어 뜻</div>
    <input class="modal-inp" type="text" id="new-abbr-ko" placeholder="예) 압통">
    <div class="modal-btns">
      <button class="btn-modal-cancel" id="add-abbr-cancel-btn">취소</button>
      <button class="btn-modal-save" id="add-abbr-save-btn">저장</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="add-patient-modal" style="display:none;">
  <div class="modal-box" style="width:380px;">
    <div class="modal-title">신규 환자 추가</div>
    <div class="modal-label">이름 *</div>
    <input class="modal-inp" type="text" id="new-pt-name" placeholder="홍길동">
    <div class="modal-label">성별</div>
    <div class="gender-btns">
      <button type="button" class="gender-btn" data-gender="남">남</button>
      <button type="button" class="gender-btn" data-gender="여">여</button>
      <button type="button" class="gender-btn active" data-gender="">미입력</button>
    </div>
    <div class="modal-label">생년월일</div>
    <input class="modal-inp" type="text" id="new-pt-birth" placeholder="예) 19901231 또는 901231">
    <div class="modal-label">주요 증상·병력</div>
    <textarea class="modal-inp" id="new-pt-conditions" rows="2" style="resize:none;min-height:60px;line-height:1.55;" placeholder="만성 질환, 알레르기, 복용 약물 등..."></textarea>
    <div class="modal-label">메모</div>
    <input class="modal-inp" type="text" id="new-pt-memo" placeholder="기타 메모...">
    <div class="modal-btns">
      <button class="btn-modal-cancel" id="add-pt-cancel-btn">취소</button>
      <button class="btn-modal-save" id="add-pt-save-btn">추가</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settings-modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">Claude API 설정</div>
    <div class="modal-desc">console.anthropic.com에서 발급한 API 키를 입력하세요. 키는 이 기기의 브라우저에만 저장됩니다.</div>
    <div class="modal-label">API 키</div>
    <input class="modal-inp" type="password" id="api-key-input" placeholder="sk-ant-...">
    <div class="modal-btns">
      <button class="btn-modal-cancel" id="modal-cancel-btn">취소</button>
      <button class="btn-modal-save" id="modal-save-btn">저장</button>
    </div>
  </div>
</div>

function setStatus(t){const el=document.getElementById('status-text');if(el)el.textContent=t;}
function setSyncStatus(t){const el=document.getElementById('sync-status');if(el)el.textContent=t;}

const KEYS={patients:'rx_patients_v1',prescriptions:'rx_prescriptions_v1',records:'mr_records_v1',abbrs:'mr_abbrs_v1'};

async function load(key){
  try{const doc=await db.collection('users').doc(getSyncCode()).collection('data').doc(key).get();if(doc.exists){const v=doc.data().value;localStorage.setItem(key,JSON.stringify(v));return v;}}catch(e){}
  try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}
}
async function save(key,val){
  try{localStorage.setItem(key,JSON.stringify(val));setStatus('저장됨 ✓');}catch(e){setStatus('저장 실패');return;}
  try{setSyncStatus('동기화 중...');await db.collection('users').doc(getSyncCode()).collection('data').doc(key).set({value:val,ts:Date.now()});setSyncStatus('☁ 동기화됨');}catch(e){setSyncStatus('오프라인');}
}

let patientsData=[];
let prescriptionsData=[];
let recordsData=[];
let abbrsData=[];
let selectedPatientId=null;
let openRecordId=null;
let searchQ='';

function parseBirth(val){
  const s=val.replace(/\D/g,'');
  if(s.length===8) return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
  if(s.length===6){const yy=parseInt(s.slice(0,2));const prefix=yy>new Date().getFullYear()%100?'19':'20';return prefix+s.slice(0,2)+'-'+s.slice(2,4)+'-'+s.slice(4,6);}
  if(/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
  return val;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function todayStr(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function calcAge(birth){if(!birth)return '';const b=new Date(birth);const now=new Date();let age=now.getFullYear()-b.getFullYear();const m=now.getMonth()-b.getMonth();if(m<0||(m===0&&now.getDate()<b.getDate()))age--;return age+'세';}
function fmtBirth(birth){if(!birth)return '';const[y,m,d]=birth.split('-');return y+'.'+(+m)+'.'+( +d);}
function fmtDateLabel(ds){
  if(!ds)return ds||'';
  const[y,m,d]=ds.split('-');
  const dt=new Date(+y,+m-1,+d);
  return (+m)+'월 '+(+d)+'일 ('+'일월화수목금토'[dt.getDay()]+')';
}
function growTA(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}
function initTA(ta){ta.style.height='auto';ta.style.height=(ta.scrollHeight||60)+'px';}

/* ── Patient list ── */
function renderPatientList(){
  const list=document.getElementById('patient-list');
  const q=searchQ.trim();
  const todayPatientIds=new Set(recordsData.filter(r=>r.date===todayStr()).map(r=>r.patientId));
  const filtered=patientsData.filter(p=>q?p.name.includes(q):todayPatientIds.has(p.id));
  const sorted=[...filtered].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  list.innerHTML='';
  if(!sorted.length){
    const el=document.createElement('div');el.className='list-empty';
    el.textContent=q?'검색 결과가 없습니다':'오늘 진료한 환자가 없습니다';
    list.appendChild(el);return;
  }
  sorted.forEach(p=>{
    const item=document.createElement('div');item.className='patient-item'+(p.id===selectedPatientId?' active':'');
    const name=document.createElement('div');name.className='pt-item-name';name.textContent=p.name;
    const sub=document.createElement('div');sub.className='pt-item-sub';
    const parts=[];
    if(p.gender)parts.push(p.gender);
    if(p.birth)parts.push(calcAge(p.birth));
    sub.textContent=parts.join('  ');
    item.appendChild(name);item.appendChild(sub);
    item.addEventListener('click',()=>{selectedPatientId=p.id;openRecordId=null;renderPatientList();renderDetail();});
    list.appendChild(item);
  });
}

/* ── Detail panel ── */

  const pt=patientsData.find(p=>p.id===selectedPatientId);
  if(!pt){panel.innerHTML='<div class="detail-empty">환자 정보를 찾을 수 없습니다</div>';return;}
  panel.innerHTML='';

  /* 환자 기본정보 카드 */
  const infoCard=document.createElement('div');infoCard.className='card';

  const ptHdr=document.createElement('div');ptHdr.className='pt-info-header';
  const nameEl=document.createElement('span');nameEl.className='pt-name';nameEl.textContent=pt.name;
  ptHdr.appendChild(nameEl);
  if(pt.gender){const c=document.createElement('span');c.className='pt-chip';c.textContent=pt.gender;ptHdr.appendChild(c);}
  if(pt.birth){const c=document.createElement('span');c.className='pt-chip';c.textContent=fmtBirth(pt.birth);ptHdr.appendChild(c);}
  if(pt.birth){const c=document.createElement('span');c.className='pt-age';c.textContent=calcAge(pt.birth);ptHdr.appendChild(c);}

  const infoGrid=document.createElement('div');infoGrid.className='info-grid';

  /* 주요 증상·병력 */
  const condDiv=document.createElement('div');
  const condLbl=document.createElement('div');condLbl.className='field-label';condLbl.textContent='주요 증상·병력';
  const condTA=document.createElement('textarea');condTA.className='field-ta';

  initTA(condTA);
  condTA.addEventListener('input',()=>{pt.conditions=condTA.value;growTA(condTA);});
  condTA.addEventListener('blur',()=>save(KEYS.patients,patientsData));
  condDiv.appendChild(condLbl);condDiv.appendChild(condTA);infoGrid.appendChild(condDiv);

  /* 메모 */
  const memoDiv=document.createElement('div');

  memoInp.placeholder='기타 메모...';memoInp.value=pt.memo||'';
  memoInp.addEventListener('input',()=>pt.memo=memoInp.value);
  memoInp.addEventListener('blur',()=>save(KEYS.patients,patientsData));
  memoDiv.appendChild(memoLbl);memoDiv.appendChild(memoInp);infoGrid.appendChild(memoDiv);

  infoCard.appendChild(infoGrid);
  panel.appendChild(infoCard);

  /* 진료 기록 섹션 */
  const secHdr=document.createElement('div');secHdr.className='sec-header';
  const ptRecords=recordsData.filter(r=>r.patientId===selectedPatientId);
  const secTitle=document.createElement('span');secTitle.className='sec-title';
  secTitle.textContent='진료 기록 ('+ptRecords.length+'건)';
  const addBtn=document.createElement('button');addBtn.className='btn-add';
  addBtn.textContent='+ 진료 추가';
  addBtn.addEventListener('click',()=>{
    const rec={id:uid(),patientId:selectedPatientId,date:todayStr(),s:'',o:'',a:'',p:'',memo:''};
    recordsData.unshift(rec);
    openRecordId=rec.id;
    save(KEYS.records,recordsData);
    renderDetail();
    setTimeout(()=>{const el=panel.querySelector('.rec-card');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},60);
  });
  secHdr.appendChild(secTitle);secHdr.appendChild(addBtn);
  panel.appendChild(secHdr);

  const sorted=[...ptRecords].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!sorted.length){
    const empty=document.createElement('div');
    empty.style.cssText='padding:2rem;text-align:center;font-size:13px;color:var(--text-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);';
    empty.textContent='진료 기록이 없습니다. 위 버튼으로 추가하세요.';
    panel.appendChild(empty);return;

function buildRecordCard(rec){
  const isOpen=rec.id===openRecordId;
  const card=document.createElement('div');card.className='rec-card'+(isOpen?' open':'');

  /* 헤더 */
  const hdr=document.createElement('div');hdr.className='rec-hdr';
  const dateLbl=document.createElement('span');dateLbl.className='rec-date-lbl';dateLbl.textContent=fmtDateLabel(rec.date);
  const preview=document.createElement('span');preview.className='rec-preview';
  preview.textContent=[rec.s,rec.a].filter(Boolean).join(' / ');
  const chevron=document.createElement('span');chevron.className='rec-chevron';chevron.textContent='▾';
  const delBtn=document.createElement('button');delBtn.type='button';delBtn.className='rec-del';delBtn.title='삭제';delBtn.textContent='×';
  delBtn.addEventListener('click',e=>{
    e.stopPropagation();
    if(!confirm('이 진료 기록을 삭제하시겠습니까?'))return;
    const idx=recordsData.findIndex(r=>r.id===rec.id);
    if(idx>=0)recordsData.splice(idx,1);
    if(openRecordId===rec.id)openRecordId=null;
    save(KEYS.records,recordsData);renderDetail();
  });
  hdr.appendChild(dateLbl);hdr.appendChild(preview);hdr.appendChild(chevron);hdr.appendChild(delBtn);
  hdr.addEventListener('click',()=>{openRecordId=isOpen?null:rec.id;renderDetail();});
  card.appendChild(hdr);

  if(isOpen){
    const body=document.createElement('div');body.className='rec-body';

    /* 날짜 수정 */
    const dateRow=document.createElement('div');dateRow.className='date-row';
    const dateLblEl=document.createElement('span');dateLblEl.style.cssText='font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;';dateLblEl.textContent='진료일';
    const dateInp=document.createElement('input');dateInp.type='date';dateInp.className='date-inp';dateInp.value=rec.date||'';
    dateInp.addEventListener('change',()=>{
      rec.date=dateInp.value;
      save(KEYS.records,recordsData);
      renderDetail();
    });
    dateRow.appendChild(dateLblEl);dateRow.appendChild(dateInp);body.appendChild(dateRow);

    /* SOAP 필드 */
    const soapGrid=document.createElement('div');soapGrid.className='soap-grid';
    const soapDefs=[
      {key:'s',letter:'S',name:'Subjective',sub:'주소증',placeholder:'환자가 호소하는 주된 증상, 통증 부위, 기간, 양상...'},
      {key:'o',letter:'O',name:'Objective',sub:'객관적 소견',placeholder:'신체 검사 소견, 활력징후, 압통 부위, ROM...'},
      {key:'a',letter:'A',name:'Assessment',sub:'진단·평가',placeholder:'진단명, 감별진단, 상태 평가...'},
      {key:'p',letter:'P',name:'Plan',sub:'치료·계획',placeholder:'시행한 치료, 처방, 다음 재진 일정, 주의사항...'},
    ];
    soapDefs.forEach(({key,letter,name,sub,placeholder})=>{
      const field=document.createElement('div');field.className='soap-field soap-'+key.toLowerCase();
      const badge=document.createElement('div');badge.className='soap-badge';
      const ltr=document.createElement('span');ltr.className='soap-letter';ltr.textContent=letter;
      const nm=document.createElement('span');nm.className='soap-name';nm.textContent=sub;
      badge.appendChild(ltr);badge.appendChild(nm);
      const ta=document.createElement('textarea');ta.className='soap-ta';ta.placeholder=placeholder;ta.value=rec[key]||'';
      initTA(ta);
      ta.addEventListener('input',()=>{rec[key]=ta.value;growTA(ta);});
      ta.addEventListener('blur',()=>save(KEYS.records,recordsData));
      field.appendChild(badge);field.appendChild(ta);soapGrid.appendChild(field);
    });
    body.appendChild(soapGrid);

    /* 자유 메모 */
    const memoDivider=document.createElement('hr');memoDivider.className='memo-divider';body.appendChild(memoDivider);
    const memoLabel=document.createElement('div');memoLabel.className='memo-label';memoLabel.textContent='자유 메모 (AI SOAP 차팅용)';body.appendChild(memoLabel);
    const memoTa=document.createElement('textarea');memoTa.className='memo-ta';
    memoTa.placeholder='진료 내용을 자유롭게 적으세요. AI가 SOAP으로 변환합니다.';
    memoTa.value=rec.memo||'';
    initTA(memoTa);
    memoTa.addEventListener('input',()=>{rec.memo=memoTa.value;growTA(memoTa);});
    memoTa.addEventListener('blur',()=>save(KEYS.records,recordsData));
    body.appendChild(memoTa);
    const aiBtn=document.createElement('button');aiBtn.type='button';aiBtn.className='btn-ai';aiBtn.textContent='✨ AI SOAP 차팅';
    aiBtn.addEventListener('click',()=>callSoapAI(rec,card,aiBtn));
    body.appendChild(aiBtn);

    /* 처방 연동 */
    const rxWrap=document.createElement('div');rxWrap.className='rx-link-wrap';
    const rxTitle=document.createElement('div');rxTitle.className='rx-link-title';rxTitle.textContent='연결된 처방';
    rxWrap.appendChild(rxTitle);
    const rxLinked=prescriptionsData.filter(rx=>rx.patientId===rec.patientId&&rx.date===rec.date);
    if(rxLinked.length){
      rxLinked.forEach(rx=>{
        const item=document.createElement('div');item.className='rx-item';
        const rxName=document.createElement('span');rxName.className='rx-item-name';rxName.textContent=rx.diagnosis||'처방';
        const rxInfo=document.createElement('span');rxInfo.className='rx-item-info';
        const infoParts=[];
        if(rx.totalPacks)infoParts.push(rx.totalPacks+'팩');
        if(rx.days)infoParts.push(rx.days+'일');
        if(rx.category)infoParts.push(rx.category);
        rxInfo.textContent=infoParts.join(' · ');
        item.appendChild(rxName);item.appendChild(rxInfo);rxWrap.appendChild(item);
      });
    }else{
      const none=document.createElement('div');none.className='rx-none';none.textContent='이 날짜에 연결된 처방 없음';rxWrap.appendChild(none);
    }
    body.appendChild(rxWrap);
    card.appendChild(body);
  }
  return card;
}

async function callSoapAI(rec,card,btn){
  const apiKey=localStorage.getItem('mr_claude_key');
  if(!apiKey){openSettingsModal();return;}
  const pt=patientsData.find(p=>p.id===rec.patientId)||{};
  const memo=(rec.memo||'').trim();
  if(!memo){alert('자유 메모를 먼저 입력하세요.');return;}
  btn.disabled=true;btn.textContent='생성 중...';
  const age=pt.birth?calcAge(pt.birth):'미상';
  const prompt=`당신은 한의원 SOAP 차팅 보조 도구입니다. 정형외과·재활의학과·통증클리닉 스타일의 차트 표현을 주로 사용합니다 (예: ROM, MMT, NRS, VAS, tender point, trigger point, radiculopathy 등). 주요 치료 중재 약어 (반드시 아래 약어 사용): AT(침), EA(전침), Cup/DC/WC(부항: DC=건식, WC=습식), Moxa(뜸), HP(핫팩), IP(아이스팩), TDP(경피적외선요법), Chuna(추나, 필요시 JS-flexion distraction·MET 등 세부 표기), P-AT(약침: 어혈 P-AT / 자하거 P-AT / DNA P-AT / 통원 P-AT), US-PAT(초음파약침).\n환자: ${pt.name||''} / ${pt.gender||''} / ${age}\n주요 병력: ${pt.conditions||''}\n\n자유 메모:\n${memo}\n\n작성 규칙:\n- 의학 약어는 영어로 표기 (예: CC, BP, HR, ROM, HTN, DM, Hx, Dx, Tx, Rx, c/o, r/o, s/p 등)\n- 수치·단위도 영어 약어 사용 (예: 120/80 mmHg, 36.5℃, BID, TID)\n- 근골격계 표현은 반드시 영어 약어 사용 (예: C-spine, L-spine, T-spine, Cx, Lx, Tx, SI joint, ROM F/E/LF/R, MMT Gr., NRS, VAS, TTP, TP, MTrP, SLR, FABER, Spurling test, Lasegue sign, AROM, PROM, MPS, HNP, DDD, OA, RA, fx, dislocation, sprain, strain, contusion 등)\n- 나머지 서술은 한국어로 작성\n- S 필드는 반드시 아래 4개 항목을 ①②③④ 번호와 함께 줄바꿈(\\n)으로 구분 (해당 내용 없으면 항목 생략): ① C/C, onset, duration, mechanism (외상력/유발요인) ② 통증 양상: NRS 또는 VAS, 성질(dull/sharp/throbbing/radiating 등), aggravating/relieving factors ③ 타과 Tx Hx: Ortho/Rehab/Pain clinic, 약물, 주사, PT, op Hx 등 ④ PMHx, 복용약, 직업·생활습관 관련 요인\n- O 필드는 아래 항목을 해당 내용이 있을 때만 포함, ①②③… 번호와 함께 줄바꿈(\\n)으로 구분. 각 항목 내 세부 소견이 여러 개면 ", "로 연결. 순서: ① Inspection: swelling/deformity/atrophy/posture 등 ② Palpation: TTP site, MTrP, taut band, muscle tone ③ ROM: AROM/PROM, 좌우 비교 ④ MMT: grade 표기 ⑤ Special tests: 각 검사 (+/-) 형식, 예: "(+) Spurling's, (-) Jackson" ⑥ Neuro: DTR, sensory, motor (필요시만) ⑦ US finding: 부위·소견·impression 순으로 기재 ⑧ 지참 영상/검사: X-ray·MRI report 등 (번호는 실제 포함 항목 기준으로 순서대로)\n- A 필드는 아래 항목을 해당 내용이 있을 때만 포함, ①②③ 번호와 함께 줄바꿈(\\n)으로 구분: ① 주진단 + 감별진단 (가능하면 ICD 또는 한·양방 병기, R/O 포함, 예: "Rt rotator cuff tendinopathy with subacromial impingement, R/O partial tear") ② 한의학적 변증 (원하면 포함, 예: 風寒濕痺·氣滯血瘀 등) ③ 상태 평가 (호전/불변/악화)\n- P 필드는 아래 항목을 해당 내용이 있을 때만 포함, ①②③ 번호와 함께 줄바꿈(\\n)으로 구분: ① 시술 내용 (AT·EA·Cup·Moxa·HP·IP·TDP·Chuna 등, 부위·횟수·자극강도 포함 가능) ② 약침 (P-AT 종류·용량 또는 US-PAT, 예: "어혈 P-AT 1cc, Lt. knee MM line") ③ 처방·교육·운동지도·재진 일정\n\n반드시 아래 JSON 형식으로만 응답하세요 (다른 텍스트 없이):\n{"s":"CC 및 주관적 증상","o":"O/E 소견 및 활력징후","a":"Dx 및 평가","p":"Tx 및 계획","terms":[{"abbr":"약어","full":"영문 전체명","ko":"한국어 뜻"}]}\n- terms에는 차팅에서 사용한 의학 약어 중 일반적이지 않은 것만 포함 (CC, ROM 등 기본 약어 제외)`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2048,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok){const errData=await res.json();throw new Error(errData.error?.message||res.statusText);}
    const data=await res.json();
    const text=data.content[0].text;
    const match=text.match(/\{[\s\S]*\}/);
    if(!match)throw new Error('응답에서 JSON을 찾을 수 없습니다');
    const parsed=JSON.parse(match[0]);
    const soapTas=card.querySelectorAll('.soap-ta');
    ['s','o','a','p'].forEach((k,i)=>{if(parsed[k]!==undefined&&soapTas[i]){rec[k]=parsed[k];soapTas[i].value=parsed[k];initTA(soapTas[i]);}});
    save(KEYS.records,recordsData);
    let newTermCount=0;
    (parsed.terms||[]).forEach(t=>{
      if(t.abbr&&!abbrsData.find(a=>a.abbr===t.abbr.toUpperCase())){
        abbrsData.push({abbr:t.abbr.toUpperCase(),full:t.full||'',ko:t.ko||'',date:todayStr()});
        newTermCount++;
      }
    });
    if(newTermCount>0){
      save(KEYS.abbrs,abbrsData);
      renderAbbrList(document.getElementById('abbr-search').value);
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
      document.querySelector('.tab-btn[data-tab="abbrs"]').classList.add('active');
      document.getElementById('tab-abbrs').classList.add('active');
    }
    setStatus('AI 차팅 완료 ✓'+(newTermCount>0?` (새 약어 ${newTermCount}개 추가)`:''));
  }catch(err){
    alert('AI 차팅 실패: '+err.message);
  }finally{
    btn.disabled=false;btn.textContent='✨ AI SOAP 차팅';
  }
}

/* ── Tab ── */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

/* ── Events ── */
document.getElementById('search-inp').addEventListener('input',e=>{searchQ=e.target.value;renderPatientList();});
document.getElementById('sync-change-btn').addEventListener('click',()=>{
  const code=prompt('다른 기기에 표시된 동기화 코드를 입력하세요:');
  if(code&&code.trim().length>=4){localStorage.setItem('b6ix_sync',code.trim().toUpperCase());setStatus('코드 변경됨 — 새로고침합니다...');setTimeout(()=>location.reload(),800);}
});

/* ── Init ── */
try{
  const lp=localStorage.getItem(KEYS.patients);if(lp)patientsData=JSON.parse(lp);
  const lrx=localStorage.getItem(KEYS.prescriptions);if(lrx)prescriptionsData=JSON.parse(lrx);
  const lr=localStorage.getItem(KEYS.records);if(lr)recordsData=JSON.parse(lr);
  const la=localStorage.getItem(KEYS.abbrs);if(la)abbrsData=JSON.parse(la);
  if(!abbrsData.length){abbrsData=[...DEFAULT_ABBRS];save(KEYS.abbrs,abbrsData);}
  else{let changed=false;DEFAULT_ABBRS.forEach(d=>{if(!abbrsData.find(a=>a.abbr===d.abbr)){abbrsData.push(d);changed=true;}});if(changed)save(KEYS.abbrs,abbrsData);}
}catch(e){}
document.getElementById('sync-code-display').textContent=getSyncCode();
renderPatientList();
renderAbbrList();

(async()=>{
  const[patients,prescriptions,records,abbrs]=await Promise.all([load(KEYS.patients),load(KEYS.prescriptions),load(KEYS.records),load(KEYS.abbrs)]);
  if(patients)patientsData=patients;
  if(prescriptions)prescriptionsData=prescriptions;
  if(records&&Array.isArray(records))recordsData=records;
  if(abbrs&&Array.isArray(abbrs)&&abbrs.length)abbrsData=abbrs;
  setSyncStatus('☁ 동기화됨');setStatus('불러옴 ✓');
  renderPatientList();
  renderAbbrList();
  if(selectedPatientId)renderDetail();
})();
</script>
</body>
</html>
