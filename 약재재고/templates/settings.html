{% extends "base.html" %}
{% block title %}설정{% endblock %}
{% block content %}
<div class="page-header">
    <h1>설정</h1>
    <p>약재별 단가 및 최소 재고 기준 설정</p>
</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">약재 설정 ({{ herbs|length }}종)</span>
        <button type="submit" form="settingsForm" class="btn btn-primary btn-sm">전체 저장</button>
    </div>
    <form method="post" id="settingsForm">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width:40px;">#</th>
                        <th>약재명</th>
                        <th style="width:160px;">1g 단가 (원)</th>
                        <th style="width:160px;">최소 재고 기준 (g)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for h in herbs %}
                    <tr>
                        <td style="color:rgba(255,255,255,0.2);">{{ loop.index }}</td>
                        <td style="font-weight:500;color:#e2e2e2;">{{ h.name }}</td>
                        <td>
                            <input type="number" name="price_{{ h.id }}"
                                   value="{{ '%.1f'|format(h.unit_price) }}"
                                   min="0" step="0.1"
                                   style="text-align:right;">
                        </td>
                        <td>
                            <input type="number" name="min_{{ h.id }}"
                                   value="{{ '%.0f'|format(h.min_stock) }}"
                                   min="0" step="1"
                                   placeholder="0"
                                   style="text-align:right;">
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:flex-end;">
            <button type="submit" class="btn btn-primary">전체 저장</button>
        </div>
    </form>
</div>
{% endblock %}
