<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>여행 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/tabler-icons.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여행플래너">
<meta name="theme-color" content="#7C3AED">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#F4F2FF;
  --surface:#FFFFFF;
  --surface-2:#F0EEFF;
  --border:#E2DCFA;
  --border-2:#CCC4EC;
  --text-1:#1A1535;
  --text-2:#5A527E;
  --text-3:#A094C0;
  --violet:#7C3AED;
  --violet-2:#9B67FF;
  --violet-light:#EDE9FE;
  --pink:#EC4899;
  --emerald:#10B981;
  --sky:#0EA5E9;
  --amber:#F59E0B;
  --coral:#F97316;
  --red:#EF4444;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}

body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text-1);
  min-height:100vh;
  padding:24px 14px 80px;
  -webkit-text-size-adjust:100%;
}

.page-wrap{max-width:760px;margin:0 auto;}

/* ── Header ── */
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.app-header h1{
  font-size:20px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:7px;
  background:linear-gradient(135deg,var(--violet) 0%,var(--pink) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.app-header h1 i{-webkit-text-fill-color:var(--violet);font-size:20px;}
.app-header-date{font-size:12px;color:var(--text-3);text-align:right;line-height:1.6;white-space:nowrap;}

/* ── Sync bar (표준 헤더 툴바) ── */
.hdr-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  margin-bottom:14px;padding:6px 10px;font-size:12px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 2px 8px rgba(100,60,220,.06);
}
.hdr-left{display:flex;align-items:center;gap:8px;color:var(--text-2);flex-wrap:wrap;}
.hdr-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.hdr-bar .sync-label{color:var(--text-3);}
.hdr-bar #sync-code-label{color:var(--violet);letter-spacing:3px;font-size:13px;font-weight:700;}
.hdr-bar #sync-status{color:var(--text-3);font-size:11px;white-space:nowrap;}
.hdr-bar #status-bar{font-size:11px;color:var(--text-3);padding-left:6px;border-left:1px solid var(--border-2);white-space:nowrap;}

.app-card{
  background:var(--surface);border-radius:20px;padding:18px 18px 14px;
  box-shadow:0 4px 28px rgba(100,60,220,.11),0 1px 4px rgba(100,60,220,.07);
  border:1px solid var(--border);
}

/* ── Tabs ── */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:18px;}
.tab{
  background:none;border:none;flex:1;
  padding:9px 6px;font-size:13px;font-family:var(--font-sans);font-weight:500;
  color:var(--text-3);cursor:pointer;user-select:none;
  border-bottom:2px solid transparent;margin-bottom:-2px;
  white-space:nowrap;border-radius:6px 6px 0 0;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:color .15s,background .15s;
}
.tab.active{color:var(--violet);border-bottom-color:var(--violet);font-weight:600;}
.tab:not(.active):hover{color:var(--text-1);background:var(--violet-light);}
.tab i{font-size:15px;}

.view{display:none;animation:fade .2s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.section-title{font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.section-title i{color:var(--violet);font-size:16px;}

/* ── Trip info form ── */
.trip-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:6px;}
.trip-grid .full{grid-column:1/-1;}
.field{display:flex;flex-direction:column;gap:4px;}
.field-label{font-size:10px;color:var(--text-3);font-weight:600;letter-spacing:.3px;}
.inp{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:9px 11px;font-size:14px;font-family:var(--font-sans);
  color:var(--text-1);transition:border-color .15s,box-shadow .15s;
}
.inp:focus{outline:none;border-color:var(--violet-2);box-shadow:0 0 0 3px rgba(124,58,237,.12);}
select.inp{cursor:pointer;}

/* ── Day cards ── */
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 14px 10px;margin-bottom:12px;box-shadow:0 1px 4px rgba(100,60,220,.05);}
.day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.day-badge{display:inline-flex;align-items:center;gap:6px;background:var(--violet-light);color:var(--violet);font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px;}
.day-date{font-size:12px;color:var(--text-3);white-space:nowrap;}
.day-cost{font-size:12px;color:var(--text-2);font-weight:600;white-space:nowrap;}

/* 투명 인라인 입력 (테두리·글로우 없음) */
.inline-inp{background:transparent;border:none;border-radius:0;padding:0;font-family:var(--font-sans);color:var(--text-1);width:100%;}
.inline-inp:focus{outline:none;}
.inline-inp::placeholder{color:var(--text-3);font-weight:400;}
.day-theme{flex:1 1 90px;min-width:60px;font-size:13px;font-weight:500;color:var(--text-2);}

/* 편집 가능한 일정 항목 행 */
.item{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--border);}
.item:first-of-type{border-top:none;}
.it-time{flex:0 0 72px;background:transparent;border:none;border-radius:0;padding:6px 0;font-size:12px;font-family:var(--font-sans);color:var(--violet);font-weight:600;}
.it-time:focus{outline:none;}
.item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding-top:2px;}
.it-place{font-size:14px;font-weight:500;}
.it-memo{font-size:12px;color:var(--text-2);resize:none;overflow:hidden;line-height:1.45;}
.it-cost{flex:0 0 86px;background:transparent;border:none;border-radius:0;padding:6px 0;font-size:12px;font-family:var(--font-sans);color:var(--coral);font-weight:600;text-align:right;}
.it-cost:focus{outline:none;}
.item-del{flex:0 0 auto;background:none;border:none;color:var(--text-3);cursor:pointer;font-size:16px;padding:2px;line-height:1;transition:color .15s;}
.item-del:hover{color:var(--red);}

.add-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.add-row .inp{padding:7px 9px;font-size:13px;border-radius:8px;}
.add-row .t-time{flex:0 0 72px;background:transparent;border:none;border-radius:0;padding:7px 0;color:var(--violet);font-weight:600;}
.add-row .t-time:focus{box-shadow:none;border:none;}
.add-row .t-place{flex:1 1 130px;}
.add-row .t-memo{flex:1 1 100%;}
.add-row .t-cost{flex:0 0 110px;background:transparent;border:none;border-radius:0;padding:7px 0;color:var(--coral);font-weight:600;}
.add-row .t-cost:focus{box-shadow:none;border:none;}
.btn{
  background:var(--violet);color:#fff;border:none;border-radius:8px;
  padding:8px 13px;font-size:13px;font-weight:600;font-family:var(--font-sans);
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  transition:opacity .15s,transform .1s;white-space:nowrap;
}
.btn:hover{opacity:.9;}
.btn:active{transform:scale(.96);}
.btn-sm{padding:7px 10px;font-size:12px;}
.btn-ghost{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--violet-light);color:var(--violet);opacity:1;}

.empty{text-align:center;color:var(--text-3);font-size:13px;padding:26px 10px;}

/* ── Expense ── */
.exp-form{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.exp-form .e-date{flex:1 1 120px;}
.exp-form .e-cat{flex:1 1 100px;}
.exp-form .e-desc{flex:2 1 150px;}
.exp-form .e-amount{flex:1 1 110px;}
.exp-form .e-payer{flex:1 1 100px;}
.exp-form .inp{padding:8px 10px;font-size:13px;border-radius:8px;}

.exp-day-group{margin-bottom:14px;}
.exp-day-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;padding:0 2px;}
.exp-day-head .sub{color:var(--text-1);}
.exp-item{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:6px;}
.cat-chip{flex:0 0 auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;}
.exp-desc{flex:1;font-size:13px;color:var(--text-1);min-width:0;word-break:break-word;}
.exp-payer{flex:0 0 auto;font-size:11px;color:var(--text-3);}
.exp-amount{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--text-1);text-align:right;}
.amount-edit{
  width:90px;text-align:right;background:transparent;border:none;border-radius:0;
  font-size:13px;font-weight:700;color:var(--text-1);font-family:var(--font-sans);padding:0;
}
.amount-edit:focus{outline:none;color:var(--violet);}
.exp-del{flex:0 0 auto;background:none;border:none;color:var(--text-3);cursor:pointer;font-size:15px;padding:2px;line-height:1;}
.exp-del:hover{color:var(--red);}

/* ── Summary ── */
.sum-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.sum-box{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:13px 12px;text-align:center;}
.sum-box .lbl{font-size:11px;color:var(--text-3);font-weight:600;margin-bottom:5px;}
.sum-box .val{font-size:17px;font-weight:700;letter-spacing:-.5px;}
.sum-box .val.over{color:var(--red);}
.sum-box .val.pos{color:var(--emerald);}

.bar-track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:4px 0 16px;}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--pink));transition:width .4s ease;}
.bar-fill.over{background:linear-gradient(90deg,var(--coral),var(--red));}

.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cat-row .cat-name{flex:0 0 64px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;}
.cat-row .cat-dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;}
.cat-bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:999px;}
.cat-row .cat-amt{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--text-2);min-width:78px;text-align:right;}

.payer-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:6px;}
.payer-row .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
.payer-row .am{font-size:13px;font-weight:700;}

.split-card{background:linear-gradient(135deg,var(--violet) 0%,var(--pink) 100%);color:#fff;border-radius:14px;padding:15px 16px;margin-bottom:16px;text-align:center;}
.split-card .lbl{font-size:12px;opacity:.85;margin-bottom:4px;}
.split-card .val{font-size:22px;font-weight:700;letter-spacing:-.5px;}
.split-card .sub{font-size:11px;opacity:.8;margin-top:3px;}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,21,53,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal-bg.show{display:flex;}
.modal{background:var(--surface);border-radius:18px;padding:20px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(40,20,90,.3);}
.modal h3{font-size:15px;margin-bottom:6px;}
.modal p{font-size:12px;color:var(--text-2);line-height:1.6;margin-bottom:12px;}
.modal .inp{margin-bottom:12px;text-align:center;letter-spacing:2px;font-weight:600;text-transform:uppercase;}
.modal-actions{display:flex;gap:8px;}
.modal-actions .btn{flex:1;justify-content:center;}

.toolbar{display:flex;gap:7px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}

/* ── Mobile ── */
@media(max-width:480px){
  body{padding:18px 10px 80px;}
  .app-card{padding:15px 13px 12px;border-radius:16px;}
  .trip-grid{grid-template-columns:1fr;}
  .sum-hero{gap:7px;}
  .sum-box{padding:11px 7px;}
  .sum-box .val{font-size:15px;}
  .tab{font-size:12px;padding:9px 3px;}
  .tab i{font-size:14px;}
  .app-header h1{font-size:18px;}
}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="app-header">
    <h1><i class="ti ti-plane-tilt"></i>여행 플래너</h1>
    <div class="app-header-date" id="hdr-date"></div>
  </div>

  <div class="hdr-bar">
    <div class="hdr-left">
      <span class="sync-label">☁ 동기화 코드</span>
      <strong id="sync-code-label">----</strong>
      <button class="btn btn-ghost btn-sm" id="sync-code-btn">다른 기기 연결</button>
      <span id="sync-status">오프라인</span>
    </div>
    <div class="hdr-right">
      <button class="btn btn-ghost btn-sm" id="btn-export">⬆ 내보내기</button>
      <button class="btn btn-ghost btn-sm" id="btn-import">⬇ 가져오기</button>
      <input type="file" id="import-file" accept="application/json" style="display:none">
      <button class="btn btn-sm" id="btn-save">저장</button>
      <span id="status-bar">불러오는 중...</span>
    </div>
  </div>

  <div class="app-card">
    <div class="tabs">
      <button class="tab active" data-view="plan"><i class="ti ti-map-2"></i>일정</button>
      <button class="tab" data-view="ledger"><i class="ti ti-wallet"></i>가계부</button>
      <button class="tab" data-view="summary"><i class="ti ti-chart-pie"></i>요약</button>
    </div>

    <!-- ── 일정 ── -->
    <section class="view active" id="view-plan">
      <div class="section-title"><i class="ti ti-luggage"></i>여행 정보</div>
      <div class="trip-grid">
        <div class="field full">
          <span class="field-label">여행 제목</span>
          <input class="inp" id="trip-title" placeholder="예) 제주도 3박 4일">
        </div>
        <div class="field">
          <span class="field-label">시작일</span>
          <input class="inp" id="trip-start" type="date">
        </div>
        <div class="field">
          <span class="field-label">종료일</span>
          <input class="inp" id="trip-end" type="date">
        </div>
        <div class="field">
          <span class="field-label">인원수</span>
          <input class="inp" id="trip-people" type="number" min="1" step="1" value="1">
        </div>
        <div class="field">
          <span class="field-label">총예산 (원)</span>
          <input class="inp" id="trip-budget" type="text" inputmode="numeric" placeholder="0">
        </div>
      </div>

      <div class="section-title" style="margin-top:18px;"><i class="ti ti-calendar-event"></i>일자별 일정</div>
      <div id="days-wrap"></div>
    </section>

    <!-- ── 가계부 ── -->
    <section class="view" id="view-ledger">
      <div class="section-title"><i class="ti ti-receipt"></i>지출 추가</div>
      <div class="exp-form">
        <select class="inp e-date" id="exp-date"></select>
        <select class="inp e-cat" id="exp-cat"></select>
        <input class="inp e-desc" id="exp-desc" placeholder="내용 (예: 점심 흑돼지)">
        <input class="inp e-amount" id="exp-amount" type="text" inputmode="numeric" placeholder="금액">
        <input class="inp e-payer" id="exp-payer" placeholder="결제자">
        <button class="btn" id="exp-add"><i class="ti ti-plus"></i>추가</button>
      </div>
      <div class="section-title"><i class="ti ti-list-details"></i>지출 내역</div>
      <div id="exp-wrap"></div>
    </section>

    <!-- ── 요약 ── -->
    <section class="view" id="view-summary">
      <div class="sum-hero">
        <div class="sum-box"><div class="lbl">총예산</div><div class="val" id="s-budget">0</div></div>
        <div class="sum-box"><div class="lbl">총지출</div><div class="val" id="s-spent">0</div></div>
        <div class="sum-box"><div class="lbl">잔액</div><div class="val" id="s-left">0</div></div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="s-bar" style="width:0%"></div></div>

      <div class="split-card">
        <div class="lbl">1인당 분담액</div>
        <div class="val" id="s-percap">0원</div>
        <div class="sub" id="s-percap-sub">인원 1명 기준</div>
      </div>

      <div class="section-title"><i class="ti ti-chart-bar"></i>카테고리별 지출</div>
      <div id="s-cats"></div>

      <div class="section-title" style="margin-top:16px;"><i class="ti ti-users"></i>결제자별 지출</div>
      <div id="s-payers"></div>
    </section>
  </div>
</div>

<!-- 동기화 코드 모달 -->
<div class="modal-bg" id="sync-modal">
  <div class="modal">
    <h3>동기화 코드</h3>
    <p>다른 기기에서 같은 코드를 입력하면 일정과 가계부가 공유됩니다. 코드를 바꾸면 해당 코드의 데이터로 전환됩니다.</p>
    <input class="inp" id="sync-input" maxlength="8" placeholder="코드 입력">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="sync-cancel">취소</button>
      <button class="btn" id="sync-apply">적용</button>
    </div>
  </div>
</div>

<script>
/* ───────── 상수 ───────── */
const KEYS={trip:'travel_trip',expenses:'travel_expenses'};
const CATS=[
  {id:'식비',color:'#F97316'},
  {id:'교통',color:'#0EA5E9'},
  {id:'숙박',color:'#7C3AED'},
  {id:'관광',color:'#10B981'},
  {id:'쇼핑',color:'#EC4899'},
  {id:'기타',color:'#A094C0'},
];
const catColor=id=>(CATS.find(c=>c.id===id)||CATS[5]).color;
const WD=['일','월','화','수','목','금','토'];

/* ───────── 상태 ───────── */
let trip={title:'',start:'',end:'',people:1,budget:0,days:[]};
let expenses=[];
let saveTimer=null;

/* ───────── 유틸 ───────── */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const won=n=>(Number(n)||0).toLocaleString('ko-KR');
const onlyNum=s=>String(s).replace(/[^\d]/g,'');
const isoLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function fmtDate(s){if(!s)return'';const d=new Date(s+'T00:00:00');if(isNaN(d))return s;return `${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})`;}
function setStatus(t){const e=document.getElementById('status-bar');if(e)e.textContent=t;}

/* 날짜 범위 → days 배열 (기존 일정 항목 보존) */
function buildDays(){
  const out=[];
  if(trip.start && trip.end){
    const s=new Date(trip.start+'T00:00:00'), e=new Date(trip.end+'T00:00:00');
    if(!isNaN(s)&&!isNaN(e)&&e>=s){
      for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)){
        const iso=isoLocal(d);
        const prev=trip.days.find(x=>x.date===iso);
        out.push(prev?prev:{date:iso,items:[]});
        if(out.length>60)break;
      }
    }
  }
  trip.days=out;
}

  wrap.innerHTML='';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* 해당 Day 카드의 예상비용 합계만 즉시 갱신 */
function updateDayCost(di){
  const card=document.querySelectorAll('.day-card')[di];if(!card||!trip.days[di])return;
  const sum=trip.days[di].items.reduce((s,i)=>s+(Number(i.cost)||0),0);
  const el=card.querySelector('.day-cost');if(el)el.textContent=sum?'예상 '+won(sum)+'원':'';
}

function growTA(ta){if(ta.scrollHeight>ta.offsetHeight)ta.style.height=ta.scrollHeight+'px';}

function renderExpDateOptions(){

  }else{
    const today=isoLocal(new Date());

function renderExpenses(){

/* ───────── 렌더: 요약 ───────── */
function renderSummary(){
  const spent=expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const budget=Number(trip.budget)||0;
  const left=budget-spent;
  const people=Math.max(1,Number(trip.people)||1);
  document.getElementById('s-budget').textContent=won(budget);
  document.getElementById('s-spent').textContent=won(spent);
  const leftEl=document.getElementById('s-left');
  leftEl.textContent=won(left);
  leftEl.className='val '+(left<0?'over':left>0?'pos':'');
  const pct=budget>0?Math.min(100,spent/budget*100):(spent>0?100:0);
  const bar=document.getElementById('s-bar');
  bar.style.width=pct+'%';
  bar.className='bar-fill'+(budget>0&&spent>budget?' over':'');

  document.getElementById('s-percap').textContent=won(Math.round(spent/people))+'원';
  document.getElementById('s-percap-sub').textContent=`인원 ${people}명 기준 · 총지출 ${won(spent)}원`;

  // 카테고리
  const byCat={};
  expenses.forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+(Number(e.amount)||0);});
  const max=Math.max(1,...Object.values(byCat));
  const catWrap=document.getElementById('s-cats');
  const used=CATS.filter(c=>byCat[c.id]);
  catWrap.innerHTML=used.length?used.map(c=>`
    <div class="cat-row">
      <span class="cat-name"><span class="cat-dot" style="background:${c.color}"></span>${c.id}</span>
      <span class="cat-bar-track"><span class="cat-bar-fill" style="width:${byCat[c.id]/max*100}%;background:${c.color}"></span></span>
      <span class="cat-amt">${won(byCat[c.id])}원</span>
    </div>`).join(''):'<div class="empty">지출 데이터가 없습니다.</div>';

  // 결제자
  const byPayer={};
  expenses.forEach(e=>{const p=(e.payer||'').trim()||'미지정';byPayer[p]=(byPayer[p]||0)+(Number(e.amount)||0);});
  const pWrap=document.getElementById('s-payers');
  const pk=Object.keys(byPayer);
  pWrap.innerHTML=pk.length?pk.sort((a,b)=>byPayer[b]-byPayer[a]).map(p=>`
    <div class="payer-row"><span class="nm"><i class="ti ti-user"></i>${esc(p)}</span><span class="am">${won(byPayer[p])}원</span></div>`).join(''):'<div class="empty">지출 데이터가 없습니다.</div>';
}

/* 일정/가계부 위임 이벤트 */
function bindDelegates(){
  const wrap=document.getElementById('days-wrap');
  wrap.addEventListener('input',e=>{
    const el=e.target,f=el.dataset.f;if(!f)return;
    const di=Number(el.dataset.day),id=el.dataset.id;
    // 날짜별 테마 (재렌더 없이 모델만 — 한글 IME 보호)
    if(f==='theme'){if(trip.days[di]){trip.days[di].theme=el.value;scheduleSave('trip');}return;}
    // 신규 추가 행 (data-id 없음)
    if(!id){
      if(el.classList.contains('t-memo'))growTA(el);
      if(f==='cost'){const v=onlyNum(el.value);el.value=v?won(v):'';}
      return;
    }
    // 기존 항목 인라인 편집 (재렌더 없이 모델만)
    const it=trip.days[di]&&trip.days[di].items.find(x=>x.id===id);
    if(!it)return;
    if(f==='place'){it.place=el.value;}
    else if(f==='memo'){it.memo=el.value;growTA(el);}
    else if(f==='cost'){const v=onlyNum(el.value);el.value=v?won(v):'';it.cost=Number(v)||0;updateDayCost(di);renderSummary();}
    scheduleSave('trip');
  });
  // 시간 변경 시에만 재렌더(시간순 재정렬) — time 입력은 IME 무관
  wrap.addEventListener('change',e=>{
    const el=e.target;if(el.dataset.f!=='time'||!el.dataset.id)return;
    const di=Number(el.dataset.day),id=el.dataset.id;
    const it=trip.days[di]&&trip.days[di].items.find(x=>x.id===id);
    if(it){it.time=el.value;renderDays();renderSummary();scheduleSave('trip');}
  });
  wrap.addEventListener('click',e=>{
    const add=e.target.closest('[data-add]');
    if(add){addItem(Number(add.dataset.add));return;}
    const del=e.target.closest('[data-del]');
    if(del){
      const di=Number(del.dataset.day),id=del.dataset.del;
      trip.days[di].items=trip.days[di].items.filter(x=>x.id!==id);
      renderDays();renderSummary();scheduleSave('trip');
    }
  });

  // 가계부
  document.getElementById('exp-add').addEventListener('click',addExpense);
  const expWrap=document.getElementById('exp-wrap');
  expWrap.addEventListener('click',e=>{
    const d=e.target.closest('[data-edel]');
    if(d){expenses=expenses.filter(x=>x.id!==d.dataset.edel);renderExpenses();renderSummary();scheduleSave('expenses');}
  });
  expWrap.addEventListener('focusin',e=>{if(e.target.classList.contains('amount-edit'))e.target.value=onlyNum(e.target.value);});
  expWrap.addEventListener('blur',e=>{
    if(e.target.classList.contains('amount-edit')){
      const id=e.target.dataset.amt;const v=Number(onlyNum(e.target.value))||0;
      const ex=expenses.find(x=>x.id===id);if(ex){ex.amount=v;e.target.value=won(v);renderSummary();
        // 소계 갱신을 위해 헤더만 다시
        const grp=e.target.closest('.exp-day-group');if(grp){const sub=[...grp.querySelectorAll('.amount-edit')].reduce((s,el)=>s+(Number(onlyNum(el.value))||0),0);grp.querySelector('.sub').textContent=won(sub)+'원';}
        scheduleSave('expenses');}
    }
  },true);
  expWrap.addEventListener('input',e=>{if(e.target.classList.contains('amount-edit')){const c=onlyNum(e.target.value);e.target.value=c;}});
  expWrap.addEventListener('keydown',e=>{if(e.target.classList.contains('amount-edit')&&e.key==='Enter')e.target.blur();});

  // 빠른 지출 입력 금액 콤마
  const ea=document.getElementById('exp-amount');
  ea.addEventListener('input',e=>{const v=onlyNum(e.target.value);e.target.value=v?won(v):'';});
  document.getElementById('exp-desc').addEventListener('keydown',e=>{if(e.key==='Enter')addExpense();});
  ea.addEventListener('keydown',e=>{if(e.key==='Enter')addExpense();});
}

function addItem(di){
  const card=document.querySelectorAll('.day-card')[di];if(!card)return;
  const q=f=>card.querySelector(`.add-row [data-f="${f}"]`);
  const time=q('time').value, place=q('place').value.trim();
  const cost=Number(onlyNum(q('cost').value))||0, memo=q('memo').value.trim();
  if(!place&&!time){q('place').focus();return;}
  trip.days[di].items.push({id:uid(),time,place,cost,memo});
  renderDays();renderSummary();scheduleSave('trip');
}

function addExpense(){
  const date=document.getElementById('exp-date').value;
  const category=document.getElementById('exp-cat').value;
  const desc=document.getElementById('exp-desc').value.trim();
  const amount=Number(onlyNum(document.getElementById('exp-amount').value))||0;
  const payer=document.getElementById('exp-payer').value.trim();
  if(!amount&&!desc){document.getElementById('exp-desc').focus();return;}
  expenses.push({id:uid(),date:date||isoLocal(new Date()),category,desc,amount,payer});
  document.getElementById('exp-desc').value='';
  document.getElementById('exp-amount').value='';
  renderExpenses();renderSummary();scheduleSave('expenses');
  document.getElementById('exp-desc').focus();
}

function getSyncCode(){let c=localStorage.getItem('travel_sync');if(!c){c=(Math.random().toString(36).slice(2,5)+Math.random().toString(36).slice(2,5)).toUpperCase();localStorage.setItem('travel_sync',c);}return c;}
function setSyncStatus(t){const e=document.getElementById('sync-status');if(e)e.textContent=t;}
function docRef(key){return db.collection('travel').doc(getSyncCode()).collection('data').doc(key);}
function wrapVal(val){return {__json:JSON.stringify(val)};}
function unwrapVal(v){return(v&&v.__json)?JSON.parse(v.__json):v;}

async function loadKey(key){
  // Firestore 우선
  try{const d=await docRef(key).get();if(d.exists){const val=unwrapVal(d.data().value);localStorage.setItem(key,JSON.stringify(val));return val;}}catch(e){}
  try{const v=localStorage.getItem(key);const parsed=v?JSON.parse(v):null;
    if(parsed!=null){try{await docRef(key).set({value:wrapVal(parsed),ts:Date.now()});}catch(e){}}
    return parsed;
  }catch(e){return null;}
}
async function saveKey(key,val){
  try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}
  try{setSyncStatus('동기화 중...');await docRef(key).set({value:wrapVal(val),ts:Date.now()});setSyncStatus('☁ 동기화됨');}
  catch(e){setSyncStatus('오프라인');}
}
function scheduleSave(which){

    if(which==='trip'||which==='all')saveKey(KEYS.trip,trip);

async function boot(reload){
  document.getElementById('sync-code-label').textContent=getSyncCode();
  setSyncStatus('동기화 중...');
  const [t,ex]=await Promise.all([loadKey(KEYS.trip),loadKey(KEYS.expenses)]);
  trip=Object.assign({title:'',start:'',end:'',people:1,budget:0,days:[]},t||{});
  if(!Array.isArray(trip.days))trip.days=[];
  expenses=Array.isArray(ex)?ex:[];
  buildDays();
  hydrateInputs();
  renderCatOptions();
  renderAll();
  setSyncStatus(navigator.onLine?'☁ 동기화됨':'오프라인');
  setStatus('불러옴 ✓');
}

  bindTabs();
  bindTripFields();
  bindDelegates();
  bindSyncModal();
  document.getElementById('btn-save').addEventListener('click',saveNow);
  document.getElementById('btn-export').addEventListener('click',exportData);
  document.getElementById('btn-import').addEventListener('click',()=>document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value='';});
  boot();
});
</script>
</body>
</html>
