<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0b;
      font-family: 'Inter', sans-serif;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 87, 255, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(56, 189, 248, 0.05), transparent);
    }

    .calculator {
      width: 340px;
      background: #111113;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.5),
        0 24px 64px rgba(0, 0, 0, 0.6),
        0 4px 16px rgba(0, 0, 0, 0.4);
    }

    /* Header */
    .calc-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
    }

    .calc-title {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Display */
    .display {
      padding: 24px 24px 16px;
      text-align: right;
    }

    .expression {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.3);
      font-weight: 400;
      min-height: 18px;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result {
      font-size: 44px;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: -0.03em;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.15s;
    }

    .result.small { font-size: 28px; }
    .result.error { color: #f87171; font-size: 24px; }

    /* Buttons */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: rgba(255, 255, 255, 0.05);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    button {
      background: #111113;
      border: none;
      color: #e2e2e2;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 400;
      padding: 0;
      height: 72px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, transform 0.08s;
      position: relative;
      overflow: hidden;
      letter-spacing: -0.01em;
    }

    button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      transition: opacity 0.15s;
    }

    button:hover::after { opacity: 0.04; }
    button:active { transform: scale(0.96); }
    button:active::after { opacity: 0.08; }

    /* Span 2 columns */
    button.span2 { grid-column: span 2; }

    /* Function buttons (AC, +/-, %) */
    button.fn {
      color: rgba(255, 255, 255, 0.55);
      font-size: 14px;
      font-weight: 500;
    }

    /* Operator buttons */
    button.op {
      color: #a78bfa;
      font-size: 20px;
    }

    button.op:hover::after { opacity: 0.06; }

    /* Equals button */
    button.eq {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      color: #fff;
      font-size: 20px;
    }

    button.eq:hover { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    button.eq::after { display: none; }

    /* Zero spans 2 cols, align left */
    button.zero { text-align: left; padding-left: 28px; }

    /* Bottom-left rounded */
    .buttons button:nth-last-child(4) { border-bottom-left-radius: 0; }
    .buttons button:last-child { border-bottom-right-radius: 0; }

    /* Rounded bottom corners via wrapper */
    .btn-wrap {
      border-radius: 0 0 20px 20px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="calc-header">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <span class="calc-title">Calculator</span>
    </div>

    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="btn-wrap">
      <div class="buttons">
        <button class="fn" onclick="clear()">AC</button>
        <button class="fn" onclick="toggleSign()">+/−</button>
        <button class="fn" onclick="percent()">%</button>
        <button class="op" onclick="setOp('÷')">÷</button>

        <button onclick="input('7')">7</button>
        <button onclick="input('8')">8</button>
        <button onclick="input('9')">9</button>
        <button class="op" onclick="setOp('×')">×</button>

        <button onclick="input('4')">4</button>
        <button onclick="input('5')">5</button>
        <button onclick="input('6')">6</button>
        <button class="op" onclick="setOp('−')">−</button>

        <button onclick="input('1')">1</button>
        <button onclick="input('2')">2</button>
        <button onclick="input('3')">3</button>
        <button class="op" onclick="setOp('+')">+</button>

        <button class="zero span2" onclick="input('0')">0</button>
        <button onclick="inputDot()">·</button>
        <button class="eq" onclick="calculate()">=</button>
      </div>
    </div>
  </div>

  <script>
    let current = '0';
    let stored = null;
    let operator = null;
    let justCalculated = false;

    const resultEl = document.getElementById('result');
    const exprEl = document.getElementById('expression');

    function updateDisplay(val) {
      const str = String(val);
      resultEl.className = 'result';
      if (str === 'Error') {
        resultEl.classList.add('error');
        resultEl.textContent = 'Error';
      } else {
        if (str.length > 10) resultEl.classList.add('small');
        resultEl.textContent = formatNum(str);
      }
    }

    function formatNum(str) {
      if (str.includes('e')) return str;
      const [int, dec] = str.split('.');
      const formatted = Number(int).toLocaleString('ko-KR');
      return dec !== undefined ? `${formatted}.${dec}` : formatted;
    }

    function input(digit) {
      if (justCalculated) { current = digit; justCalculated = false; }
      else if (current === '0' && digit !== '.') current = digit;
      else if (current.length < 12) current += digit;
      updateDisplay(current);
    }

    function inputDot() {
      if (justCalculated) { current = '0.'; justCalculated = false; }
      else if (!current.includes('.')) current += '.';
      updateDisplay(current);
    }

    function setOp(op) {
      if (operator && !justCalculated) calculate(true);
      stored = parseFloat(current.replace(/,/g, ''));
      operator = op;
      exprEl.textContent = `${formatNum(current)} ${op}`;
      justCalculated = true;
    }

    function calculate(chained = false) {
      if (operator === null || stored === null) return;
      const b = parseFloat(current.replace(/,/g, ''));
      let result;
      if (operator === '÷' && b === 0) { resultEl.className = 'result error'; resultEl.textContent = 'Error'; exprEl.textContent = ''; operator = null; stored = null; current = '0'; return; }
      switch (operator) {
        case '+': result = stored + b; break;
        case '−': result = stored - b; break;
        case '×': result = stored * b; break;
        case '÷': result = stored / b; break;
      }
      if (!chained) exprEl.textContent = `${formatNum(String(stored))} ${operator} ${formatNum(current)} =`;
      const resultStr = parseFloat(result.toPrecision(12)).toString();
      current = resultStr;
      updateDisplay(resultStr);
      if (!chained) { operator = null; stored = null; }
      justCalculated = true;
    }

    function clear() {
      current = '0'; stored = null; operator = null; justCalculated = false;
      exprEl.textContent = '';
      updateDisplay('0');
    }

    function toggleSign() {
      current = String(parseFloat(current) * -1);
      updateDisplay(current);
    }

    function percent() {
      current = String(parseFloat(current) / 100);
      updateDisplay(current);
    }

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') input(e.key);
      else if (e.key === '.') inputDot();
      else if (e.key === '+') setOp('+');
      else if (e.key === '-') setOp('−');
      else if (e.key === '*') setOp('×');
      else if (e.key === '/') { e.preventDefault(); setOp('÷'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') clear();
      else if (e.key === 'Backspace') {
        if (current.length > 1) current = current.slice(0, -1);
        else current = '0';
        updateDisplay(current);
      }
    });
  </script>
</body>
</html>
